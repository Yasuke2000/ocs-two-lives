  ["check", "staff", "Check that every chapter and quest of generated/quests.js (tools/gen_quests.py) is loaded by FTB Quests."],
  ["tick", "staff", "Run the Life 1 milestone check of a soul now (whispers, primer book)."],
  ["expect", "test", "Assert a milestone whisper was said this life, or that the primer book was given."],
]

[sidequest]
group = "story"
who = "player"
does = "Side jobs from the adventurers of the canon continent: fetch, escort, cull and parcel jobs."
subs = [
  ["status", "player", "Your active side jobs."],
  ["offers", "player", "The jobs offered where you stand (the adventurers' work button)."],
  ["take", "player", "Take a job; its giver place must be within settings.take_radius."],
  ["abandon", "player", "Drop a job (an escort client walks off, a parcel is taken back)."],
  ["turnin", "player", "Hand in fetch jobs that have no hand-in place."],
  ["start", "staff", "Start a job without the giver check (FTB quest reward `ttl sidequest start {p} <id>`)."],
  ["complete", "test", "Force a job to complete."],
  ["fail", "test", "Force a job to fail."],
  ["poll", "test", "Run the job poll now for one soul or all."],
  ["goto", "test", "Stand a player at a place."],
  ["bring", "test", "Bring the player's escort clients beside them."],
  ["reset", "staff", "Forget a player's side record and stages."],
  ["where", "staff", "Where a place resolves to now."],
  ["expect", "test", "Assert jobs, places, parcels, clients, progress or whether a start would be refused."],
]

[adventurers]
group = "story"
who = "staff"
does = "The ambient adventurers (Easy NPCs) in guild halls, plazas and road camps of the continent, who give side jobs."
subs = [
  ["list", "staff", "Places and their adventurers."],
  ["populate", "staff", "Fill one place (or all) up to its cap now."],
  ["sweep", "staff", "Remove adventurers of an old rev or an unknown place and extras over the cap."],
  ["clear", "staff", "Remove the adventurers of one place or all."],
  ["hold", "test", "Stop the ambient loop from spawning for `seconds` (0 releases)."],
  ["expect", "test", "Assert how many adventurers a place has."],
]

