# The hand-written half of docs/dev/ttl-commands.md (tools/gen_ttl_commands.py reads this file and the KubeJS source).
#
# What the source gives the generator: which commands and subcommands exist, their arguments, and which ones are
# op-only (`.requires(op)`). What it cannot give is written here: the group, what a command does and what it is for.
# One table per top-level /ttl command:
#   group = life | story | world | builds | bosses | nations | paths | social | ops
#   who   = player (anyone, permission level 0) | staff (op level 2) | test (op level 2, hooks for tests/ingame/*.rcon)
#   does  = one line: what it does, what it is for
#   subs  = [[path, who, does], ...]  path is the subcommand as typed after the command, `<name>` for an argument
#           (`<target> give` = the subcommand `give` after the argument). Every direct subcommand in the source needs
#           a row (a deeper path may stand for several). `test` rows of one command are printed on one line.
#   runtime_ops = true: the source checks the op level inside the handler instead of `.requires`, so the generator
#           accepts staff rows under a command the tree shows as open (events).
# `python tools/gen_ttl_commands.py --check` fails when the source and this file disagree.

# ---------------------------------------------------------------------------------------------------------------
# Life and rebirth
# ---------------------------------------------------------------------------------------------------------------

[wish]
group = "life"
who = "player"
does = "Spirit Corridor, step 1: pick your Last Wish by id. It sets the pool your unique skill is drawn from."

[trial]
group = "life"
who = "player"
does = "Spirit Corridor, step 2: face the Trial of the Soul instead of choosing a race straight away. Passing it lets you pick 1 of 3 uniques; without it one is drawn at random."

[answer]
group = "life"
who = "player"
does = "Answer the question of the running Trial of the Soul."

[choose]
group = "life"
who = "player"
does = "Spirit Corridor: take one of the offered races for Life 2."

[unique]
group = "life"
who = "player"
does = "Spirit Corridor: after a passed Trial, take one of the three offered unique skills (granted through the registry)."

[menu]
group = "life"
who = "player"
does = "Reopen the menu the current Corridor step needs (wish, race, unique), for example after a relog."

[rebirth]
group = "life"
who = "player"
does = "Start the rebirth into Life 2 once the Corridor flow is at its last step."

[reborn]
group = "life"
who = "staff"
does = "Applies a rebirth with the given race. The ttl-portals reincarnation menu (Great Sage scene) runs it when a race is confirmed; by hand only to repair a soul."

[status]
group = "life"
who = "player"
does = "Prints your life phase (Life 1, Corridor, Life 2) and the current Corridor step."

[life]
group = "life"
who = "player"
does = "The Life screen: what your first life earned (karma, tier, verdict)."

[karma]
group = "life"
who = "staff"
does = "Karma of a soul: stats, axes, score and tier (a live preview in Life 1)."
subs = [
  ["set", "staff", "Make a Life 1 stat exactly `n` (admin fixes, bot tests)."],
  ["pick", "test", "Take the first unique option at the unique step."],
  ["sample", "test", "One activity sample as if the timer fired (active time, exploration)."],
  ["act", "test", "Mark the player as having acted since the last sample."],
  ["explore", "test", "Visit n squares in a row from x z (the daily cap applies)."],
  ["odds", "test", "400 trial draws from a wish's pool with the soul's tier weights; fails when the rare share is off by more than 10 points."],
  ["expect", "test", "Assert a karma field (tier, dark, days, bosses, offers, step, phase, ledger ...)."],
]

[reset]
group = "life"
who = "staff"
does = "Sends a soul back to a fresh Life 1: clears items, stages, registry holds, every other Tensura ability (skills, magic, arts, race intrinsics; resistances back to the start of learning), the body (EP, existence, spirits) back to a fresh Human, karma, soul, reputation, story, absorb and artificer data. With `/ttl absorb clear` the only way to give a soul its awakening claim back."

[wipe]
group = "life"
who = "test"
does = "The abilities ManasCore keeps on a soul, with their mastery, and its max magicule (what `/ttl reset` and the Life 1 death take off)."
subs = [
  ["expect", "test", "Assert a held ability (`has <skill> yes|no`), the number of held abilities (`count`), or a max magicule ceiling (`magicule`)."],
]

[life1]
group = "life"
who = "staff"
does = "Life 1 status for staff and testers: jump a Life 1 soul to a karma tier to try what it unlocks. Logged and stamped on the soul."
subs = [
  ["status", "staff", "Without a preset: tier, score, days, Dark and the staff stamp. With a preset (`underdog`, `normal`, `elite`, `legendary`, `dark`, karma.toml [presets]): set the Life 1 stats that reach it."],
  ["days", "staff", "Set the days survived in Life 1."],
]

[sleep]
group = "life"
who = "test"
does = "Test hooks of sleeping through the night in the Mortal Realm (the night slept away there moves the shared clock)."
subs = [
  ["<target>", "test", "`bed`: a bed in the sky above the soul and the soul asleep in it (fails when Minecraft refuses); `clear`: that bed removed; `expect awake|mortal`: the soul is awake / in the Mortal Realm."],
  ["expect", "test", "`expect morning`: the shared clock is in the early morning."],
]

[soul]
group = "life"
who = "staff"
does = "Soul carryover: the Soul Gem (issued once, kept through death) and the enchantment the soul remembers. `soul <target>` shows what the soul holds."
subs = [
  ["<target> give", "staff", "Issue a Soul Gem if the body holds none."],
  ["<target> use", "test", "The Life 2 echo (short Regeneration + Resistance), as a right-click would."],
  ["<target> clear", "staff", "Forget the gem flag, the remembered enchantment and the cooldown."],
  ["expect", "test", "Assert a soul field, or how many stacks of an item the body holds."],
]

[stash]
group = "life"
who = "staff"
does = "The Life 1 strip: banned items kept in the soul stash and soulbound stacks kept for rebirth. Without a subcommand: what the soul holds."
subs = [
  ["sweep", "staff", "Run the banned-item sweep now (Life 1 in the Mortal dimensions)."],
  ["clear", "staff", "Empty the soul stash and the kept list (a /ttl reset leaves them)."],
  ["equip", "test", "Put one item into the first free Curios slot."],
  ["soulbound", "test", "Treat that item id as soulbound until the next script reload."],
  ["spell", "test", "Assert whether a cast of an Iron's Spells school is refused where the player stands."],
  ["expect", "test", "Assert a stash field."],
]

[spells]
group = "life"
who = "staff"
does = "Iron's Spells in Life 1: in the Mortal dimensions Iron's spends its own mana, not Tensura magicules (issue #104). Without a subcommand: magicules, Iron's mana and max mana."
subs = [
  ["mana", "test", "Set the player's Iron's mana."],
  ["cancast", "test", "Assert whether a spellbook cast of a spell passes Iron's checks (mana, cooldown, learning) where the player stands."],
  ["cost", "test", "Assert the Iron's mana a spellbook cast asks for (`plain` = the spell's own cost)."],
  ["cast", "test", "Start a real spellbook cast of a spell (an instant one goes off on the next tick)."],
  ["spent", "test", "Assert that the last `cast` took its plain mana and no magicules."],
  ["summons", "test", "Assert that at least n spell summons of the player stand within 16 blocks."],
]

[racelock]
group = "life"
who = "staff"
does = "The Human lock of Life 1 (a Life 1 soul with another race is set back to Human within 5 s). Without a subcommand: the soul's race and whether the lock applies."
subs = [
  ["enforce", "test", "Run the lock now."],
  ["expect", "test", "Assert the race id."],
]

[grant]
group = "life"
who = "staff"
does = "Grant a unique skill to a soul through the registry (caps and the Legendary ceiling apply)."

[reconcile]
group = "life"
who = "staff"
does = "Match the registry to the uniques a soul really holds (it also runs every 5 minutes)."

[registry]
group = "life"
who = "staff"
does = "The unique-skill registry: who holds which unique, caps, the Legendary ceiling, the transfer log. Every grant and revoke goes through it."
subs = [
  ["slots", "staff", "Legendary slots used and free in the current era."],
  ["free", "staff", "Release a unique whose holder is gone."],
  ["history", "staff", "The newest 20 transfers (grants, revokes, returns to the pool), for one skill or all."],
  ["sweep", "staff", "Return to the pool now every unique of a holder inactive for skills.toml [registry] inactive_days."],
  ["migrate", "staff", "Convert name-keyed records to UUID-keyed ones."],
  ["transfer", "staff", "Move a unique from one holder to another by route (duel, war, bequest, awakening, staff; default staff)."],
  ["legend", "staff", "Grant a Legendary that uses a per-era slot, as a rebirth Legend pick does."],
  ["legendcap", "test", "Replace max_holders and slots_per_era for a test; `reset` puts them back."],
  ["seen", "test", "Pretend a soul was last seen `days` days ago."],
  ["legacy", "test", "Write a name-keyed legacy record for the migrate test."],
  ["expect", "test", "Assert counts, holders, rarity, the last transfer or pending returns."],
]

[era]
group = "life"
who = "player"
does = "The current era and the Legendary slots left. An era is a server-wide season; Legendary slots are counted per era."
subs = [
  ["next", "staff", "Start the next era (archives and clears the era titles; `silent` posts nothing)."],
  ["set", "staff", "Set the era number."],
  ["reset", "staff", "Back to era 1: clears the Legendary slot ledger, era titles and archive."],
  ["title", "staff", "Give a soul an era title."],
  ["testmark", "test", "Save the era state."],
  ["testrestore", "test", "Put the saved era state back, silently."],
  ["expect", "test", "Assert era number, slots used or free, or a soul's title count."],
]

[core]
group = "life"
who = "player"
does = "Skill Cores (dropped by bosses)."
subs = [
  ["open", "player", "Open a Skill Core from your inventory (Life 2 only). Staff can add a player name to open one for them without an item."],
  ["odds", "test", "300 draws from the Skill Core pool with the soul's weights; prints how many were Legendary, Rare, Common or none."],
  ["expect", "test", "Assert how many uniques the registry lists for a soul."],
]

[absorb]
group = "life"
who = "player"
does = "How a unique changes hands between souls in Life 2: duel, bequest, awakening, challenge and war. Every route is a knob in skills.toml [absorb]."
subs = [
  ["status", "player", "Your absorb cooldown, open pacts and the awakenings you have used."],
  ["duel", "player", "Offer a consensual duel anywhere in Life 2. The loser's Legendary goes to the winner, Rare and Common are copied."],
  ["accept", "player", "Accept a pending duel or bequest from a soul."],
  ["decline", "player", "Refuse a pending duel or bequest."],
  ["bequest", "player", "Hand one of your uniques on voluntarily (the other soul must accept)."],
  ["free", "player", "A True Demon Lord or True Hero lists the free Legendaries it may claim."],
  ["claim", "player", "A True Demon Lord or True Hero claims a free Legendary (once per soul)."],
  ["challenge", "player", "A True Demon Lord or True Hero challenges a weaker Legendary holder; the holder cannot refuse."],
  ["simulate", "staff", "Run a kill between two souls through the absorb rules (optionally by a route) to see the result."],
  ["ep", "test", "Fake a soul's EP for the absorb gate."],
  ["war", "staff", "Flag two souls as being at war (their Legendary changes hands on a kill); `clear` drops all flags."],
  ["awake", "test", "Fake an awakening kind and state on a soul."],
  ["clear", "staff", "Forget one soul's absorb state, including its awakening claim."],
  ["testwipe", "test", "Wipe a soul's local absorb data for a test."],
  ["expect", "test", "Assert open pacts, war flags, or a soul's cooldown, options, awakenings and combat state."],
]

[liability]
group = "life"
who = "staff"
does = "Duel damage liability: whoever starts a duel in a public place pays for the blocks that get broken there. These are the staff and test tools."
subs = [
  ["where", "staff", "Where a player stands: which public place, and who is paid, or the wild."],
  ["sweep", "staff", "Settle finished or expired duels now."],
  ["clear", "staff", "Drop every damage record."],
  ["testbreak", "test", "The player breaks the block two above their head through the normal break path."],
  ["expect", "test", "Assert recorded changes, liability, arena or public place of a player, or the block above them."],
]

