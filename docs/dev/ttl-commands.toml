subs = [
  ["status", "staff", "Your own path, acts and marks come from plain `/ttl story`; this shows the same lines for another player."],
  ["oath", "player", "Open the Oath choice, or swear it directly (light, dark, unaligned); a party leader's Oath binds the party. Staff can swear for a player."],
  ["talk", "player", "What a story NPC says to you now (what NPC dialog buttons run)."],
  ["fight", "player", "Start a boss fight from the story when you stand near its arena. Staff can start it for a player from anywhere."],
  ["flip", "player", "Atonement or Corruption, once per soul, after a quest has opened it."],
  ["capstone", "player", "Retry your personal Act VII after your team finished the book."],
  ["act", "staff", "Complete act n for a soul (the quest command reward `ttl story act @p 2`)."],
  ["flag", "staff", "Set a story flag on a soul."],
  ["unflag", "staff", "Remove a story flag."],
  ["set", "staff", "Set the path exactly (light, dark, none) without any deltas."],
  ["reset", "staff", "Forget all story state of a soul."],
