plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.139'
}

version = mod_version
group = 'com.yasuke.ttl'
base { archivesName = 'ttl-portals' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.266'
    mods {
        ttl { sourceSet sourceSets.main }
    }
}

repositories {
    // Tensura, ManasCore, Architectury and Iron's Spells are only compiled against; the pack ships them.
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    compileOnly 'maven.modrinth:Br0kXPwc:WuoYFS45'   // Tensura: Reincarnated 2.0.1.5
    compileOnly 'maven.modrinth:lhGA9TYQ:xGfBrBzj'   // Architectury 13.0.12
    compileOnly 'maven.modrinth:s4OWxYQQ:slKLosTb'   // Iron's Spells 'n Spellbooks 3.16.3 (Life 1 mana, SpellManaMixin)
}

// ManasCore ships its modules (race, skill, ...) as nested jars; compile against the extracted ones.
configurations { manascoreBundle { transitive = false } }
dependencies { manascoreBundle 'maven.modrinth:wRRSWpd1:yhLQMaxS' }   // ManasCore 4.0.0.2
def extractManascore = tasks.register('extractManascore', Copy) {
    from({ zipTree(configurations.manascoreBundle.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('manascore')
}
dependencies {
    compileOnly files(['race', 'skill', 'storage', 'config', 'network'].collect { "build/manascore/manascore-${it}-neoforge-4.0.0.2.jar" }).builtBy(extractManascore)
}

// One version source (gradle.properties) for the jar name and the mod metadata.
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: mod_version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Offline self-checks of the canon map and the own world's design rasters (pure Java; Minecraft classes only where
// available): part of `gradlew build` through `check`.
def selfCheckLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
tasks.register('selfCheckCanon', JavaExec) {
    description = 'CanonGrid self-check (synthetic canon map, sites, zones, Lerfing format)'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = selfCheckLauncher
    mainClass = 'com.yasuke.ttl.world.CanonGrid'
}
tasks.register('selfCheck', JavaExec) {
    description = 'Own-world design self-check (rasters, density math, masks, structure exclusion, sites) and the CanonGrid self-check'
    group = 'verification'
    dependsOn 'selfCheckCanon'
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = selfCheckLauncher
    mainClass = 'com.yasuke.ttl.world.DesignSelfCheck'
    // WP-W1's real rasters when tools/world/build.py has written them (git-ignored; skipped when absent).
    args = [file('../world/build').absolutePath]
    // Minecraft's bootstrap (tried for the density-function check) writes logs/ into the working directory.
    def dir = layout.buildDirectory.dir('selfcheck').get().asFile
    workingDir = dir
    doFirst { dir.mkdirs() }
}
tasks.named('check') { dependsOn 'selfCheck' }
