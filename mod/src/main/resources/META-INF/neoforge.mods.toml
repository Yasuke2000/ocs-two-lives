description = '''
Links the Mortal Realm (Life 1) to its own Nether and End, so Life 1 never reaches the Tensura world's
Nether or End, and gives the Mortal End its own dragon fight. Also: /ttlbot test players, /ttlmenu on-screen choice menus, /quietly for scripted commands, and the Life 2 rebirth through Tensura's reincarnation menu (the Great Sage scene) with per-player race offers. /bug files a report (GitHub issue when configured).
'''

