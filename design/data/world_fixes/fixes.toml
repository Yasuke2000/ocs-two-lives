# One-time world fixes on the Life 2 overworld (life/world_fixes.js, run by the works runner in life/works.js after the
# builds, landmarks, roads and forests): bounded commands for a defect a placer left in the terrain that its own repair
# does not reach. Each [<id>] runs once (persistentData ttl.fix.<id>.version = version); bump version to run it again.
# python tools/gen_placements.py -> generated/placements.js (it checks every fill's volume and that it stays in `area`).
#
#   title    what it fixes;  why: where the defect was found
#   area     [x0, z0, x1, z1]: the chunks held (tickets) while the commands run; every command's box lies inside it
#   commands absolute-coordinate commands, run in order in the overworld (fill <= 32768 blocks each); a fill whose
#            filter finds nothing is a no-op ("No blocks were filled"), counted as nothing to do, never as a failure

# OWN WORLD (own-world-switch): no fixes. raja_lava, sacred_mountain_water and frost_palace_skirt repaired defects of
# Lerfing's imported terrain at its coordinates; on the own world those boxes are other places (git history has them).
