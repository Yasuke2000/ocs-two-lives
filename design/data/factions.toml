# Eurazania (獣王国ユーラザニア), the Beast Kingdom: Carrion the Beast Master's realm of beastmen south of Jura,
# an agricultural, tropical land famous for its fruit, whose people honour strength (design/lore/world.md §B, laura.md;
# tensura.fandom.com/wiki/Beast_Kingdom_of_Eurazania and /wiki/Carrion). Clayman's Walpurgis scheme set Milim on it and
# its old capital fell; Tempest helped raise the new one, Laura (the `laura` build). Seeds: beastfolk souls start
# Friendly (as dwarves with Dwargon) and the valor axis counts (our interpretation: Carrion and his Three Beastketeers
# respect strength). Its throne is Carrion's; the walpurgis_held milestone (world.toml) opens the conflict over it.
[[faction]]
id = "eurazania"
title = "Beast Kingdom of Eurazania"
region = "B"
capital = "Laura (Eurazania capital, rebuilt)"
tensura_mirror = false
npc_tags = ["ttl.npc.eurazania"]
npc_types = []
kill_penalty = { npc = 15, player = 5 }
decay_per_week = 2
territory = "domain"
domain = { capital = "build:laura", builds = ["laura"] }
throne = { boss = "carrion", statue = "carrion_laura", seat = "laura" }
[faction.seed]
race = { beastfolk = 20 }
axis = { valor = 10 }

[[faction]]
id = "outcast"
