# Factions and reputation (design/architecture/sprint3-4.md S3). Scripts: pack/kubejs/server_scripts/ttl/rep/
# (rep.js = the API other systems call, guards.js = what a kill costs, commands.js = /ttl rep).
# Edit, then run `python tools/gen_data.py` (it checks every entry). Test: tests/ingame/factions.rcon.
#
# Reputation is an integer per player and faction, from `min` to `max`. Its band decides:
#   - the stage ttl.faction.<id>.<band> (exactly one per faction; FTB Quests `stage` tasks gate on it),
#   - the scoreboard mirror ttl.rep.<id> (the raw number, for Easy NPC conditions and quests "at least n"),
#   - guards (rules.guard_attack_at) and shops (rules.shop_refuse_at), read through TtlRep.guardsHostile / shopOpen.
# A band starts at its threshold: value >= friendly is Friendly, value <= hostile is Hostile, Neutral is in between.
#
# Where it comes from (other packages call TtlRep.add): karma and race at rebirth (the [faction.seed] tables
# below), faction quests, bosses, bounties, merit. Where it goes: kill_penalty (guards.js) and decay_per_week.

[rules]
min = -100
max = 100
guard_attack_at = "hostile"     # guards turn on a player whose band is this or lower
shop_refuse_at = "hostile"      # shops refuse a player whose band is this or lower ("below Unfriendly"); raise to "unfriendly" for a gentler gradient
decay_days = 7                  # decay_per_week is applied once per this many real days
log_size = 200                  # entries kept in the server ring ttl.rep.log (/ttl rep log)
# Tensura keeps its own scalar `reputation` (-100..100, hostile at -50: PlayerConfig$Reputation) for its dwarf
# trades and guards. The faction with tensura_mirror = true has its value written into it on every change.
# Our hostile threshold below equals Tensura's -50, so Dwargon's guards and shops agree with ours.
seed_axis_cap = 100             # an axis score counts up to this much of its seed (axis score / cap, at most 1)

# Default band thresholds; a faction may override them with its own bands = { ... }.
[bands]
hostile = -50
unfriendly = -20
friendly = 20
honored = 50
exalted = 80

# Renown: one number for "how much is this soul worth to the world", derived from what the server already tracks and
# recomputed on demand (TtlRep.renown), every 5 minutes and at login; never stored as the truth. Not money: coins stay
# Tensura coins. The nations package values a nation as the sum of its members' renown plus holdings. Mirrors:
# scoreboard ttl.renown and player persistentData ttl.renown. Life 1 souls have none (0).
#   total = tier[Life 1 karma tier] + Σ boss[stage held] + Σ stage[stage held] + Σ band[band with each faction]
#           + Σ unique[rarity of each unique held through the registry] + bonus (TtlRep.addRenown: quests, merit, staff)
# Result is never below renown.min.
[renown]
min = 0
tier = { underdog = 0, normal = 5, elite = 15, legendary = 30 }   # ids of karma.toml tiers
boss = { "ttl.boss.t1" = 10, "ttl.boss.t2" = 20, "ttl.boss.t3" = 40, "ttl.boss.t4" = 80 }
stage = { "ttl.artifice.rank4" = 10, "ttl.necro.rank4" = 10 }   # any other stage worth points, "ttl.x" = n (Grand Artificer and the Overlord: paths §3.5)
band = { hostile = -5, unfriendly = -2, neutral = 0, friendly = 3, honored = 8, exalted = 15 }   # per faction
unique = { common = 4, rare = 10, legendary = 25 }                  # skills.toml rarities

# Canon domains (world/domains.js; design/architecture/world-state.md §6.6, H1, H4; WP-W3). A block guard, not adventure
# mode: inside a domain on the canon continent a player who may not edit there cannot break or place blocks, use the items
# below on blocks, and explosions spare its blocks. Doors, chests, crafting stations and NPC dialogue keep working.
# Outside the continent (the ring, the free lands, tensura:boss_area and every dimension world.toml does not call inside)
# nothing here applies. Who may edit: ops (staff_level), the ruling nation of the faction (WP-W16), members as member_edit
# allows, everyone as conflict_edit allows while the world chronicle has a conflict over the faction open.
[domains]
enabled = true
capital_radius = 256            # default square round a capital (blocks each way); Tempest's 192x192 growth square fits inside
member_edit = "land"            # faction members (stage ttl.faction.<f>.member): none | land (the capital square outside its
                                # canon builds and landmarks; WP-W16 narrows it to Public Works) | all
conflict_edit = "all"           # while TtlChronicle.conflict(<f>) is open: none | land | all (owner: protected UNTIL a conflict)
staff_level = 2                 # permission level that is never stopped
unowned_builds = true           # canon builds no faction lists are protected too (no members, never lifted): closes H4
unowned_skip = []               # build names left open anyway
use_items = ["minecraft:flint_and_steel", "minecraft:fire_charge", "minecraft:bone_meal", "minecraft:shears"]
use_suffixes = ["bucket", "_axe", "_hoe", "_shovel"]   # item ids ending so (fluids, stripping, tilling, paths)
use_exempt = ["minecraft:milk_bucket"]
warn_seconds = 5                # the "you cannot ... here" line, at most once per this many seconds per player
refresh_seconds = 10            # the domain list (placed builds and landmarks) is re-read this often
# Residents (H1, R9): Tempest's goblins come back. Anchors (canon characters) are Invulnerable and come back at the second
# check that finds them gone; the others stay killable (kill_penalty.npc) and come back respawn_minutes after.
invulnerable = "named"          # named (Rigurd, Rigur, Gobta, Haruna) | all | none
respawn_minutes = 5
respawn_check_ticks = 100       # the resident check (only residents whose chunk is loaded are judged)
confirm_checks = 2              # checks in a row that must find a resident gone before it is summoned again

# Fields of a faction:
#   id            lowercase id, used in stages, scoreboards and commands
#   title         shown to players
#   region        canon region letter (pack/config/ttl/canon_regions.json) whose ground this faction owns;
#                 killing its NPCs or other players there costs reputation. Omit for a faction with no land.
#   capital       canon landmark name (canon_regions.json), shown in /ttl rep
#   hidden        true: only listed once the player's value is not 0
#   tensura_mirror  true: mirror into Tensura's own reputation scalar
#   npc_tags      entity tags (/tag <npc> add ttl.npc.dwargon) that mark an Easy NPC or mob as this faction's
#   npc_types     entity types that are always this faction's NPCs, wherever they stand
#   kill_penalty  { npc = n, player = n }: points lost for killing one of its NPCs / a player on its ground
#   decay_per_week  points per decay_days that drift back toward 0 (positive and negative)
#   [faction.seed]  starting reputation at rebirth: race = { <race id> = n }, axis = { <karma axis> = n } (n at
#                   full axis score; scaled by axis score / rules.seed_axis_cap), dark = n when the soul is Dark
#                   (karma chaos path). All matching entries add up, then the sum is clamped.
#   territory     "domain" (default): only the domain below is protected; "region": the faction's whole canon letter
#                 is (the knob for a land that should be sealed; owner decision O-W15: none ships so)
#   domain        the canon nation's PROTECTED land (world/domains.js, design/architecture/world-state.md §6.6), on the canon
#                 continent only: { capital = "tempest" | "dwargon" (the settlement) | "build:<name>" | "landmark:<name>" (the
#                 placed one), or omitted (the faction's canon `capital`); capital_radius = n (a square of n blocks round the
#                 capital, default [domains] capital_radius); builds = [design/builds names, "tempest", "dwargon"]; landmarks =
#                 [landmarks.toml names] }. gen_data writes the nominal centre as domain.center. A build or landmark belongs
#                 to one domain at most.
#   throne        the ruler fight and the seated anchor of a canon throne (WP-W16 walks the road to it): { boss = <bosses.toml
#                 id>, statue = <npcs.toml [[hook]] or [[spot]] id>, seat = <build name, "tempest" or "dwargon">, roads =
#                 [world.toml [rule] modes] (default all; Tempest is vassal-only: it is the players' own capital) }. Omitted
#                 where the throne needs a lore-named proxy boss first (Blumund, Falmuth: O-W18, WP-W16).

[[faction]]
id = "tempest"
title = "Jura-Tempest Federation"
region = "J"
capital = "Tempest (Rimuru, capital of the Federation)"
tensura_mirror = false
npc_tags = ["ttl.npc.tempest"]
npc_types = []
kill_penalty = { npc = 15, player = 5 }
decay_per_week = 1
territory = "domain"
domain = { capital = "tempest", builds = ["tempest", "sealed_cave", "spirit_gate", "treyni_shrine"], landmarks = ["goblin_village", "treyni_grove", "ogre_village_ruin"] }
throne = { boss = "rimuru_ogre_fight", seat = "tempest", roads = ["vassal"] }
[faction.seed]
race = { slime = 20, goblin = 20, ogre = 10, hobgoblin = 10, lizardman = 5 }
axis = {}

[[faction]]
id = "dwargon"
title = "Armed Nation of Dwargon"
region = "D"
capital = "Dwargo (Dwargon cavern capital)"
tensura_mirror = true
npc_tags = ["ttl.npc.dwargon"]
npc_types = ["tensura:dwarf"]
kill_penalty = { npc = 15, player = 5 }
decay_per_week = 2
territory = "domain"
# Not the dwarf village on the Dwarven Road: it is the open road-side village newcomers reach first from the Life 2 arrival
# (220 blocks west of it on Lerfing's map), where they must be able to trade and build (gen_data refuses a domain over the arrival).
domain = { capital = "dwargon", builds = ["dwargon"] }
throne = { boss = "gazel_dwargo", statue = "gazel_throne", seat = "dwargon" }
[faction.seed]
race = { dwarf = 20 }
axis = { craft = 10 }

