# ---------------------------------------------------------------------------------------------------------------------
# Side quests (the mechanics). `id` is also the stage set on success: ttl.quest.side.<id>. Fields by kind:
#   all       id, title, kind, giver (place: where `/ttl sidequest take` works; "" = anywhere), text (said on start),
#             minutes (time limit, 0 = none), repeat_hours (0 = once per soul), requires (stages), reward (optional
#             payout here: { coins = {...}, rep = {...} }; the authored chapters pay through FTB instead, so it stays empty)
#   escort    client ([[client]] id), from (place where the client waits; "" = beside the soul), to (place), ambush =
#             [{ at = 0.0-1.0 of the way, mobs = { "<entity>" = n } }]
#   deliver   parcel (item name), to (place), pickup (place where the parcel is first collected; "" = given at start)
#   travel    to (place), radius
#   fetch     items = { "<item>" = n }, at (place where they are handed in automatically; "" = `/ttl sidequest turnin` anywhere)
#   cull      entity, count, region (faction id of factions.toml, the kill counts only there) or near (place) + radius

[[quest]]
id = "goblin_raiders"
title = "Goblin Raiders of Blumund"
kind = "cull"
giver = "blumund_guild"
entity = "tensura:goblin"
count = 6
region = "blumund"
repeat_hours = 168
text = "Rogue goblins from beyond the forest are raiding Blumund's farms. Only kills inside Blumund count: Tempest's goblins are not your quarry."

