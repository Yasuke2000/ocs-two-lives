# Side content of Life 2 (sidequests work package, 18/11/2026): the classic isekai side jobs, the adventurers who
# populate the towns, and the ones you can hire. Four consumers:
#   python tools/gen_data.py     -> TtlData.sidequests (checked by tools/sidequests_check.py)
#   python tools/gen_npcs.py     -> one Easy NPC preset per [[adventurer]] (ttl_adv_<id>), per hireable adventurer
#                                   (ttl_comp_<id>) and per [[client]] (ttl_client_<id>); `--spots` also checks the build
#                                   anchored [[place]] homes against the structure files
#   pack/kubejs/server_scripts/ttl/sidequests/*.js   the mechanics (escort, deliver, travel, fetch, cull), the ambient
#                                   adventurers and the companions
#   design/quests/chapter_2x_side_*.toml   the authored FTB chapters that start these jobs (command rewards) and pay them
#                                   (stage tasks ttl.quest.side.<id>)
# Radiant boards (world-state.md §6.8, a later wave) call TtlSide.start(server, player, kind, params) with the same fields
# as a [[quest]] below; they never need a row here.
#
# Rule R11 (world-state.md §2.0): everything here lives on the canon continent. Places are checked against
# pack/config/ttl/canon_map.txt by the generator, and the scripts skip a place whose position reads "outside".

[settings]
# Mechanics poll (escort follow and ambush, delivery, travel, cull sampling, discovery), in ticks.
poll_ticks = 40
# Side quests one soul may carry at once.
max_active = 3
# `/ttl sidequest take <id>` (the player's own command, the Easy NPC "work" button) needs the giver place within this many blocks.
take_radius = 24
# Discovery: a [[place]] with discover = true is "seen" (stage ttl.quest.side.seen.<place>) within this many blocks.
discover_radius = 32
# Escort: the client counts as arrived within arrive_radius of the destination; it is lost when the soul stays farther
# than leash blocks away (or in another dimension) for leash_seconds; the client waiting at `from` appears when the soul
# comes within appear_radius of it.
arrive_radius = 10
leash = 48
leash_seconds = 60
appear_radius = 24
client_hp = 30
# Ambush waves spawn this far from the client (min, max blocks) and are set on it.
ambush_distance = [10, 16]
# Delivery: the parcel counts as handed over within deliver_radius of the recipient place.
deliver_radius = 8
# Travel: default arrival radius when a quest names none.
travel_radius = 24

[companions]
enabled = true
# Hired companions per soul at once.
max_per_soul = 1
# The party cap of 5 (FTB max_party_size, decisions 18/11/2026) counts the online party members PLUS every companion
# they have hired: a full party of five hires nobody, a party of four may hire one. A companion never joins the FTB team.
party_cap = 5
# Boss credit: companions are never credited (bosses/boss.js counts players only; a companion's last hit counts as "no
# player credited", which shares the kill among the players in range as before). There is no knob to change that here.
# A companion farther than this from its owner (same dimension) is brought to them; another dimension: it follows
# through the next poll.
teleport_distance = 32
# A soul that is offline this long loses the companion (contract over, no refund); a shorter absence keeps it (the
# companion is put away at logout and summoned again at login).
offline_grace_minutes = 30

[ambient]
enabled = true
# A place is checked this often (ticks) and only while a player is within active_range of it and its chunk is loaded;
# one missing adventurer is spawned per check (the town fills up over a minute), never more than the place's cap.
check_ticks = 200
active_range = 96
# Day/night: from night_start to night_end (day time, 0-24000) adventurers walk to the place's `inn` (when it has one).
night_start = 13000
night_end = 23500
# Bump to replace every ambient adventurer (and companion look) with a fresh one from the current presets.
rev = 1

# ---------------------------------------------------------------------------------------------------------------------
# Places. `anchor`:
#   tempest   x/y/z are offsets from Tempest's arrival point (ttl.tempest.arrival), like npcs.toml
#   build     x/y/z are blueprint coordinates of `build` (ttl.build.<build>.corner + x/y/z), checked by gen_npcs.py --spots
#   build_at  the build's own anchor point (ttl.build.<build>.at); no x/y/z
#   dwargon   x/y/z are blueprint coordinates of blueprints/dwargon.py (corner = TtlDwargon.box(), y = ttl.dwargon.base)
#   landmark  the placed landmark (ttl.landmark.<landmark>.at, else its planned x/z from landmarks.toml, surface y)
#   world     at = "<design/data/anchors.toml id>" (gen_data writes its x/z), standing on the surface (heightmap) once
#             the chunk is loaded; y = 0
# `cap` = ambient adventurers kept there (0 = a quest target only), `kinds` = who may appear, `radius` = their stroll
# (Easy NPC RANDOM_STROLL_AROUND_HOME wanders about 10 blocks from home whatever this says; `radius` only spreads the
# spawn on surface places), `inn` = where they go at night (same anchor), `discover` = gives the stage
# ttl.quest.side.seen.<id> on arrival (travel quests and the book read it), `title` = the name players read.

