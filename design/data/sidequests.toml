# ---------------------------------------------------------------------------------------------------------------------
# Adventurers. Generic folk of the guilds (never a canon character: those are npcs.toml's story cast). `skin` is an
# Easy NPC built-in variant of `model` (gen_npcs.py VARIANTS); our own PNG ttl:textures/entity/npc/adv_<id>.png is used
# when it exists. `lines`: up to 6 short speech-bubble lines, one picked at random now and then (Easy NPC MESSAGE action on
# ON_INTERVAL_NORMAL with a CHANCE condition; no chat spam). `hire` makes the adventurer recruitable:
#   fee = coin table (a sink: TtlEcon.charge) · minutes = contract length (real time) · hp · weapon (item id) ·
#   armor = "" | "leather" | "chainmail" | "iron" · rank = guild rank letter shown in the offer.

[[adventurer]]
id = "rookie_swordsman"
name = "Bram"
title = "F-rank swordsman"
name_color = "#9BC53D"
model = "humanoid"
skin = "FARMER_01"
lines = [
  "Three days a rookie and I've already lost a sword to a horned rabbit.",
  "They say the Free Guild takes anyone. They weren't lying.",
  "Herb gathering again? I wanted to slay dragons!",
  "If you see a slime, let me have it. I need the points.",
  "My mother wanted me to be a baker.",
]
[adventurer.hire]
fee = { silver = 5 }
minutes = 60
hp = 24
weapon = "minecraft:stone_sword"
armor = "leather"
rank = "F"

[[adventurer]]
