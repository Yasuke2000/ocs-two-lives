# Karma v1: what a player did in Life 1 decides their rebirth tier (design/master-plan.md §2–3).
# Scripts: pack/kubejs/server_scripts/ttl/karma/ (karma.js scores, tracking.js records, view.js shows).
# Edit, then run `python tools/gen_data.py`. Check a change with `/ttl karma <player>` (a live preview for
# Life 1 players) and the bot test tests/ingame/karma.rcon (`tools/server.sh test karma`).
#
# How the score works
#   1. Every stat below is counted from the moment Life 1 starts until the Life 1 death (start snapshot,
#      difference at death). Vanilla statistics are read through scoreboard objectives `ttl.s.<key>` with
#      the stat as criterion: the game keeps those up to date itself.
#   2. Each stat adds  weight × value / per  to its axis ("raw karma").
#   3. Each axis scores  100 × ln(1 + raw / k)  — the log curve means grinding one thing gives less and less.
#   4. Total score = Σ (axis score × axis weight) + best_axis_bonus × the best (weighted) axis score.
#   5. The tier is the highest one below whose min_score, min_days and min_bosses are all met.
#   6. A soul is Dark when the chaos axis is high enough (see [dark]); that adds dark races to its offers.
# Changing a stat's criterion resets that stat for players who are mid-Life 1 (the objective is recreated).
#
# Anti-farming (the numbers are in [activity], [explore] and [kill_cap] below)
#   - Longevity counts ACTIVE time only: every track_seconds a sample adds that many seconds if the player moved
#     on foot, looked around or did something (break/place/use/chat) since the last sample. AFK is not counted.
#   - Kills are diminishing per kind of mob: the first kill_cap.full of one kind count in full, further ones count
#     kill_cap.tail each, and one kind never gives more than kill_cap.max. Stats flagged `capped = true` follow
#     the same curve per stat (raid and golem farms).
#   - Exploration counts distinct squares of the Mortal Realm entered on foot (no boat, mount or elytra), with a
#     daily cap, instead of the farthest distance reached.

best_axis_bonus = 0.5      # rewards having one thing you were really good at
default_tier = "normal"    # souls with no Life 1 record (died before karma existed, or reset into the Corridor)
track_seconds = 20         # how often tracked stats (active time, exploration, Nether/End visits) are sampled
ticks_per_day = 24000      # one Minecraft day of play (20 minutes); "days survived" = Life 1 play time / this

# ---- Axes --------------------------------------------------------------------------------------------
# k      = raw karma at which the axis scores ~69 (100 × ln 2); raise k to make an axis harder to fill.
# weight = how much the axis counts in the total (0 = shown but not counted).
[axes.valor]       # fighting: kills, kinds of foe, bosses, daring trips
k = 100
weight = 1.0
[axes.order]       # good deeds for others: trade, defend villages, tend animals
k = 40
weight = 1.0
[axes.chaos]       # dark deeds: killing villagers, golems, traders, players; starting raids
k = 40
weight = 0.5       # the dark path climbs tiers too (Demon Lord path), but slower than good deeds
[axes.craft]       # making things: mining, smithing, anvils
k = 40
weight = 1.0
[axes.faith]       # learning: enchanting, brewing, advancements
k = 40
weight = 1.0
[axes.longevity]   # staying alive
k = 60
weight = 1.0

# ---- Anti-farming knobs ------------------------------------------------------------------------------
[activity]               # what counts as "active" in one sample (see the play_time stat)
min_move = 1.5           # blocks walked since the last sample (not riding, swimming or gliding: those drift)
min_turn = 15            # degrees of looking around since the last sample
# Any block broken or placed, item used or chat line since the last sample also counts as active.

[explore]                # the `far` stat: distinct squares entered on foot in the Mortal Realm
cell_size = 64           # blocks; the world is cut into cell_size x cell_size squares
cell_value = 64          # what a new square adds to `far` ("blocks": 100 of them = 1 raw valor)
daily_cap = 30           # new squares credited per real day (UTC); one that is over the cap can be earned another day

[kill_cap]               # diminishing returns per kind of mob (valor from `stat`, plus every stat flagged capped)
stat = "mob_kills"       # the total-kills stat that is split over the kinds in [hostiles]
full = 30                # the first 30 kills of one kind count 1 each
tail = 0.15              # every further kill of that kind counts this much
max = 80                 # one kind never counts for more than this many kills
other_full = 100         # same three knobs for kills that are in no [hostiles] kind (mostly animals and the rest)
other_tail = 0.15
other_max = 200

# ---- Stats -------------------------------------------------------------------------------------------
# key       = short id: objective `ttl.s.<key>`, `/ttl karma <p> set <key> <n>`, and the record in persistentData
# criterion = vanilla stat criterion (minecraft.custom:…, minecraft.killed:…, minecraft.mined:…)
#   or track = one of active | far | nether | end | advancements (sampled by karma/tracking.js, no scoreboard)
# axis, weight, per = what one unit is worth (see the top); per defaults to 1
# group, label     = where the Life screen shows it (stats with the same label are added together)
# format           = days (ticks shown as days + hours) | blocks | explored (squares) | visited (yes/no); plain count otherwise
# major            = a great boss: counts toward a tier's min_bosses
# capped           = kills follow the [kill_cap] curve (diminishing after kill_cap.full)

[[stats]]
key = "play_time"
track = "active"         # ticks of ACTIVE play in Life 1 (idle/AFK time does not count, see [activity])
axis = "longevity"
weight = 10              # 10 raw per day survived
per = 24000
group = "life"
label = "Days survived"
format = "days"

[[stats]]
key = "far"
track = "far"            # new squares entered on foot in the Mortal Realm x [explore].cell_value
axis = "valor"
weight = 1               # 1 raw per 100 blocks of ground explored
per = 100
group = "life"
label = "Ground explored"
format = "explored"

[[stats]]
key = "nether"
track = "nether"         # set once the player is seen in ttl:mortal_nether
axis = "valor"
weight = 20
group = "life"
label = "Walked the Mortal Nether"
format = "visited"

[[stats]]
key = "end"
track = "end"            # set once the player is seen in ttl:mortal_end
axis = "valor"
weight = 30
group = "life"
label = "Reached the Mortal End"
format = "visited"

[[stats]]
key = "mob_kills"
criterion = "minecraft.custom:minecraft.mob_kills"
axis = "valor"
weight = 0.2             # 500 kills = 100 raw; kinds of foe (below) count more than numbers
