# ---- Kinds of foe ------------------------------------------------------------------------------------
# One objective per mob (`ttl.s.kill.<path>`); each kind slain at least once in Life 1 is worth
# weight_per_kind on `axis` (the master plan's "only distinct mob types count", against mob farms).
[hostiles]
axis = "valor"
weight_per_kind = 4
group = "battle"
label = "Kinds of foe"
ids = [
  "minecraft:zombie", "minecraft:zombie_villager", "minecraft:husk", "minecraft:drowned", "minecraft:skeleton",
  "minecraft:stray", "minecraft:bogged", "minecraft:spider", "minecraft:cave_spider", "minecraft:creeper",
  "minecraft:enderman", "minecraft:witch", "minecraft:slime", "minecraft:phantom", "minecraft:pillager",
  "minecraft:vindicator", "minecraft:vex", "minecraft:guardian", "minecraft:silverfish", "minecraft:endermite",
  "minecraft:blaze", "minecraft:ghast", "minecraft:magma_cube", "minecraft:wither_skeleton", "minecraft:piglin_brute",
  "minecraft:hoglin", "minecraft:zoglin", "minecraft:shulker", "minecraft:breeze",
]

# ---- Tiers -------------------------------------------------------------------------------------------
# Lowest first. Race offers are cumulative: a tier offers its own `races` plus every lower tier's.
# Slime is always offered on top (the canon underdog); `offers` is the total count including Slime.
# guaranteed     = how many offers are drawn from this tier's own races first (so a Hero always sees a hero race)
# unique_choices = 1: the unique is drawn at random (unless the Trial is passed: then 1 of 3);
#                  3: pick 1 of 3 without the Trial. Max 3. Uniques always go through registry.js; Legendary
#                  uniques are never drawn at rebirth, whatever the tier.
# weights        = how likely each unique rarity is in this tier's draws (random draw, the 3 choices, and
#                  the Trial's 3 choices): {common, rare}; 0 = never while another rarity is free. Only matters
#                  when the Last Wish's pool mixes rarities (skills.toml decides which unique is which).
# bonus_skills   = non-unique Tensura skills (extra/common, NOT uniques: they skip the registry) of which
#                  `bonus_count` are granted at rebirth with a Voice line. Ids from the Tensura jar's tags
#                  data/tensura/tags/manascore_skill/skills/extra_skills.json and common_skills.json.
# Race ids are Tensura's (pack/config/tensura/reincarnation_config.toml: reincarnationRaces and
# reincarnationRacesMastered). Never add an id that is not in Tensura's race registry.
[[tiers]]
id = "underdog"
title = "Wanderer"
item = "minecraft:dead_bush"
min_score = 0
races = ["goblin"]
offers = 2
guaranteed = 0
unique_choices = 1
weights = { common = 3, rare = 1 }   # an underdog's soul leans to utility uniques

[[tiers]]
id = "normal"
title = "Survivor"
item = "minecraft:iron_ingot"
min_score = 100
min_days = 2             # about 40 minutes of Life 1
races = ["human", "elf", "dwarf", "merfolk", "lizardman", "wight", "ghoul"]
offers = 3
guaranteed = 0
unique_choices = 1
weights = { common = 1, rare = 1 }

[[tiers]]
id = "elite"
title = "Hero"
item = "minecraft:diamond"
min_score = 600
min_days = 7
races = ["ogre", "harpy", "beastfolk", "giant"]
offers = 4
guaranteed = 1
unique_choices = 3
weights = { common = 1, rare = 2 }

[[tiers]]
id = "legendary"
title = "Legend"
item = "minecraft:nether_star"
min_score = 1000
min_days = 30            # about 10 hours of Life 1
min_bosses = 1           # at least one `major` boss slain
races = ["hobgoblin", "dragonewt", "high_orc", "vampire", "lesser_daemon"]
offers = 5
guaranteed = 2
unique_choices = 3
weights = { common = 1, rare = 4 }
announce = true          # the Voice of the World tells everyone online
bonus_count = 1
bonus_skills = [
  "tensura:magic_sense", "tensura:thought_acceleration", "tensura:strengthen_body", "tensura:danger_sense",
  "tensura:analytical_appraisal", "tensura:steel_strength", "tensura:self_regeneration",
]

# ---- Dark path ---------------------------------------------------------------------------------------
# A soul is Dark when its chaos axis scores at least min_score AND at least as much as `must_beat`
# (good deeds can outweigh a few bad ones). Dark souls keep their tier, get `prefix` before its title,
# and their offers draw `guaranteed` races from the dark lists (this tier's list first, then lower tiers').
# Dark races join the pool on top of the tier's normal races; nothing is taken away.
[dark]
min_score = 60           # ~ 4 villagers, or 2 players
must_beat = "order"
prefix = "Fallen"
item = "minecraft:wither_rose"
guaranteed = 1

[dark.races]
underdog = ["orc"]
normal = ["ghoul", "wight"]
elite = ["high_orc", "lesser_daemon"]
legendary = ["vampire"]

