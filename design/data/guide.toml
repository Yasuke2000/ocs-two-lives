# The guide pop-up: page sets shown in the guide screen (ttl-portals guide/GuideScreen, opened by `/ttlguide`).
# Edit, then run `python tools/gen_data.py`; the scripts read it as TtlData.guide (life/guide.js).
#   main     /ttl guide, the Voice of the World NPC outside the Corridor, and once on a player's first join
#   corridor once when the soul first reaches the Spirit Corridor (closing it opens the Life screen)
#   life2    once when Life 2 begins
#   paths    /ttl paths and /ttl guide paths: the player paths (design/architecture/paths-necro-artificer.md). STUBS until the
#            paths' work packages land (WP-N2/N3 necromancer, WP-A1 artificer, WP-C1 choices): keep them honest about
#            what is live. Rule (owner 18/11/2026): every path must be easy to find in game.
# Each page: title + body. Body lines:
#   "# text"  a cyan heading          "- text"  a bullet          empty line  a small gap
#   `text`    a command (mint)        *text*    emphasis (gold)
# Long lines wrap by themselves; a page that is too long scrolls. Keep pages short: players read them once.

[[main]]
title = "Welcome to Two Lives"
body = """
Every soul here lives *twice*.

- *Life 1:* you are a plain human in the *Mortal Realm*, a world without monsters of legend and without skills. You only live once there.
- *The Spirit Corridor:* when you die, your soul is judged and you choose what comes next.
- *Life 2:* you are reborn in the world of Tensura, with a new body and a Unique Skill.

How you live your first life decides how strong your second one begins.
"""

[[main]]
title = "Life 1: the Mortal Realm"
body = """
You start at *Wayfarer's Rest*. From here the Mortal Realm is yours to explore: it has its own Nether and End.

- There is no second try: Life 1 ends with your first death.
- When it ends you lose your items, but you keep your XP and advancements.
- Players can fight each other here: another player can end your only first life, and killing a player darkens your karma.
- Take your time. A long, full life is worth more than a quick one.
"""

[[main]]
title = "Your deeds are judged"
body = """
The world remembers what you do in Life 1. This is your *karma*:

- how long you survive
- the foes you slay, and above all the great bosses
- good deeds: trading, defending villages, tending animals
- mining, smithing, enchanting, brewing and advancements

# Tiers
*Wanderer*, *Survivor*, *Hero* and *Legend*. A higher tier offers more races at rebirth, and a Hero or Legend chooses their Unique Skill instead of leaving it to fate. A Legend also carries an extra skill.

# The dark path
Killing villagers, golems, traders or players, or starting raids, stains your soul. A *Fallen* soul is offered dark races.

Type `/ttl life` at any time to see your karma and what the next tier needs.
"""

[[main]]
title = "Death and the Spirit Corridor"
body = """
When Life 1 ends, the Voice of the World judges your life and your soul arrives in the *Spirit Corridor*.

- *Last Wish:* pick one of ten wishes (Strength, Knowledge, Protection, ...). Your wish decides which Unique Skills can be yours.
- *Trial of the Soul* (optional): every wish has its own trial. Win and you pick your skill from three; lose and fate picks it.
- *Rebirth:* the Great Sage's reincarnation ceremony. Choose your new race from your offers (Slime is always one of them).
- *Unique Skill:* chosen by you or drawn by fate, then you wake up in Life 2.

Lost a menu? Type `/ttl menu`, or talk to the *Voice of the World* in the hall.
"""

[[main]]
title = "What your soul keeps"
body = """
When Life 1 ends, your body's belongings do not come with you: inventory, armour, ender chest and backpacks are left behind. Your soul keeps:

- your levels, advancements, karma and quest progress
- your *Soul Gem*: every soul starts with one. It cannot be thrown away in Life 1. In Life 2, right-click it for a short echo of your first life (a few seconds of Regeneration and Resistance, then it rests for a while)
- a *Remembered Enchantment*: a Hero or Legend whose strongest side was *Craft* is reborn with one enchanted book, the best enchantment they carried, at a lower level

Items from Tensura that you carried into the Mortal Realm are put away safely and come back at rebirth.
"""

[[main]]
title = "Life 2: the world of Tensura"
body = """
You are reborn on the Tensura continent, at the safe edge of the *Forest of Jura*, on the road between *Tempest* (south-west, deep in the forest) and the dwarven kingdom of *Dwargon* (north-east, behind its white gate).

- The forest grows deadlier towards Tempest: Veldora's magicule soaks it. Grow stronger before you walk in.

- Your new race and Unique Skill are yours now. Some Unique Skills only a few souls can hold at once.
- Fight, grow stronger and evolve. Death in Life 2 is not the end: you come back.
"""

[[main]]
title = "Useful commands"
body = """
- `/ttl guide` opens this guide again
- `/ttl life` shows your karma and your tier
- `/ttl status` tells you which life you are in
- `/ttl menu` reopens your choices in the Spirit Corridor
- `/bug <what happened>` sends a report to the developers, with everything they need to look into it

Found something odd? Use `/bug` right away, while it is fresh. Good luck, and live well.
"""

[[main]]
title = "Privacy: what we keep"
body = """
This is a server for friends. We keep only what we need to run it, and you can ask to see it or have it removed.

# What is stored
- *Game data:* your Minecraft name and ID, your player file, statistics and your Two Lives progress (life, karma, tier, titles).
- *Activity log:* a logger records who placed or broke blocks, opened chests, chatted, ran commands and logged in. It lets us undo griefing.
- *Bug reports:* your text, your position, health, held item, Two Lives state and the latest server log lines. A report can also be filed as an issue on the project's GitHub page, where others can read it.
- *Discord link:* if you link your account, your Discord ID is stored next to your Minecraft ID and the bot sets your roles. Chat is shared with Discord, and the weekly recap names your character.

# How long
- Bug reports and the activity log: 180 days at most.
- Game data and your link: while you play here. Backups roll off after about a month.
- GitHub issues: until you ask us to remove them.

# Your choices
Ask Yasuke, in Discord or in game, to show, correct or delete your data, or to unlink your Discord account. Your builds stay with the world.
"""

[[corridor]]
title = "The Spirit Corridor"
body = """
Your first life is over. Your soul waits here, between lives.

- When you close this guide, the world shows you *the life you lived*. Its button leads on.
- Make your *Last Wish*. It decides which Unique Skills can be yours.
- Then begin your *reincarnation*, or face your *Trial of the Soul* first: win it and you choose your skill yourself.
"""

[[corridor]]
title = "Lost?"
body = """
- `/ttl menu` reopens your current choice.
- Or right-click the *Voice of the World* in the hall.
- `/ttl life` shows how your life was judged.

Nothing here can hurt you. Take your time.
"""

[[life2]]
title = "Life 2 begins"
body = """
Open your eyes. You are reborn in the world of Tensura, at the edge of the *Forest of Jura*, on the road between *Tempest* (south-west) and *Dwargon* (north-east). The forest is deadlier the closer you get to Tempest.

- Your new race and Unique Skill are yours now. Learn what they can do.
- Fight, grow stronger and evolve.
- Death is no longer the end: in Life 2 you come back.
"""

[[life2]]
title = "Paths you can walk"
body = """
Whatever your race or Oath, you may take up a *path*: a craft of your own beside the story.

- *Necromancer:* raise and keep an undead legion, build your own tomb.
- *Artificer:* forge, engrave and build golems, take commissions.

Every path has a slow, honest road and a fast, dark one. `/ttl paths` tells you more.
"""

[[life2]]
title = "Need help?"
body = """
- `/ttl guide` opens the full guide
- `/ttl status` tells you which life you are in
- `/bug <what happened>` sends a report to the developers
"""

[[paths]]
title = "Paths: open to every soul"
body = """
A path is a craft you take up in your second life. No chapter, Oath or boss locks it: you can start the day you arrive.

- *Necromancer:* the dead and the law (next page).
- *Artificer:* the workshop (page after).
- Quest chapters and NPCs may *teach* a path; they never lock it.

Some of it is still being built. What is not live yet says so.
"""

[[paths]]
title = "Two roads"
body = """
Every path, and every hard choice the world puts in front of you, has two roads.

- *The honest road* (good or grey) is slower. It pays reputation, renown and the trust of the realm.
- *The dark shortcut* is faster or richer. It always costs the same five things:

- your soul's *karma*, carried into your next life
- the *balance* of the world, which tips toward darkness
- *reputation* with those you wronged
- *renown*, if anyone sees you do it
- a line in the *chronicle* the first time

Nobody watches the wilds at night. Your soul always does. `/ttl roads` shows the roads you took.
"""

[[paths]]
title = "The dead and the law"
body = """
# The Necromancer
Raise the dead and keep them. Tensura's own magic (*Create Lesser Undead*, tomes, the Spellbinding Table) and your race (Wight, Ghoul) are the start.

- *Bone Altar:* the heart of a necromancer's work. Raise legionnaires there.
- *Bone dust* from monsters is the honest road. *Soul ash* from people is the dark one: stronger undead, and the Holy Church takes note.
- *Your tomb:* build it yourself around your Bone Altar. The world recognises it and lets it grow from Crypt to Great Tomb.
- The Church's licence lets a careful necromancer walk in the light.

*Live:* the Bone Altar, the legion and the tomb (next page). *Being built:* the Rite that makes you a necromancer, ranks and the licence.
"""

[[paths]]
title = "Your legion and your tomb"
body = """
# The legion
Craft a *Bone Altar* (bone blocks, a candle, rotten flesh, cobbled deepslate), place it and right-click it.

- `/ttl necro raise skeleton` (4 bone dust) or `/ttl necro raise skeleton ash` (1 soul ash: stronger, the dark road)
- `/ttl necro stow` puts your dead to sleep in the tomb; `/ttl necro rouse` wakes them at the altar
- `/ttl necro recall`, `/ttl necro stand all on`, `/ttl necro legion`
- Name them the Tensura way: named dead count for your nation's army (`/ttl necro muster`).
- *Death Knights* (rank 3): full high magisteel gear and 32 bone dust, or a soul ash and a corpse you made yourself. A fallen knight never rises again.
- Your dead never strike a soul outside an arena, a war or a quest that allows it.

# The tomb
Build a closed room around the altar. Grave lanterns make it a *Crypt*; graves, a throne skull, blackstone and a magic engine a *Mausoleum*; a labyrinth engine and more of everything a *Great Tomb*. `/ttl necro sanctum` tells you what is missing.
"""

[[paths]]
title = "The workshop"
body = """
# The Artificer
Kaijin's forge in Tempest and the smithies of Dwargon teach the craft. Tensura's Smithing Bench, Kiln and schematics are the start.

- *Workshop Bench:* a Smithing Bench ringed by four low-quality magic crystals. Right-click it for the Workshop.
- *The charter:* three schematics (learned or carried) at a Workshop Bench. `/ttl artifice charter`
- *Ranks:* Journeyman, Artisan, Master Artificer, Grand Artificer. Points come from commissions and from what you make.
- *Your mark:* what you make at the Smithing Bench carries your name. Commissions want your own work.

`/ttl artifice` opens the Workshop anywhere. *Being built:* golems, the Warden and the workshop boards.
"""

[[paths]]
title = "Commissions and engravings"
body = """
# Commissions
A daily board of contracts from Kaijin and the Dwargon smithy. Higher ranks take harder work.

- `/ttl artifice commissions` to see and take them, `/ttl artifice commission turnin` to deliver.
- Pay: coin, reputation, points, and now and then a rare schematic.

# Engravings
From Artisan on, an *Engraving Chisel* (made in the Workshop) engraves your own work with Tensura's engravings. `/ttl artifice engrave`

# Rare metals
Adamantite and hihi'irokane gear needs their schematics. They come from great foes and master commissions, not from the ingot alone.
"""

[[paths]]
title = "The workshop's dark road"
body = """
Every craft has a faster way. It is never free.

- *Cursed Whetstone:* soul ash and arcane essence at a Bone Altar. It curses any blade at once, no rank needed: its hits spread fear and wither.
- *Stolen schematics:* the Dwargon smithy, at night, a steady hand. Dwargon will remember.

Both cost your soul's karma, tip the world toward darkness, anger those you wronged and cost renown if anyone sees. The honest road: buy a schematic from Dwargon (`/ttl artifice schematic buy`), and engrave with the chisel.
"""
