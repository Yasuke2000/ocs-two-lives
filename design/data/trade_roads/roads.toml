# Trade roads between the canon nations on Lerfing's map (life/trade_roads.js). Each [<id>] is one road: where it
# starts and ends (anchors.toml ids + offsets), the stops it passes, its width and materials. The path itself is
# planned offline by `python -I tools/lerfing/trade_roads.py plan <id> --world <import dir>` (a terrain-following
# search on the 1:16 rasters, refined on the imported world's exact columns) and checked in as
# design/data/trade_roads/<id>.json; tools/gen_placements.py turns both into generated/placements.js (TtlPlacementData).
# A road is laid once (persistentData ttl.troad.<id>.version = version); bump version to lay it again (the new path
# over the old one; the old surface stays where the path moved).
#
# Keys per road:
#   title, notes        what it is, the lore behind it
#   from, to            { anchor = "<id>", dx = n, dz = n }: the two ends; to_y = the exact surface y at the end
#                       (Dwargon's own road block), from_y likewise (optional)
#   via                 [{ anchor, dx, dz }]: stops the road passes on the way, in order
#   avoid               [{ anchor, r }]: discs the path keeps out of (placed landmarks whose box is not known offline)
#   half                road half-width in blocks (columns within `half` of the centre line are paved: 4-5 wide at 2)
#   max_grade           steepest rise per horizontal block of the finished surface (0.5 = 1 block in 2: every rise gets a slab, so it walks without jumping)
#   lantern_every       a fence post with a lantern every n blocks along the road (alternating sides; 0 = none)
#   stone_from          [x0, z0, x1, z1] boxes where the surface is stone (the Canaat apron below Dwargon)
#   surface, stone      { "<block id>" = weight }: the road surface in Jura and on the stone stretch
#   bridge              deck, railing and pillar blocks of the wooden bridges (decks 2 above the water)

# OWN WORLD (own-world-switch): no trade roads. The roads of world/map.svg are graded by the converter and paved by the
# generator (ttl:design_road, roads.json); the Lerfing plan tempest_dwargon.json is retired (git history has it).
