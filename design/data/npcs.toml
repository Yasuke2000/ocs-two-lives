# ---------------------------------------------------------------------------------------------------------------------
# Hooks: a right-click on an entity that already exists and is not ours to spawn answers with `/ttl story talk <talk>`
# (story/cast.js; sneaking keeps the entity's own menu). `tag` = a tag on the entity, `name` (optional) = its custom name.
# The goblins of Tempest are summoned by life/tempest.js with the tag ttl_tempest_resident and their canon names; the throne
# Gazel of life/dwargon.js has the tag ttl_gazel and is the one the story talks to (the boss Gazel is a separate entity).

[[hook]]
id = "gazel_throne"
tag = "ttl_gazel"
talk = "gazel"

[[hook]]
id = "rigurd"
tag = "ttl_tempest_resident"
name = "Rigurd"
talk = "rigurd"

[[hook]]
id = "gobta"
tag = "ttl_tempest_resident"
name = "Gobta"
talk = "gobta"
