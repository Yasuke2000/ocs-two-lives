# =====================================================================================================================
# THE STORY CAST (WP-S4, design/architecture/story-characters.md §1.2 and §6.2)
#
# Rule R1: a character that a mod has as an entity is NOT rebuilt as an Easy NPC. Hinata, Luminous, Carrion, Folgen, Kyoya,
# Shogo and Kirara stand as tame NoAI statues of Tensura's / NEB's own entity (the throne Gazel pattern of life/dwargon.js),
# Gazel himself and the goblins of Tempest keep their entities and only get a right-click hook (see [[hook]] at the end).
# Everyone else is an Easy NPC with a Talk button. What they say is in story.toml.
#
# Provisional looks: Easy NPC's built-in variants, chosen for the role (the preset browser shows each). The drawn skins go in
# pack/kubejs/assets/ttl/textures/entity/npc/<kind id>.png and replace them without any change here.
# Placement (references: design/lore/*.md, blueprints/*.py; checked by `python tools/gen_npcs.py --spots`):
#   Tempest (anchor tempest, offsets from the arrival point = blueprint 45, 5, 57): Benimaru and Shion in the council longhouse
#   area, Shuna in the weaving hut, Souei on the lookout tower, Hakurou on the green by the fire, Kaijin at his forge, Garm and
#   Dold in the workshop house, Mildo at the building site.
#   The Outcast (dark path contact of chapters 7 and 8) stands on Tempest's south road at world 0, 52 (anchor world, surface).
#   Blumund: the guild hall floor (Kabal, Eren, Gido), with stand-ins in Tempest's longhouse until Blumund is placed.
#   Treyni at her shrine, Milim before her throne in the City of the Forgotten Dragon, Yuuki in the Englassia guild hall,
#   Edmaris and Razen on the throne dais of Marris with Folgen and the three otherworlders in the hall, Hinata in the Hall of
#   the Holy Knights and Luminous on the choir in Lubelius, Carrion on the lion throne dais of Laura, the Walpurgis council
#   (Frey, Guy, Leon, Dagruel) in Clayman's throne hall, Ramiris in her glade.
# Not placed: Gabiru (the lizardmen caverns have no build; a `surface` spot at their landmark would do it), Rimuru/Veldora/Shizu
# (fights only).

