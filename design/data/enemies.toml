# Groups: a bounty target ttl:<group> counts every enemy of the camps of that group.
[group.dwarven_road]
title = "outlaws on the Dwarven Road"
[group.blumund_road]
title = "outlaws on the Blumund road"
[group.falmuth_border]
title = "outlaws on the Falmuth border"
[group.wilds]
title = "outlaws in the wilds"

# Camps. Fields: id, title (shown to staff and in the kill line), group, x / z (centre), radius (members spawn and stroll
# within it), count (members at most), regen_minutes (one member of stock back), mix = { <archetype> = weight },
# faction (optional, factions.toml id whose roads they prey on: the good road's `victim` rep goes to it). Coordinates were checked
# on Lerfing's map (canon_map.txt: land of the region named in the comment) and sit beside the road, not on it.
[[camp]]
id = "dwarven_road_south"
title = "bandit camp south of the Dwarven Road's bend"   # J, 489 N of Tempest, 70 E of the road (x 1790)
group = "dwarven_road"
