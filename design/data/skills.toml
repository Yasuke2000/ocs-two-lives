# Unique skill rarities and how many players may hold the same unique at once.
# Edit, then run `python tools/gen_data.py` (validate.py checks the generated file is up to date).
# IDs are Tensura skill paths (tensura:<id>). Legendaries are deliberately NOT in Tensura's startingSkills /
# secondSkills (pack/config/tensura/reincarnation_config.toml) nor in Great Sage's reincarnation pool.

[caps]
legendary = 3   # never a random rebirth skill; only granted on purpose (admin, Legendary tier, absorption)
rare = 3
common = 5

# Registry hygiene (pack/kubejs/server_scripts/ttl/registry.js).
[registry]
inactive_days = 30      # a holder not online for this many days loses the record (the skill returns to the pool and is
                        # taken from them on their next login, with a Voice line); 0 turns it off
history_max = 200       # transfer log entries kept in ttl.reg.history (also trimmed to fit one 64 KB NBT string)
announce = ["rare", "legendary"]   # rarities whose holder changes the Voice of the World announces to everyone
max_name_lookups = 20   # offline player names resolved through the server's user cache per migration (start, /ttl registry migrate)

[legendary]
skills = ["predator", "great_sage", "creator", "envy", "greed", "lust", "pride", "sloth", "wrath"]
# Owner decision 18/11/2026 (replaces the flat "2 per era"): at most this many DIFFERENT players hold a Legendary
# unique at once, on the whole server, the Ten Great Demon Lords. TtlRegistry enforces it on every grant (admin
# included), on available/draw and on transfer; a second Legendary for an existing holder adds no holder, and a holder
# who loses their last Legendary (absorbed, inactive 30 days, reset) frees a place. 0 = no ceiling.
max_holders = 10
# Optional extra throttle per era on NEW Legendary holders that arrive through a rebirth Legend pick (`grant` with
# opts.slot); eras reset it (`/ttl era next`). Never above max_holders. 0 = no per-era throttle (the default).
slots_per_era = 0

# How a unique may change hands (TtlRegistry.transfer(server, from, to, skill, route, reason)); the route is recorded in
# ttl.reg.history. Other packages add routes here; an unlisted route still works but logs a warning.
[transfer]
routes = ["duel", "war", "bequest", "awakening", "staff"]

# Rebirth Legend pick (life/corridor_flow.js `legendEcho`): a soul judged `tiers` is offered, next to its normal unique
# options, the Legendary echo of its Last Wish (life/wishes.js `echo`) while the registry has room for it: the global
# ceiling ([legendary] max_holders) and, when set, the per-era throttle (slots_per_era). Taking it spends a slot.
[legend_pick]
enabled = true
tiers = ["legendary"]    # karma tier ids (design/data/karma.toml)
allow_dark = true        # a dark-path Legend gets the echo too

# Absorption and the other ways a Legendary (or any unique) changes hands: absorb/absorb.js. Every move goes through
# TtlRegistry.transfer / grant, so the ceiling, the caps and the history stay in one place. Each ROUTE is a sub-table
# that can be switched off; a key set in a route overrides the same key in this table. Routes: duel, war, bequest,
# awakening (the route names are the [transfer] routes above).
[absorb]
skills = ["predator", "gluttony", "starved", "gourmet", "engorger"]   # uniques whose holder is an "absorber"
min_ep_ratio = 0.5      # victim EP must be at least this share of the killer's (0 = no lower bound)
max_ep_ratio = 0        # ... and at most this share (0 = no upper bound)
cooldown_hours = 72     # per killer between absorptions, over all routes
legendary_per_kill = 1  # Legendary uniques moved (stolen) per absorption
copies_per_kill = 1     # Rare/Common uniques copied to the killer per absorption (the victim keeps theirs; caps apply)
offer_minutes = 5       # a duel challenge or a bequest offer stays open this long
pact_minutes = 15       # an accepted duel, or an awakening challenge, counts this long
combat_log_seconds = 30 # logging out this soon after a hit in a duel, challenge or war counts as a defeat

# Duel: both sides agree (/ttl absorb duel <p>, /ttl absorb accept <p>), then the fatal blow between them ends
# the duel. lethal = false: the blow is turned into a defeat (nobody dies, as Tensura's labyrinthDeath = false does);
# true: a real death. dimensions: where the pact counts, empty = anywhere in Life 2 (owner 18/11/2026: duels anywhere;
# was ["tensura:labyrinth"]); exclude_dimensions: never there (Life 1's realm and the Spirit Corridor). A duel started in
# a public place makes its initiator liable for the damage: [absorb.liability] below.
[absorb.duel]
enabled = true
requires_absorber = true
legendary = true
copies = true
lethal = false
dimensions = []
exclude_dimensions = ["ttl:mortal_realm", "ttl:mortal_nether", "ttl:mortal_end", "ttl:spirit_corridor"]

# Damage liability (absorb/liability.js; owner 18/11/2026). A duel (or an awakening challenge) whose initiator or opponent
# stands in a public place when it opens is "liable": while it lasts, every block either duellist breaks or places, or
# blows up, inside a public place is recorded, and when it ends the INITIATOR pays fee_per_block per block (at most
# max_fee, as far as they can) through the economy. The share for blocks on a nation's land goes to that nation's
# treasury; the rest is a sink. Public places (`places`): claims = chunks claimed by a team that is neither duellist's,
# towns = Tempest and Dwargon, builds = every placed canon build's box, landmarks = every placed landmark's reach. The
# wild is never public. exempt = build/landmark names (or "tempest", "dwargon") that are not public (arenas).
[absorb.liability]
enabled = true
routes = ["duel", "awakening"]
places = ["claims", "towns", "builds", "landmarks"]
exempt = []
fee_per_block = { bronze = 5 }
max_fee = { gold = 5 }
max_blocks = 512        # changes recorded per duel; the rest is neither charged nor restored
restore = true          # put the recorded blocks back after paying (a broken block only where the spot is still air)
restore_per_tick = 32
no_drops = true         # with restore: a recorded broken block drops nothing, so a public build cannot be farmed
hold_days = 7           # an initiator who is offline when the duel ends pays at their next login, up to this long

# War between nations: a Legendary holder who falls to a soul of a nation at official war with theirs loses it to the
# killer (a real death). use_nations asks TtlNations.atWar(server, killer, victim) (WP4, nations/nations.js) and is
# skipped while that is not loaded; staff_flags also counts pairs flagged by ops (/ttl absorb war <a> <b>).
[absorb.war]
enabled = true
use_nations = true
staff_flags = true
requires_absorber = false
legendary = true
copies = false
min_ep_ratio = 0        # a war kill has no EP gate

# Bequest: a holder hands a unique on voluntarily (/ttl absorb bequest <p> <skill>, accepted with /ttl absorb accept <p>).
# A holder who was hit in a duel, challenge or war during the last combat_log_seconds cannot bequeath.
[absorb.bequest]
enabled = true
legendary_only = false  # true: only Legendary uniques may be bequeathed

# Awakening / Harvest Festival: a soul that awakened as a True Demon Lord or True Hero, once per kind, may CLAIM a free
# Legendary (/ttl absorb free, /ttl absorb claim <skill>) while the registry has room, or CHALLENGE a Legendary holder
# who is weaker (EP between min_ep_ratio and max_ep_ratio of theirs) with /ttl absorb challenge <p>: a duel the holder
# does not have to accept, open pact_minutes, ended by the fatal blow (lethal = false: a defeat) or a combat log.
[absorb.awakening]
enabled = true
claim = true
challenge = true
spend_slot = true       # a claim counts as a new Legendary holder of the era (per-era throttle, if any)
requires_absorber = false
legendary = true
copies = false
lethal = false
min_ep_ratio = 0.5
max_ep_ratio = 1.0      # "weaker": the holder's EP may not exceed the challenger's
claim_skills = { true_demon_lord = ["envy", "greed", "lust", "pride", "sloth", "wrath"], true_hero = ["great_sage", "creator"] }

# Skill Cores (boss drops from T3): /ttl core open draws one Rare or Common unique, never a Legendary one.
[core]
item = "ttl:skill_core"     # what /ttl core open consumes (the item is defined by the boss package)
require_item = true         # false: players may open without the item (testing only)
weights = { rare = 3, common = 1 }   # draw weight per rarity; every skill of the rarity weighs the same

# Eras (era/era.js): `/ttl era next` bumps ttl.season and clears these era titles; permanent titles stay.
[era]
titles = [
  { id = "champion", name = "Champion of the Era" },
  { id = "conqueror", name = "Conqueror of the Era" },
  { id = "sage", name = "Sage of the Era" },
]

[rare]
# Combat and magic uniques. gluttony: owner decision 18/11/2026 (was an unlisted skill, so Common by default).
skills = [
  "absolute_severance", "berserk", "berserker", "bewilder", "chosen_one", "commander", "degenerate",
  "engorger", "falsifier", "fighter", "fusionist", "gluttony", "infinity_prison", "martial_master", "merciless",
  "murderer", "oppressor", "reaper", "reflector", "reverser", "royal_beast", "severer", "shadow_striker",
  "sniper", "spearhead", "suppressor", "unyielding", "usurper", "villain",
]

[common]
# Utility uniques.
skills = [
  "analyst", "chef", "cook", "gourmand", "gourmet", "guardian", "healer", "mathematician", "musician",
  "observer", "researcher", "seeker", "seer", "survivor", "thrower", "traveler", "tuner",
]
