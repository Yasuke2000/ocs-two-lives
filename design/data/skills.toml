# Unique skill rarities and how many players may hold the same unique at once.
# Edit, then run `python tools/gen_data.py` (validate.py checks the generated file is up to date).
# IDs are Tensura skill paths (tensura:<id>). Legendaries are deliberately NOT in Tensura's startingSkills /
# secondSkills (pack/config/tensura/reincarnation_config.toml) nor in Great Sage's reincarnation pool.

[caps]
legendary = 3   # never a random rebirth skill; only granted on purpose (admin, Legendary tier, absorption)
rare = 3
common = 5

# Registry hygiene (pack/kubejs/server_scripts/ttl/registry.js).
[registry]
inactive_days = 30      # a holder not online for this many days loses the record (the skill returns to the pool and is
                        # taken from them on their next login, with a Voice line); 0 turns it off
history_max = 200       # transfer log entries kept in ttl.reg.history (also trimmed to fit one 64 KB NBT string)
announce = ["rare", "legendary"]   # rarities whose holder changes the Voice of the World announces to everyone
max_name_lookups = 20   # offline player names resolved through the server's user cache per migration (start, /ttl registry migrate)

[legendary]
skills = ["predator", "great_sage", "creator", "envy", "greed", "lust", "pride", "sloth", "wrath"]

[rare]
# Combat and magic uniques.
skills = [
  "absolute_severance", "berserk", "berserker", "bewilder", "chosen_one", "commander", "degenerate",
  "engorger", "falsifier", "fighter", "fusionist", "infinity_prison", "martial_master", "merciless",
  "murderer", "oppressor", "reaper", "reflector", "reverser", "royal_beast", "severer", "shadow_striker",
  "sniper", "spearhead", "suppressor", "unyielding", "usurper", "villain",
]

[common]
# Utility uniques.
skills = [
  "analyst", "chef", "cook", "gourmand", "gourmet", "guardian", "healer", "mathematician", "musician",
  "observer", "researcher", "seeker", "seer", "survivor", "thrower", "traveler", "tuner",
]
