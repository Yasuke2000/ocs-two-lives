# ---- engraving (§3.4, the honest road) --------------------------------------------------------------------------------
# `/ttl artifice engrave <id>` at a Workshop Bench, rank 2+, an Engraving Chisel carried, the item in the main hand must
# carry the soul's own maker's stamp. Engravings are Tensura's own (data/tensura/enchantment, tag
# #tensura:engraving_exclusive: one per item); /enchant checks the item and the exclusivity, so a refused engraving costs
# nothing. Pays roads.toml artifice.engrave grey (no cost, counted) and [points] engrave.
# Row: id (enchantment id), rank (lowest artifice rank), cost = { coins = {...}, items = { "<id>" = n } }

[engrave]
chisel = "ttl:engraving_chisel"

[[engraving]]
id = "tensura:sturdy"
rank = 2
cost = { coins = { silver = 5 }, items = { "tensura:low_quality_magic_crystal" = 2 } }

[[engraving]]
id = "tensura:swift"
rank = 2
cost = { coins = { silver = 5 }, items = { "tensura:low_quality_magic_crystal" = 2 } }

[[engraving]]
id = "tensura:magic_weapon"
rank = 3
cost = { coins = { gold = 1 }, items = { "tensura:medium_quality_magic_crystal" = 2 } }

[[engraving]]
id = "tensura:crushing"
rank = 3
cost = { coins = { gold = 1 }, items = { "tensura:medium_quality_magic_crystal" = 2 } }

[[engraving]]
id = "tensura:severance"
rank = 4
cost = { coins = { gold = 3 }, items = { "tensura:high_quality_magic_crystal" = 2 } }

# ---- workshop recipes (§3.6) ------------------------------------------------------------------------------------------
# Made through the workshop menu (`/ttl artifice make <id>`) at a Workshop Bench: KubeJS recipes cannot be gated per
# player, so the rank-gated ones live here. Row: id, rank, output, count, inputs = { "<id>" = n }, coins (optional sink),
# station = "bench" (a Workshop Bench) | "altar" (a ttl:bone_altar, the cross-path dark recipe), road (optional
# "<choice>.<road>" paid through TtlRoads when made).

[[recipe]]
id = "engraving_chisel"
rank = 2
station = "bench"
output = "ttl:engraving_chisel"
count = 1
inputs = { "tensura:pure_magisteel_ingot" = 1, "irons_spellbooks:arcane_essence" = 1 }

[[recipe]]
id = "cursed_whetstone"
rank = 0
station = "altar"
output = "ttl:cursed_whetstone"
count = 1
inputs = { "ttl:soul_ash" = 1, "irons_spellbooks:arcane_essence" = 1 }

[[recipe]]
id = "warden_core"
rank = 4
station = "bench"
output = "ttl:warden_core"
count = 1
inputs = { "tensura:adamantite_bone_golem" = 1, "tensura:stone_bricks_magic_engine" = 1, "tensura:warp_core" = 1 }

# ---- the cursed whetstone (§3.4, the dark shortcut) -------------------------------------------------------------------
# `/ttl artifice curse` with a Cursed Whetstone in the inventory and a blade in the main hand: no rank, no stamp needed
# (that is the shortcut). The blade gets custom data `ttl_cursed` and a lore line; every hit it lands has `chance` to put
# Tensura's Fear and Wither on the target. Pays roads.toml artifice.engrave dark (the five costs).

[curse]
item = "ttl:cursed_whetstone"
lore = "Cursed: whetted with soul ash"
chance = 0.10
effects = [
  { id = "tensura:fear", seconds = 5, amplifier = 0 },
  { id = "minecraft:wither", seconds = 5, amplifier = 0 },
]

# ---- schematics (§3.4, O-A2: gate the material by its schematic) ------------------------------------------------------
# Tensura's Smithing Bench needs every schematic of a recipe LEARNED (javap 2.0.1.5: SmithingSchematicItem.use unlocks it
# and shrinks the stack; the bench filters recipes by ITensuraPlayer.getKnownSchematics). Schematics are not consumed
# per craft. Tensura gives the adamantite and hihi'irokane gear schematics as advancement rewards the first time a soul
# holds such an item; pack/kubejs/data/tensura/loot_table/advancement_reward/{adamantite,hihiirokane}.json empty those, so
# the schematic comes only from the sources below.
# [schematics.gated]  schematic → the lowest boss tier whose summoned bosses may drop it (bosses.toml tier), drop chance
# Commissions above also reward them (pure_blade: adamantite, adamant_great_sword: hihi'irokane).

[schematics]
buy_price = { gold = 20 }    # the honest road: /ttl artifice schematic buy (Dwargon friendly or better)
buy_band = { dwargon = "friendly" }
# The pool both roads draw from (the dwarf trades' schematics, never a gated one).
pool = [
  "tensura:low_magisteel_gear_schematic", "tensura:high_magisteel_gear_schematic", "tensura:mithril_gear_schematic",
  "tensura:japanese_sword_schematic", "tensura:great_sword_schematic", "tensura:spear_schematic", "tensura:kunai_schematic",
  "tensura:shield_schematic", "tensura:magic_staff_schematic", "tensura:hunting_knife_schematic",
]

[schematics.gated]
"tensura:adamantite_gear_schematic" = { boss_tier = 2, chance = 0.25 }
"tensura:hihiirokane_gear_schematic" = { boss_tier = 3, chance = 0.25 }

# ---- stolen schematics (§3.6, the dark shortcut) ----------------------------------------------------------------------
# `/ttl artifice steal` near the Dwargon smithy (Garm, Dold and Mildo) at night: stand still `channel_seconds`, then a
# random schematic of [schematics] pool, and roads.toml artifice.schematic dark (Dwargon -20 and the rest of the five costs;
# Dwargon's guards turn on a Hostile soul by themselves, rep/guards.js). Once per `cooldown_hours`.

[steal]
smithy = { x = 423, z = -1084 }
radius = 48
night = [13000, 23000]       # day time ticks (mod 24000) that count as night
channel_seconds = 30
move_tolerance = 2           # blocks a soul may drift while channelling
cooldown_hours = 24

# ---- constructs (WP-A2 owns this table) --------------------------------------------------------------------------------
[construct]
