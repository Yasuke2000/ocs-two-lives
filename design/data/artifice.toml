# The Artificer (design/architecture/paths-necro-artificer.md §3; WP-A1 core). Scripts: artifice/artifice.js (TtlArtifice:
# charter, ranks, points, the maker's stamp), artifice/commissions.js (TtlCommission), artifice/workshop.js (engraving,
# workshop recipes, the cursed whetstone, schematics), artifice/recipes.js (crafting and kiln recipes, schematic drops),
# artifice/commands.js. Edit, then run `python tools/gen_data.py` (check_artifice validates this file).
# Test: `tools/server.sh test artifice`.
#
# R12: a system is not a chapter. Nothing here may name a stage of the story, the Oath path or the bosses (validate.py fails
# on it). Gates allowed: EP (Tensura's own golem ladder), items (schematics), rank points the system pays, faction bands.
# R13: the honest road (charter, commissions, the engraving chisel, bought schematics) is slower; the dark shortcut (the
# cursed whetstone, stolen schematics) is faster and pays the five costs of roads.toml (choices artifice.engrave,
# artifice.schematic). Constructs, the Warden and nation infrastructure are WP-A2 ([construct] below is theirs).

# ---- the Workshop Bench and the charter (§3.1) -----------------------------------------------------------------------

[bench]
block = "ttl:workshop_bench"
reach = 4                    # commands that need "at a Workshop Bench" look for one within this many blocks
# Recipe (artifice/recipes.js): a Tensura Smithing Bench ringed by four low-quality magic crystals.
recipe = { center = "tensura:smithing_bench", ring = "tensura:low_quality_magic_crystal" }

[charter]
# `/ttl artifice charter` at a Workshop Bench: rank 1 (Journeyman). Schematics count when the soul has LEARNED them
# (Tensura keeps known schematics per player; reading one consumes it) or carries the item. Nothing is taken.
schematics = 3
schematic_tag = "tensura:schematics"
item = "ttl:artificer_charter"   # the paper proof (the record ttl.artifice is the truth)

# ---- ranks (§3.2) -----------------------------------------------------------------------------------------------------
# points   lifetime artifice points needed
# constructs / muster   golem caps (WP-A2 reads them: TtlArtifice.caps(player))
# tier     the highest commission tier this rank may take
# engrave  the engraving chisel works (rank 2+)
# renown   bonus renown paid once when the rank is reached (rank 4's renown is the stage row in factions.toml [renown])
# requires_any (rank 4 only): one of these uniques held (TtlManas) OR one of these faction bands
# era_title  awarded once per era to the first soul that reaches the rank (TtlEra.award; the title row is WP-X1's)

[[rank]]
id = 1
title = "Journeyman"
points = 0
constructs = 1
muster = 1
tier = 1
engrave = false
renown = 1

[[rank]]
id = 2
title = "Artisan"
points = 40
constructs = 2
muster = 2
tier = 2
engrave = true
renown = 2

[[rank]]
id = 3
title = "Master Artificer"
points = 150
constructs = 3
muster = 3
tier = 3
engrave = true
renown = 5

[[rank]]
id = 4
title = "Grand Artificer"
points = 500
constructs = 4
muster = 6
tier = 4
engrave = true
renown = 0
requires_any = { skills = ["tensura:godly_craftsman", "tensura:researcher"], bands = { dwargon = "exalted" } }
era_title = "grand_artificer"
announce = true              # one #story line (never for test bots)

# ---- points (§3.2) ----------------------------------------------------------------------------------------------------

[points]
weekly_cap = 60              # all artifice points of a soul in one ISO week (anti-farm, the guild pattern)
craft_weekly_cap = 20        # of which at most this many from crafting at the Smithing Bench
commission = [5, 10, 15, 20] # per commission tier 1..4 (a commission row may override with `points`)
engrave = 2                  # an engraving with the chisel
metal_first_soul = 3         # the first time this soul makes a metal (smithing output or a kiln ingot)
metal_first_server = 10      # the first time anyone on the server does (chronicle firsts.craft.<metal>)
# Hooks for later packages (TtlArtifice.addPoints(server, p, kind, n?) uses these when n is not given):
construct = 3                # WP-A2: a construct built
engine = 5                   # WP-A2: an engine placed in a Public Works chunk
engine_commons_mult = 3      # WP-A2: x3 in a Commons chunk
event = 5                    # WP-C1/C2: a moral-choice event resolved with artifice

# Points per item made at the Smithing Bench, by the metal its id starts with (tensura:<metal>_...). Order = tier.
[points.craft]
low_magisteel = 1
high_magisteel = 1
pure_magisteel = 2
mithril = 2
orichalcum = 2
adamantite = 3
hihiirokane = 4

# ---- the maker's stamp (§3.5) -----------------------------------------------------------------------------------------
# Tensura's Smithing Bench and Kiln fire no crafting event (javap 2.0.1.5: the result slot's onTake only takes the
# ingredients). While a soul has one of them open, a 5-tick poll compares what it carries with what it carried when the
# screen opened; new Smithing Bench products get item custom data `ttl_made_by` = the soul's UUID (+ `ttl_made_by_name`
# and a lore line), kiln ingots only count for the metal firsts (they stack, a stamp would split stacks).

[made_by]
lore = "Made by {name}"
poll_ticks = 5

# ---- commissions (§3.5) -----------------------------------------------------------------------------------------------
# Guild-style contracts from the workshops. The board rolls by UTC date: `board` commissions per tier, drawn by weight.
# A soul takes those of its rank's tier and below; accepted commissions share the Free Guild's max_active
# (economy.toml [guild]) with its bounties. `made_by = true`: only items carrying this soul's stamp count.
# Radiant boards (WP-W13/A3) reuse the hand-in through TtlCommission.handIn(server, player, {item, count, made_by}).
# Row: id, title, tier 1-4, giver (kaijin | smithy | vester: who posts it; the boards of WP-A3), item, count, made_by,
#      weight, reward = { coins = {coin table}, rep = { faction = n }, schematic = "<item id>" (optional), points = n
#      (optional, else [points] commission[tier]) }

[commissions]
board = 2                    # commissions per tier on the daily board
announce_tier = 4            # finishing a commission of this tier or higher posts one #story line

