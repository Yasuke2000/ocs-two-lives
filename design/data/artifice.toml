title = "Blades for the hobgoblin patrols"
tier = 1
giver = "kaijin"
item = "tensura:low_magisteel_long_sword"
count = 1
made_by = true
weight = 10
reward = { coins = { silver = 3 }, rep = { tempest = 2 } }

