# Canon landmarks built from Tensura's own jigsaw structures (with their NPC spawn pieces and loot), placed once
# in the Tensura world (overworld) by pack/kubejs/server_scripts/ttl/life/landmarks.js and again after an
# overworld reset. Edit, then run `python tools/gen_data.py` (it fills in x/z and checks every entry).
# Structure ids come from the Tensura jar (data/tensura/worldgen/structure/); never invent one.
#
# Every [[landmark]] has:
#   name      = short id for `/ttl landmark list|place|where <name>` and the persistentData keys
#   title     = what players and the log call it
#   structure = the jigsaw structure, placed with vanilla `/place structure` (which skips the biome check)
#   canon     = the matching landmark name in pack/config/ttl/canon_regions.json (its `at`, Lerfing's coordinates)
#   x, z      = where: the design/data/anchors.toml anchor whose `landmark` names this entry gives them (every landmark
#               has one since the Lerfing import, so x/z are not written here); without an anchor, x/z or `canon`
#   reach     = how far the structure spreads from its start (its max_distance_from_center + one piece);
#               keeps it `keepout` blocks clear of Tempest and Dwargon (and reach + 64 off Lerfing's builds, the
#               anchors.toml keepouts), and sets the area held while it is placed
#   surface   = "land" (dry and as flat as possible), "water" (a shore: part lake, part land) or "any"
#   version   = bump to place this landmark again on the next start (the old copy stays unless `remove` names it)
#   remove    = old copies to take out before the next placement, once each: [{ id, x, z }, ...] where x, z is the spot
#               the old copy was placed at (the log's "placed ... at X Y Z"; the "not placed at"/"failed at" spots of the
#               marker-era placer count too, they may hold a copy). life/unplace.js regenerates that start from seed +
#               chunk and removes only blocks that are still the structure's own (>= 50 % must match, else it was not
#               there and nothing happens); `structure` per entry when it differs. Done flags: ttl.landmark.<name>.removed.<id>
#   repair    = false: no foundation under the rigid pieces (life/repair.js); repair_depth / repair_keep_water as for builds
#
# There is no y: the jigsaw projects its pieces onto the chunk GENERATOR's surface, which on Lerfing's imported map is
# not the real ground; the script moves every rigid group onto the real ground and fills a foundation under it
# (life/landmarks.js steps 4 and 7). Terrain adaptation (beard) is skipped, so the script tries the nominal spot and
# up to 16 nearby spots (32 and 64 blocks out) and picks the flattest one that fits `surface`.

keepout = 60

[[landmark]]
name = "goblin_village"
title = "Old goblin village (Rigurd's tribe)"
structure = "tensura:villages/goblin_village/oak"
canon = "Old goblin village (Rigurd's tribe)"
reach = 48
surface = "land"
version = 2
# Staging (Lerfing import, 19/11/2026) placed it twice in one boot (a world-reset pass queued it again while it was being
# placed), both copies overlapping, ungrounded: both go, version 2 is placed once, grounded.
remove = [{ id = "lerfing_1", x = 1390, z = 742 }, { id = "lerfing_2", x = 1358, z = 710 }]
notes = "Rigurd's poor village of wooden huts in the Jura forest, north-west of Tempest; goblin spawn pieces."

[[landmark]]
name = "lizardmen_village"
title = "Lizardmen's village on Lake Siss"
structure = "tensura:villages/lizardmen_village/water"
canon = "Lake Siss"
reach = 48
surface = "water"
version = 2
# Staging (Lerfing import) placed version 1 with the old placer, on the generator's heights, not the real ground
# (19/11/2026, `ttl landmark where`: placed at x 3207, z 965): that copy goes, version 2 is grounded with a foundation.
remove = [{ id = "lerfing_1", x = 3207, z = 965 }]
notes = "Stilt village on the south shore of Lake Siss (anchors.toml lizardmen_village: 45 % water within 48, clear of Lerfing's hut clusters). The canon point (Lake Siss) is mid-lake."

