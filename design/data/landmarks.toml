# Canon landmarks built from Tensura's own jigsaw structures (with their NPC spawn pieces and loot), placed once
# in the Tensura world (overworld) by pack/kubejs/server_scripts/ttl/life/landmarks.js and again after an
# overworld reset. Edit, then run `python tools/gen_data.py` (it fills in x/z from `canon` and checks every entry).
# Structure ids come from the Tensura jar (data/tensura/worldgen/structure/); never invent one.
#
# Every [[landmark]] has:
#   name      = short id for `/ttl landmark list|place|where <name>` and the persistentData keys
#   title     = what players and the log call it
#   structure = the jigsaw structure, placed with vanilla `/place structure` (which skips the biome check)
#   canon     = the matching landmark name in pack/config/ttl/canon_regions.json; x/z are derived from its
#               reference-map pixel (world = (ref - origin) x width / 2570) unless x/z are given here
#   x, z      = optional explicit world position (overrides `canon`), e.g. to put a lake village on the shore
#   reach     = how far the structure spreads from its start (its max_distance_from_center + one piece);
#               keeps it `keepout` blocks clear of Tempest and Dwargon, and sets the forceloaded area
#   surface   = "land" (dry and as flat as possible), "water" (a shore: part lake, part land) or "any"
#   version   = bump to place this landmark again on the next start (the old copy stays where it was)
#
# There is no y: `/place structure` only uses the chunk; the jigsaw projects its start piece onto the generator's
# surface heightmap itself. It also skips terrain adaptation (beard), so the script tries the nominal spot and
# up to 16 nearby spots (32 and 64 blocks out) and picks the flattest one that fits `surface`.

keepout = 60

[[landmark]]
name = "goblin_village"
title = "Old goblin village (Rigurd's tribe)"
structure = "tensura:villages/goblin_village/oak"
canon = "Old goblin village (Rigurd's tribe)"
reach = 48
surface = "land"
version = 1
notes = "Rigurd's poor village of wooden huts in the Jura forest, north-west of Tempest; goblin spawn pieces."

