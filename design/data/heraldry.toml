# Original pack designs. Layers run from the coloured cloth outward in loom order.
# One English dye name and one vanilla pattern id per layer. See design/lore/heraldry.md.

[[faction]]
id = "tempest"
title = "Gale over Jura"
motif = "An ascending gold spiral and a pale storm eye"
palette = ["#173a62", "#276aa1", "#83dcdf", "#ffe498"]
base = "blue"
layers = [
  { pattern = "minecraft:circle", color = "light_blue" },
  { pattern = "minecraft:flow", color = "yellow" },
]
give = '/give @s minecraft:blue_banner[minecraft:banner_patterns=[{pattern:"minecraft:circle",color:"light_blue"},{pattern:"minecraft:flow",color:"yellow"}]] 1'

