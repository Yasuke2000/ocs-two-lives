# Economy: coins, the Adventurer's Guild, sinks and merit-lite (design/architecture/sprint3-4.md S7, owner decision
# 18/11/2026: Lightman's Currency for player shops and bank accounts, with Tensura's own coins as the currency).
# Edit, then run `python tools/gen_data.py`; the scripts in pack/kubejs/server_scripts/ttl/economy/ read it as
# TtlData.economy. gen_data.py also checks this file against pack/config/lightmanscurrency/MasterCoinList.json.
#
# Money amounts anywhere in this file are written as coin tables, e.g. { silver = 3, bronze = 5 }. The worth of a
# coin is the product of the rates below, so with the defaults 1 silver = 10 bronze, 1 gold = 100 bronze and
# 1 stellar = 1,000 bronze. Lightman's Currency counts in the same unit ("core value" = bronze).
#
# Faucet / sink balance (master plan §9: sinks >= 80% of faucets per active player per week). A player who clears the
# whole board earns about 3 x 3 silver a day + 2 x 1-2 gold a week, i.e. roughly 9 gold-equivalents (900 bronze) a
# week; the sinks below (charter, upkeep, altar, Skill Core, auction fee) are tuned against that. `/ttl econ`
# prints the real weekly faucet/sink counters; retune here when they drift.

[coins]
# Smallest first. Item ids were read from the Tensura 2.0.1.5 jar (assets/tensura/models/item, tags/item/coins.json).
chain = ["bronze", "silver", "gold", "stellar"]

[coins.item]
bronze = "tensura:bronze_coin"
silver = "tensura:silver_coin"
gold = "tensura:gold_coin"
stellar = "tensura:stellar_gold_coin"

# How many of the previous coin make one of this one. Must equal `exchangeRate` in MasterCoinList.json (checked).
# Tensura itself defines no exchange rate for its coins, so this is our own choice.
[coins.rate]
silver = 10
gold = 10
stellar = 10

[guild]
# Fuze's Free Guild. The board is global and rolls by UTC date (daily) and by ISO week starting Monday (weekly).
daily = 3
weekly = 2
# A player may hold this many accepted bounties at once.
max_active = 3
# A "visit" bounty counts when the player is within this many blocks of the landmark (x/z from landmarks.toml).
visit_radius = 48
# Kill and visit progress is sampled this often (ticks). Kills come from `minecraft.killed:` objectives
# (EntityEvents.death is unreliable for mobs here), so a kill counts for the faction region the player is in at the sample.
poll_ticks = 100
# Rank-ups of this rank and above are announced in #story (TtlDiscord.post).
announce_rank = "B"

# Guild ranks F to S. `points` are lifetime bounty points (each bounty has its own `points`).
[[rank]]
id = "F"
title = "Rookie"
points = 0

[[rank]]
id = "E"
title = "Novice"
points = 10

[[rank]]
id = "D"
title = "Adventurer"
points = 30

[[rank]]
id = "C"
title = "Veteran"
points = 70

[[rank]]
id = "B"
title = "Elite"
points = 140

[[rank]]
id = "A"
title = "Champion"
points = 250

[[rank]]
id = "S"
title = "Free Guild Legend"
points = 400

# Bounties. Fields:
#   id        unique [a-z0-9_]
#   title     shown on the board
#   kind      kill | deliver | visit
#   target    kill: entity id · deliver: item id · visit: a landmark name from landmarks.toml
#   count     kills or items (1 for a visit)
#   period    daily | weekly
#   min_rank  guild rank needed to accept it
#   region    optional, kill only: faction id (factions.toml); the kill only counts while the player is in that
#             faction's canon region
#   points    guild points
#   weight    relative chance when the board is rolled
#   reward    { coins = { silver = 3 }, rep = { blumund = 1 } }; rep factions are factions.toml ids
# Entity ids were read from the Tensura 2.0.1.5 lang file; whether each one spawns in the world is not checked here
# ("verify in game"): a bounty whose mob never appears simply stays unfinished, retire it by setting weight = 0.

[[bounty]]
id = "rabbit_cull"
title = "Cull the Horned Rabbits"
kind = "kill"
target = "tensura:horned_rabbit"
count = 8
period = "daily"
min_rank = "F"
points = 1
weight = 10
reward = { coins = { silver = 2 }, rep = { blumund = 1 } }

