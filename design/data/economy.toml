# Sinks. `charge(player, 'name')` in economy/sinks.js (TtlEcon.fee) reads these; the callers are the other work
# packages: nations (charter, upkeep), bosses (altar), registry (Skill Core identification).
[sinks]
charter = { gold = 50 }
upkeep_per_chunk_week = { silver = 1 }
altar = { silver = 5 }
core_identify = { gold = 2 }

# Merit-lite (O5): placing infrastructure blocks inside a Public Works chunk earns merit; 100 merit = rep_per_100 rep
# with the faction whose canon region the chunk lies in, and total merit >= builder_at gives the Builder title.
# Public Works chunks are marked with /ttl merit works mark (the chunk you stand in) until the nations package
# (S4) has a claim API to read them from; per-week caps keep marking a random chunk from paying much.
[merit]
per_block = 1
weekly_cap = 200
chunk_weekly_cap = 100
rep_per_100 = 1
builder_at = 500
works_per_player = 4
blocks = [
  "minecraft:stone_bricks", "minecraft:stone_brick_slab", "minecraft:stone_brick_stairs", "minecraft:stone_brick_wall",
  "minecraft:cobblestone_wall", "minecraft:lantern", "minecraft:oak_fence", "minecraft:oak_fence_gate",
  "minecraft:smooth_stone_slab", "minecraft:bell", "minecraft:barrel", "minecraft:composter",
]
