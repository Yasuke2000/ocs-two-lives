# Items a Life 1 soul may not use in the Mortal Realm (design/master-plan.md §4, owner call: "no bans besides
# Tensura stuff, but make it easy to add mods to that list"). Script: pack/kubejs/server_scripts/ttl/life/mortal_banned.js.
# Edit, then run `python tools/gen_data.py`. Check with `/ttl stash <player>` and `tools/server.sh test carryover`.
#
# What a ban does, in the Mortal dimensions (ttl:mortal_realm, ttl:mortal_nether, ttl:mortal_end) for Life 1 souls:
#   - using, placing, picking up and crafting a banned item is refused;
#   - a banned item that gets onto the body anyway (command, a mod's loot, a trade) is moved into the "soul stash"
#     within 2 seconds (inventory, ender chest and Curios are all checked). One calm Voice line tells the player once.
#   - the soul stash is returned in Life 2, at rebirth. Nothing is destroyed.
# Life 2 is never affected.
#
# HOW TO ADD A MOD: put its namespace in `namespaces` (the part before the colon in an item id, e.g. `somemod` for
# `somemod:magic_ring`). Every item of that mod is then banned, no other change needed. The namespace must be
# spelled exactly like in the item ids (check with /give autocomplete or JEI).
# To ban a single item of a mod that stays allowed otherwise, use `items`; to ban a whole group of items that has an
# item tag (vanilla, a mod's, or your own datapack tag), use `tags`. To let one item through a namespace ban, use `allow`.

# Whole mods. Every mod that adds Tensura items is listed (checked against pack/mods: tensura_neb adds the Night Rose,
# the White Tiger Azure Dragon Halberd and its boss spawn eggs; greatsage adds Venuzdonoa).
# Tensura addons without items of their own need no entry: tensura_ftb (quest tasks only) and tensura_iron_spells
# (it only adds item tags to Tensura items, which `tensura` already covers).
# lightmanscurrency: Life 1 has no money (its coins are Tensura's, and bank accounts and network traders are also refused
# in the Mortal dimensions by config/lightmanscurrency-server.txt); the Mana Ledger and shops are Life 2 things.
# occultism (O-N1, owner 18/11/2026, design/architecture/paths-necro-artificer.md §0.2): its rituals (possess_skeleton,
# wild_hunt, resurrect_mob, familiars, spirits) are Life 2 things; banning the namespace takes chalk, rituals and every
# Occultism item out of Life 1.
namespaces = ["tensura", "tensura_neb", "greatsage", "lightmanscurrency", "occultism"]

# Single items, full id: items = ["somemod:magic_ring"]
items = []

# Item tags, full id without the #: tags = ["c:ingots/netherite"]
# ttl:paths: the necromancer's and artificer's items and blocks (soul ash, Bone Altar, Workshop Bench, ...;
# data/ttl/tags/item/paths.json). Life 1 stays mortal: the paths open in Life 2.
tags = ["ttl:paths"]

# Exceptions to a namespace ban, full item ids: allow = ["tensura:bronze_coin"]
allow = []

# Iron's Spells 'n Spellbooks schools whose CASTS are refused in the Mortal dimensions (O-N1): Iron's posts a cancellable
# SpellPreCastEvent before every player cast (scrolls and spellbooks alike), life/mortal_banned.js cancels it for these
# schools. Blood (raise_dead, devour, sacrifice, ...) and eldritch are the necromancer's and the abyss's magic. The rest
# of Iron's stays usable in Life 1, and what a soul learns there carries over (D4). Empty list = no veto.
# Fallback if the veto cannot be registered (the log says "[ttl] stash: Iron's spell veto NOT registered"): put
# "irons_spellbooks" into `namespaces` (the master plan's Q13 "Iron's in Life 1: off").
spell_schools = ["irons_spellbooks:blood", "irons_spellbooks:eldritch"]
