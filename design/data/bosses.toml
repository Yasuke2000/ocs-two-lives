# Boss knobs (master plan §8). Edit, then run `python tools/gen_data.py`; the scripts read it as TtlData.bosses.
# Sections: [tombstone] (read by compat/tombstone_bosses.js), then [framework] and the `[[boss]]` tables at the end of
# the file (read by bosses/boss.js, loot.js and commands.js: design/architecture/sprint3-4.md S2).
#
# [tombstone]: which bosses may be bound to a Corail Tombstone "Receptacle of Familiar" (issue #3: a boss as an ally).
# Tombstone binds a tamed creature's soul when the creature takes a lethal hit and its owner carries a receptacle.
# The script vetoes that bind through Tombstone's CaptureSoulEvent, so a vetoed boss just dies. "Covered" bosses are
# `ids` below plus everything in the entity tag #c:capturing_not_supported (Tensura, NEB; new boss mods that join
# the tag are covered automatically).
#
#   mode = "defeated"   (default) the owner can bind a covered boss only if they have slain that boss themselves
#                       (vanilla statistic "killed", killing blow only; counts kills from before this knob existed),
#                       or staff gave them the stage `ttl.defeated.<boss path>`.
#          "allow_list" nobody can bind a covered boss, except the ids in `allow`.
#          "any"        every boss can be bound by anyone (the behaviour before 18/11/2026; undermines boss gating).
#          "none"       no boss can be bound (Tombstone's own default).
#   allow = ids that anyone may bind in every mode except "none". Empty: Shizu is in `ids` instead, so in "defeated"
#           mode she is bound only by a player who has beaten her (owner decision 18/11/2026).
#
# Trade-off: the stat only credits the killing blow, so a party member who never struck the last hit is refused;
# staff fix that with `/kubejs stages add <player> ttl.defeated.<path>` (path = id without the namespace). If
# the veto cannot be registered at start (Tombstone's API changed) the script falls back to "none" and logs it.
# The ids below were read from #c:capturing_not_supported in tensura 2.0.1.5 and tensura_neb 2.0.0.3.

[tombstone]
mode = "defeated"
allow = []
ids = [
  "tensura:akash", "tensura:charybdis", "tensura:elemental_colossus", "tensura:ifrit", "tensura:orc_lord",
  "tensura:orc_disaster", "tensura:sylphide", "tensura:undine", "tensura:war_gnome", "tensura:gazel_dwargo",
  "tensura:hinata_sakaguchi", "tensura:shizu",
  "tensura_neb:rimuru_ogre_fight", "tensura_neb:rimuru_clone", "tensura_neb:carrion", "tensura_neb:luminous_valentine",
]

# ---- Boss framework (bosses/boss.js, bosses/wild.js) ---------------------------------------------------------------
# Every boss has a DEFINITE place and condition (`spawn`: a quest, altar, statue or event summons it at a fixed spot) AND a
# very rare wild spawn (`wild`: a per-day chance while a Life 2 player is in one of its regions). Anyone may fight any
# boss: `spawn.stages` / `requires` only say what the SUMMONER must have done, never which path they walk, and a wild
# boss answers everyone (design/architecture/story-characters.md section 5).
# A boss is summoned (a quest, an altar NPC, `/ttl boss summon <id> [x y z]`, the wild roll), never natural: with block_natural
# a boss entity that Minecraft spawns by itself (natural, chunk generation, spawner, structure piece) is cancelled. Shizu
# no longer has an exemption: she rolls like everyone else (her [boss.wild] below).
# A summoned boss waits with NoAI until a player comes within `range`, then wakes, scales and shows a boss bar.
# Everything that hit it, killed it, or stood within `range` for presence_secs, and is within `range` of the boss when
# it dies, gets the stage `ttl.boss.t<tier>`, the rewards and a kill on its record. Their party members get the same
# (not the Skill Core, see party_credit_range and core_per_party).
# Summoned bosses are never bindable as a Tombstone familiar (see compat/tombstone_bosses.js), whatever [tombstone] says.
#
# [framework] knobs
#   block_natural      = cancel natural spawns of the entities below (true/false)
#   idle_minutes       = a summoned boss that nobody walks up to is removed after this long
#   presence_secs      = seconds within `range` that count as a contribution without a recorded hit (0 = hits and kills only)
#   untame             = strip an `Owner` from a boss every second (naming/taming it must not work)
#   bindable           = boss ids whose summoned instance may still be bound as a Tombstone familiar, subject to [tombstone]
#                        (empty = none: a summoned boss can never be bound)
#   party_credit_range = party members of a credited fighter share the kill if they are within this many x `range` of the
#                        boss at its death, online, Life 2, and were in the party when it was first seen near the boss
#                        (a snapshot, so inviting someone after the wake or the kill gains nothing). They get the stage,
#                        kill count, rep and coins. FTB Teams party teams (one party object, also the future nation).
#   core_per_party     = Skill Cores for party members who are NOT contributors themselves: at most this many per party per
#                        kill (the most damage / presence first). Contributors always get their own core (tier 3+).
#   proxy_bosses       = false switches every `proxy = true` boss off (summon refused, no wild roll). Owner decision O3
#                        (recommendation: on): a character no mod ships (Clayman) is a lore-named proxy on a mob entity.
#
# Instancing (design/architecture/world-state.md §7.1, WP-W2; owner decision O-W1: per-party cooldown + arena queue).
# Nothing here is ever server-wide: one party's kill never locks another party out.
#   cooldown_scope     = "party": a party (raid group, FTB party, or the soul alone) may not summon a boss again while ANY
#                        member defeated it in a story fight less than its cooldown_hours ago (per-soul stamps
#                        ttl.boss.lastkill; offline members count). "server" = the old single server-wide stamp (rollback).
#   arena_gap_minutes  = after a story defeat its arena rests this long before the next summon (ops skip it)
#   max_instances      = story + wild bosses alive at once in the whole world (a summon beyond it waits in the queue)
#   max_per_party      = live story bosses one summoning party may have out at once (refused, not queued)
#   queue_ttl_minutes  = a busy or resting arena queues the summoner's party (place + ETA); when it frees, the head of the
#                        line is told and the arena is held for it this long
#   fight_estimate_minutes = the length of one fight in the ETA a queued party is told (a guess, nothing waits on it)
#   echo_prefix        = boss bar / name prefix of an ECHO: a fight against a boss the world has already seen fall (the
#                        chronicle's firsts). Same numbers, framed as a memory; wild bosses are never echoes.
#   echo_hp_mult       = health multiplier of an echo, only for a party whose highest act is below the boss's act
#                        (story.toml unlock_bosses)
# The continent line (world-state.md §2.0, R11, owner decision 18/11/2026): outside the canon continent (the Overworld
# beyond the coast and its near-coast water) none of this applies: block_natural does not cancel anything there, a
# summon there is refused ("the mod's own spawns rule there"), and the mods' bosses spawn and die as shipped.
#
# [wild] knobs (bosses/wild.js; one poll of the event director, events/director.js, owns the timing)
#   enabled         = the wild roll on/off (`/ttl boss wild roll` still works for ops)
#   max_active      = wild bosses alive at once (bosses summoned by a quest or altar are not counted; [framework]
#                     max_instances still caps everything)
#   max_per_day     = wild starts per Brussels day, min_gap_hours between two starts
#   require_players = Life 2 players inside a boss's listed regions before its roll counts (each one rolls separately)
#   distance        = [min, max] blocks from the chosen player, on the surface (a loaded chunk, no water unless the boss says)
#   idle_minutes    = a wild boss nobody comes to is removed after this long (default: the framework idle_minutes)
#   ignore_requires = a wild boss answers everyone: skips `requires` and `spawn.stages`. Wild and story are separate: no
#                     party cooldown is read or stamped, a story fight of the same boss never blocks the roll (and a wild
#                     one never blocks the story fight)
#   rewards_mult    = multiplies the rep and coins of a wild kill (the Skill Core never)
#   announce        = title + chat line to Life 2 players and a Discord #story line when a wild boss appears
#   life2_only      = only Life 2 players count for the roll (and never a test bot)
#
# [[boss]] fields
#   id        = short id used by commands and keys, [a-z0-9_]; equals the entity path (the stage ttl.defeated.<id> is
#               what compat/tombstone_bosses.js reads), except a `proxy` boss, which is named for its character
#   entity    = the entity type (read from the jars; one boss per entity, because kills are read per entity from the
#               scoreboard objective ttl.b.<id> with criterion minecraft.killed:<entity>)
#   proxy     = true: the entity is an ordinary mob that stands in for a character no mod ships. It is exempt from
#               block_natural and from the #ttl:boss tag (its mob keeps spawning and keeps L2Hostility traits).
#   tier      = 1..4, gives the stage ttl.boss.t<tier>
#   title     = lore name: custom name and boss bar (no quotes or backslashes)
#   arena     = where it is summoned by default: { landmark = "<name in landmarks.toml>" } (surface at that landmark,
#               Overworld), { anchor = "<design/data/anchors.toml id>", dx, dz } (an overworld place of Lerfing's map;
#               dx/dz optional; gen_data writes x/z) or { x, z } (other dimensions); + optional y = else the surface,
#               dim = default minecraft:overworld, radius = bound arena: summons outside it are refused and a boss pulled
#               further than 2 x radius is put back.
#               Without an arena it is summoned where the command or altar says (`/ttl boss summon <id> <x y z>`,
#               or at the player who runs it).
#   spawn     = { kind, at, stages }: the fixed encounter. kind = quest (a quest command reward or `/ttl story fight <id>`
#               calls TtlBoss.summon with the player), altar (an NPC or statue dialog calls it), statue (a seated statue
#               stands for the boss: Gazel), event (the event director or a script, e.g. the Falmuth invasion).
#               statue = the entity tag of the seated statue (kind = statue only): while a story instance of the boss is
#               out, the statue steps aside (removed at the summon; its keeper, life/dwargon.js, does not re-seat it until
#               the fight is over).
#               at = the arena of this encounter, same shapes as `arena` plus { build = "<design/builds name>" }: the anchor
#               of the placed build (its recorded position, else the canon x/z), no radius. Default: `arena`.
#               stages = stages the SUMMONER must hold in addition to `requires` (never ttl.path.*: anyone may fight).
#               A boss with neither `spawn` nor `arena` is wild-only (and needs a `wild`).
#   wild      = { chance_per_day, regions, path_mult, weather, time, biomes, surface, cooldown_hours, cap }
#               chance_per_day = probability that a day of one player's presence in a listed region produces one start
#                         (rolled each poll as chance x elapsed minutes / 1440); 0 = never (the knob stays)
#               regions = canon region letters (canon_regions.json) the player AND the spot must be in
#               path_mult = { light = n, dark = n }: multiplier on the chance of a player on that story path (stage
#                         ttl.path.<x>); default 1
#               weather = any | thunder | rain, time = any | night | day, biomes = ids the spot must be in (empty = any)
#               surface = land (default: dry ground) | water (a lake or sea surface) | any
#               cooldown_hours = minimum hours between two wild starts of this boss (default: its cooldown_hours)
#               cap = wild starts of this boss per day (default 1)
#   kill_rep  = { <faction> = n, flag = "<story flag>", unless_flag = "<story flag>" } applied to everyone credited with the
#               kill, on top of rewards (a regicide costs rep even for a light player). The ONE source of kill costs: with
#               the story core loaded, boss.js hands each winner to TtlStory.onBossKill (rep, flag set on a paid kill; a
#               soul holding unless_flag pays nothing and loses that flag: the honour duel); without it boss.js applies
#               the rep alone. A summon with opts.duel = true (an ops honour duel) skips it altogether.
#   requires  = boss ids that the summoner must have defeated (stage ttl.defeated.<id>); ops bypass it
#   hp_mult, per_player_mult = max health = vanilla x (hp_mult + per_player_mult x (players within range - 1)).
#               Minecraft clamps a max health attribute at 1024: check Health in game for the big ones.
#   range     = blocks: wakes the boss, scales it, and decides who is "in the fight"
#   phases    = [{ at_hp = 0.5 (fraction left, descending), say, minions = "<entity>", count, enrage = <strength amp> }]
#   rewards   = { rep = { <faction> = n }, coins = { bronze|silver|gold|stellar_gold = n }, core = true (tier 3+ only) }
#               rep goes through `/ttl rep add <player> <faction> <n>` (rep/rep.js, S3: silent until that exists)
#   drops     = [{ item, count, chance }] extra loot on top of the entity's own table (bosses/loot.js, LootJS)
#   cooldown_hours = a party may not summon the boss again this long after one of its members defeated it in a story
#               fight (cooldown_scope; ops bypass it). Also the default hours between two wild starts of the boss.
#
# Wild odds are the owner-decision O7 starting values (T1 3 %/day ... T4 0.1 %/day, Hinata x3 for dark-path players); tune
# them after two weeks of #story data. Spirits of the Dwelling, Gazel and Rimuru have no wild spawn (chance 0 or no table).

[framework]
block_natural = true
bindable = ["shizu"]
idle_minutes = 30
presence_secs = 15
untame = true
party_credit_range = 2.0
core_per_party = 1
proxy_bosses = true
cooldown_scope = "party"
arena_gap_minutes = 10
max_instances = 4
max_per_party = 1
queue_ttl_minutes = 20
fight_estimate_minutes = 15
echo_prefix = "Echo · "
echo_hp_mult = 0.85

[wild]
enabled = true
max_active = 1
max_per_day = 2
min_gap_hours = 6
require_players = 1
distance = [64, 160]
idle_minutes = 30
ignore_requires = true
rewards_mult = 1.0
announce = true
life2_only = true

