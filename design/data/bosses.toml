# Boss knobs (master plan §8). Edit, then run `python tools/gen_data.py`; the scripts read it as TtlData.bosses.
# Sections: [tombstone] (read by compat/tombstone_bosses.js), then [framework] and the `[[boss]]` tables at the end of
# the file (read by bosses/boss.js, loot.js and commands.js: design/architecture/sprint3-4.md S2).
#
# [tombstone]: which bosses may be bound to a Corail Tombstone "Receptacle of Familiar" (issue #3: a boss as an ally).
# Tombstone binds a tamed creature's soul when the creature takes a lethal hit and its owner carries a receptacle.
# The script vetoes that bind through Tombstone's CaptureSoulEvent, so a vetoed boss just dies. "Covered" bosses are
# `ids` below plus everything in the entity tag #c:capturing_not_supported (Tensura, NEB; new boss mods that join
# the tag are covered automatically).
#
#   mode = "defeated"   (default) the owner can bind a covered boss only if they have slain that boss themselves
#                       (vanilla statistic "killed", killing blow only; counts kills from before this knob existed),
#                       or staff gave them the stage `ttl.defeated.<boss path>`.
#          "allow_list" nobody can bind a covered boss, except the ids in `allow`.
#          "any"        every boss can be bound by anyone (the behaviour before 18/11/2026; undermines boss gating).
#          "none"       no boss can be bound (Tombstone's own default).
#   allow = ids that anyone may bind in every mode except "none". Empty: Shizu is in `ids` instead, so in "defeated"
#           mode she is bound only by a player who has beaten her (owner decision 18/11/2026).
#
# Trade-off: the stat only credits the killing blow, so a party member who never struck the last hit is refused;
# staff fix that with `/kubejs stages add <player> ttl.defeated.<path>` (path = id without the namespace). If
# the veto cannot be registered at start (Tombstone's API changed) the script falls back to "none" and logs it.
# The ids below were read from #c:capturing_not_supported in tensura 2.0.1.5 and tensura_neb 2.0.0.3.

[tombstone]
mode = "defeated"
allow = []
ids = [
  "tensura:akash", "tensura:charybdis", "tensura:elemental_colossus", "tensura:ifrit", "tensura:orc_lord",
  "tensura:orc_disaster", "tensura:sylphide", "tensura:undine", "tensura:war_gnome", "tensura:gazel_dwargo",
  "tensura:hinata_sakaguchi", "tensura:shizu",
  "tensura_neb:rimuru_ogre_fight", "tensura_neb:rimuru_clone", "tensura_neb:carrion", "tensura_neb:luminous_valentine",
]

# ---- Boss framework (bosses/boss.js) -------------------------------------------------------------------------------
# A boss is summoned (a quest, an altar NPC, `/ttl boss summon <id> [x y z]`), never natural: with block_natural a boss
# entity that Minecraft spawns by itself (natural, chunk generation, spawner, structure piece) is cancelled.
# A summoned boss waits with NoAI until a player comes within `range`, then wakes, scales and shows a boss bar.
# Everything that hit it, killed it, or stood within `range` for presence_secs, and is within `range` of the boss when
# it dies, gets the stage `ttl.boss.t<tier>`, the rewards and a kill on its record.
# Summoned bosses are never bindable as a Tombstone familiar (see compat/tombstone_bosses.js), whatever [tombstone] says.
#
# [framework] knobs
#   block_natural = cancel natural spawns of the entities below (true/false)
#   idle_minutes  = a summoned boss that nobody walks up to is removed after this long
#   presence_secs = seconds within `range` that count as a contribution without a recorded hit (0 = hits and kills only)
#   untame        = strip an `Owner` from a boss every second (naming/taming it must not work)
#   natural_allow = boss ids exempt from block_natural: the entity still spawns by itself in the wild (Shizu, owner
#                   decision 18/11/2026); only the summoned, tagged instance is a framework boss
#   bindable      = boss ids whose summoned instance may still be bound as a Tombstone familiar, subject to [tombstone]
#                   (empty = none: a summoned boss can never be bound)

[framework]
block_natural = true
natural_allow = ["shizu"]
bindable = ["shizu"]
idle_minutes = 30
presence_secs = 15
untame = true

# [[boss]] fields
#   id        = short id used by commands and keys, [a-z0-9_]; equals the entity path (the stage ttl.defeated.<id> is
#               what compat/tombstone_bosses.js reads)
#   entity    = the entity type (read from the jars; one boss per entity, because kills are read per entity from the
#               scoreboard objective ttl.b.<id> with criterion minecraft.killed:<entity>)
#   tier      = 1..4, gives the stage ttl.boss.t<tier>
#   title     = lore name: custom name and boss bar (no quotes or backslashes)
#   arena     = where it is summoned: { landmark = "<name in landmarks.toml>" } (surface at that landmark, Overworld),
#               or { x, z } (+ optional y = else the surface, dim = default minecraft:overworld, radius = bound arena:
#               summons outside it are refused and a boss pulled further than 2 x radius is put back).
#               Without an arena it is summoned where the command or altar says (`/ttl boss summon <id> <x y z>`,
#               or at the player who runs it).
#   requires  = boss ids that the summoner must have defeated (stage ttl.defeated.<id>); ops bypass it
#   hp_mult, per_player_mult = max health = vanilla x (hp_mult + per_player_mult x (players within range - 1)).
#               Minecraft clamps a max health attribute at 1024: check Health in game for the big ones.
#   range     = blocks: wakes the boss, scales it, and decides who is "in the fight"
#   phases    = [{ at_hp = 0.5 (fraction left, descending), say, minions = "<entity>", count, enrage = <strength amp> }]
#   rewards   = { rep = { <faction> = n }, coins = { bronze|silver|gold|stellar_gold = n }, core = true (tier 3+ only) }
#               rep goes through `/ttl rep add <player> <faction> <n>` (rep/rep.js, S3: silent until that exists)
#   drops     = [{ item, count, chance }] extra loot on top of the entity's own table (bosses/loot.js, LootJS)
#   cooldown_hours = a summon through TtlBoss.summon is refused this long after the last defeat (ops bypass it)

[[boss]]
id = "orc_lord"
entity = "tensura:orc_lord"
tier = 1
title = "Geld, the Orc Lord"
arena = { landmark = "orc_camp" }
hp_mult = 2.0
per_player_mult = 0.5
range = 48
cooldown_hours = 24
phases = [
  { at_hp = 0.6, minions = "tensura:orc", count = 4, say = "The horde answers the Orc Lord's roar." },
  { at_hp = 0.3, enrage = 1, say = "Hunger drives the Orc Lord into a frenzy." },
]
rewards = { rep = { tempest = 5 }, coins = { silver = 10 } }

