# ---- Jura forest story bosses: both fights happen AT TEMPEST (Overworld, village centre 0 0 = TtlTempest.LANDMARK in
# life/tempest.js; move arena x/z together with it). Players reach Tempest through the dangerous magicule of the forest,
# so getting there is part of the challenge. `radius` binds the arena: a summon is refused outside it (ops included,
# unless they give coordinates inside it), and a boss pulled further than 2 x radius is put back.
# Shizu first; Rimuru only answers a summoner who holds the stage ttl.defeated.shizu (`requires`; ops bypass it).
# Both are non-tamable like every framework boss; see [framework] bindable and the Tombstone note in decisions.md.

[[boss]]
id = "shizu"
entity = "tensura:shizu"
tier = 2
title = "Shizu, the Flame Tyrant"
arena = { x = 0, z = 0, radius = 48 }
hp_mult = 3.0
per_player_mult = 0.75
range = 56
cooldown_hours = 48
phases = [
  { at_hp = 0.6, enrage = 1, say = "Flames gather around Shizu." },
  { at_hp = 0.3, enrage = 2, say = "Shizu's mask slips; the Flame Tyrant fights for her life." },
]
rewards = { rep = { tempest = 10 }, coins = { gold = 3 } }

