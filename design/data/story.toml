# The overarching story: the Oath, seven acts, flags, boss kill costs, the Legendary pools and what the cast says
# (design/architecture/story-characters.md §2, §3, §6.1). Scripts: pack/kubejs/server_scripts/ttl/story/ (story.js = the
# API, commands.js = /ttl story). Edit, then run `python tools/gen_data.py` (check_story validates every entry).
# Test: tests/ingame/story.rcon.
#
# Every number below is a knob. Where the architecture doc left an owner decision open (§8) this file holds the doc's
# recommendation; the owner (Yasuke) changes the single line named in the comment.
#
# State (the scripts keep it, quests read it):
#   player persistentData  ttl.story.path (light|dark), .oath (epoch ms), .flips, .acts {act: epoch}, .flags {flag: epoch}, .pending
#   stages                 ttl.path.light | ttl.path.dark (exactly one after the Oath), ttl.story.act<N> (act done),
#                          ttl.story.<flag> (flag set)
#   scoreboard ttl.path    0 none, 1 light, 2 dark
#   server persistentData  ttl.story.parties {teamId: {path, oathBy, at}}, ttl.story.log (ring), ttl.story.unlocked [boss ids]
# Reputation deltas go through TtlRep.add, renown through TtlRep.addRenown (once per act and flag), uniques never.

[rules]
sequential_acts = true      # an act can only be completed after the one before it (ops can still set the state with `/ttl story set`)
fight_near = 96             # blocks from a boss arena's centre a player must stand within to start its fight with `/ttl story fight`
log_size = 200              # entries kept in the server ring ttl.story.log
party_oath = true           # the party leader's Oath is applied to every online party member (needs the party layer, WP-S2)

[oath]
menu_title = "The Oath"
require_stage = ""          # a stage the soul must hold before the Oath can be sworn ("" = no gate; the chapter 7 quest is the gate in play)
# O5 (Unaligned Oath for Legend-tier souls): the recommendation is NO. true adds a third choice "Walk alone" for souls with
# the stage ttl.tier.legendary; it counts as the light path for every gate and gives the title below.
unaligned_for_legend = false
unaligned_title = "Unaligned"

[oath.light]
item = "minecraft:lantern"
label = "Stand with Tempest"
lore = "Rigurd's trust is yours: the forest folk hold you as one of their own. Tempest and its friends will open their doors, and the Orc Horde and the Outcasts will not."
say = "You have taken the Oath of the Light. Tempest remembers who stood with it."
rep = { tempest = 20 }
title = ""
fallen_title = "Repentant"  # a Fallen soul (stage ttl.tier.dark) who swears the light Oath
line = "swore the Oath of the Light at the crossroads of Tempest."

[oath.dark]
item = "minecraft:soul_lantern"
label = "Walk the Outcast road"
lore = "The Outcast Society marks you and the Orc Horde watches with interest. Tempest will cool toward you, but the roads the good folk never see are open."
say = "You have taken the Oath of the Dark. The Outcasts have marked you."
rep = { outcast = 20, orc_horde = 15, tempest = -20 }
title = "Marked"
remembers = "Your soul remembers."   # first line of the dark choice for a Fallen soul (stage ttl.tier.dark)
line = "swore the Oath of the Dark at the crossroads of Tempest."

# One reversible twist per soul (`max`). Atonement (dark to light) and Corruption (light to dark) swap the path stages
# and apply the deltas below; they are opened by flags the quests set. `requires_any` = at least one of these flags.
[flip]
max = 1

[flip.atonement]
requires_any = ["atonement"]                 # set by the Act V quest once its three hand-ins are done (WP-S8)
set = { tempest = 0 }                        # reputation set to an exact value before `rep` is added
rep = {}
title = "Repentant"
say = "Atonement: you turn from the Outcast road. What was done stays done, but Tempest listens again."
line = "atoned and turned back to the light."

[flip.corruption]
requires_any = ["regicide", "charybdis_woke", "falmuth_march"]
set = {}
rep = { outcast = 10, tempest = -10 }
title = "Marked"
say = "Corruption: the deed you did cannot be undone, and the dark road opens to you."
line = "was corrupted and turned to the dark."

# ---------------------------------------------------------------------------------------------------------------------
# Flags: facts about the story. `path` (optional) = only a soul on that path can earn it. A flag may carry renown (once),
# a title, a reputation delta and a #story line. They are set by quests (`ttl story flag @p <id>`), bosses (kill_rep below)
# and the capstone (WP-S9).

[flag.hero]
path = "light"
renown = 60
title = "True Hero"
line = "has become a True Hero."

[flag.demon_lord]
path = "dark"
renown = 60
title = "Demon Lord"
line = "has risen as a Demon Lord."

[flag.regicide]
title = ""
line = ""

[flag.charybdis_woke]
line = ""

[flag.falmuth_march]
line = ""

[flag.honour_duel]          # set before the Gazel duel of the light lane: the kill costs no reputation and is not a regicide
line = ""

[flag.unaligned]            # set by the Unaligned Oath (O5, off by default)
line = ""

[flag.atonement]            # opens the Atonement twist (see [flip.atonement])
line = ""

[flag.orcs_joined]          # chapter 9, light lane: the surviving orcs are fed at the camp and join Tempest (our interpretation of anime ep. 15)
path = "light"
line = "spared the orcs of the Horde, and they joined Tempest."

[flag.horde_leader]         # chapter 9, dark lane: the Orc Lord is devoured and the Horde follows the soul who did it
path = "dark"
line = "devoured the Orc Lord and now leads the Orc Horde."

# ---------------------------------------------------------------------------------------------------------------------
# The seven acts. `chapters` = FTB Quests chapter numbers of the act. `light_rep` / `dark_rep` are applied to the soul's
# path when the act is completed (act 1 is completed by the Oath itself, which carries its own deltas). `renown` goes
# through TtlRep.addRenown once. `unlock_bosses` is added to the server set ttl.story.unlocked (the event director may pick
# from it). Fights are NOT gated by acts (owner: anyone may fight on any path). The rep numbers are our interpretation:
# the doc fixes the Oath, Gazel -60, Horde +40 and the Act V swing; the rest is a starting point to tune.

[[act]]
id = 1
key = "forest_awakens"
title = "The Forest Awakens"
chapters = [1, 2, 7]
light_rep = {}
dark_rep = {}
renown = 5
story_line = "took an Oath at Tempest, and Act I of the story begins."
unlock_bosses = ["supermassive_slime"]

[[act]]
id = 2
key = "armed_nation"
title = "The Armed Nation"
chapters = [3, 8]
light_rep = { dwargon = 15 }
dark_rep = { dwargon = -20, outcast = 10 }
renown = 5
story_line = "finished Act II: the Armed Nation of Dwargon has taken the measure of them."
unlock_bosses = ["gazel_dwargo"]

[[act]]
id = 3
key = "orc_war"
title = "The Orc War"
chapters = [4, 9]
light_rep = { lizardmen = 20, tempest = 10 }
dark_rep = { orc_horde = 40, lizardmen = -20 }   # the caverns raid of chapter 9 (the doc fixes Horde +40; lizardmen -20 is ours)
renown = 10
story_line = "finished Act III: the Orc War is decided."
unlock_bosses = ["orc_lord", "orc_disaster"]

[[act]]
id = 4
key = "calamity"
title = "Calamity"
chapters = [10]
light_rep = { tempest = 15 }
dark_rep = { outcast = 20 }
renown = 15
story_line = "finished Act IV: the calamity over Lake Siss has passed."
unlock_bosses = ["charybdis"]

[[act]]
id = 5
key = "holy_knight"
title = "The Holy Knight"
chapters = [11]
light_rep = { holy_church = 10 }
dark_rep = { tempest = -40, falmuth = 30 }
renown = 20
story_line = "finished Act V: the mask has fallen and the blades have crossed."
unlock_bosses = ["shizu", "ifrit", "hinata_sakaguchi", "rimuru_ogre_fight", "folgen", "kyoya_tachibana", "shogo_taguchi", "kirara_mizutani"]

[[act]]
id = 6
key = "walpurgis"
title = "Walpurgis"
chapters = [12]
light_rep = { tempest = 10, holy_church = 5 }
dark_rep = { outcast = 15, orc_horde = 10 }
renown = 30
story_line = "finished Act VI: the Walpurgis council has met."
unlock_bosses = ["carrion", "luminous_valentine", "rimuru_clone", "clayman"]

[[act]]
id = 7
key = "harvest_festival"
title = "Demon Lord or True Hero"
chapters = [13]
light_rep = { tempest = 10, blumund = 10 }
dark_rep = { outcast = 20 }
renown = 50
story_line = "finished Act VII: the harvest festival is over and nothing is the same."
unlock_bosses = ["veldora"]

# ---------------------------------------------------------------------------------------------------------------------
# What a boss kill costs lives in bosses.toml (`kill_rep = { <faction> = n, flag = "<flag>", unless_flag = "<flag>" }` per
# boss): bosses/boss.js `finish` hands every credited winner to TtlStory.onBossKill, which reads it, applies the rep, sets
# `flag` on a paid kill and, for a soul that holds `unless_flag`, charges nothing and spends that flag (the honour duel).
# The flag ids must be [flag.*] tables above (check_story).

# ---------------------------------------------------------------------------------------------------------------------
# Legendary pools for the Act VII capstone (WP-S9: TtlRegistry.draw with allowLegendary and the max_holders ceiling of
# skills.toml; a full roster means a Skill Core and a title instead). O6 recommendation: light = Great Sage / Creator,
# dark = Predator and the sins. Ids must be skills.toml [legendary] skills.

[legendary]
light = ["great_sage", "creator"]
dark = ["predator", "wrath", "pride", "greed", "lust", "envy", "sloth"]

# ---------------------------------------------------------------------------------------------------------------------
# The cast. `/ttl story talk <id>` picks ONE entry for the soul that asks (a Life 2 player) and prints it with its buttons.
# NPC entities and Easy NPC dialogs call that command (WP-S4); this file owns the words.
#   path        light | dark | any (default any); the soul's Oath path (a soul with no Oath only gets `any` entries)
#   act         the act the soul is in, from this act on: completed acts + 1, so 1 before the Oath and 2 right after it
#   until_act   optional: stops applying after this act
#   faction + at_most | at_least   optional condition on the soul's reputation band with that faction
# The best matching entry wins: a path-specific one over `any`, then the higher `act`, then one with a faction condition,
# then the later one in the file. `buttons` run player commands (`ttl ...` only, no chains).

[[npc]]
id = "rigurd"
name = "Rigurd"
color = "gold"

[[npc.talk]]
act = 1
text = "Welcome to Tempest, stranger. We goblins have little, but we remember who stood with us. When you are ready to say where you stand, there is a crossroads waiting."
buttons = [{ label = "Take the Oath", command = "ttl story oath" }]

[[npc.talk]]
path = "light"
act = 2
text = "You swore at the crossroads and Tempest has not forgotten it. My people owe you a seat at the fire. There is work, if you want it."

[[npc.talk]]
path = "dark"
act = 2
text = "I know that mark. I will not turn you out of Tempest, but do not look to me for help. Go to the Outcast who waits by the road."

[[npc]]
id = "gobta"
name = "Gobta"
color = "green"

[[npc.talk]]
act = 1
text = "Oh, are you new? I am Gobta! The strongest goblin in the forest, no question. Do not ask Rigurd, he is jealous."

[[npc.talk]]
path = "light"
act = 2
text = "You swore the Oath? Then you are with us. Come on, I will show you the best spot to sit and do nothing while others work."

[[npc.talk]]
path = "dark"
act = 2
text = "Oh, that mark? Huh. I do not care. Want to see me wrestle a direwolf? Do not tell Rigurd."

[[npc]]
id = "benimaru"
name = "Benimaru"
color = "red"

[[npc.talk]]
act = 1
text = "A new face. Tempest is small, but it is ours. Prove you are no threat and you will be welcome."

[[npc.talk]]
path = "light"
act = 2
text = "The war council is open to those who stand with Tempest. When the horde moves, we will need every blade."

[[npc.talk]]
path = "dark"
act = 2
text = "You carry the Outcasts' mark. I will watch you, and so will my guard. Do not give me a reason."

[[npc]]
id = "shuna"
name = "Shuna"
color = "light_purple"

[[npc.talk]]
act = 1
text = "Welcome. If you have cloth or herbs to spare, the weaving hut can always use them."

[[npc.talk]]
path = "dark"
act = 2
text = "I will weave for anyone who is kind to my people. For you, it depends on what you do next."

[[npc.talk]]
path = "dark"
act = 2
faction = "tempest"
at_most = "hostile"
text = "I am sorry. I cannot weave for you while Tempest holds you in such low regard."

[[npc]]
id = "shion"
name = "Shion"
color = "dark_purple"

[[npc.talk]]
act = 1
text = "Halt. State your business. Lord Rimuru's house is not open to just anyone."

[[npc.talk]]
path = "light"
act = 2
text = "Stand with Tempest and you may pass. Lord Rimuru's safety is my business, and so are his friends."

[[npc.talk]]
path = "dark"
act = 2
faction = "tempest"
at_most = "hostile"
text = "You will go no further. One more step toward Lord Rimuru and I will not be gentle."

[[npc]]
id = "hakurou"
name = "Hakurou"
color = "white"

[[npc.talk]]
act = 1
text = "Hm. Your stance is sloppy. Come back when you can stand for an hour and I will show you what a sword is for."

[[npc.talk]]
act = 2
text = "The Oath sits on your shoulders, I see. A true blade is measured by what it protects. Train your abilities, and I will watch."

[[npc]]
id = "kaijin"
name = "Kaijin"
color = "gold"

[[npc.talk]]
act = 1
text = "A dwarf forges, a human wields. Bring me good ore and I will tell you which of the two of us is the better smith."

[[npc.talk]]
path = "dark"
act = 2
text = "I hear the Outcasts pay well for plans of the Dwargon forges. I did not say that. Do not repeat it."

[[npc]]
id = "treyni"
name = "Treyni"
color = "dark_green"

[[npc.talk]]
act = 1
text = "The forest breathes with an unrest I cannot name. Be careful what you wake."

[[npc.talk]]
path = "light"
act = 2
text = "The trees remember what the Oath means. Beware the lake: a calamity is gathering above its waters."

[[npc.talk]]
path = "dark"
act = 2
text = "I warned you. The trees will say no more to you."

[[npc]]
id = "gazel"
name = "Gazel Dwargo"
color = "dark_red"

[[npc.talk]]
act = 1
text = "A king receives those who bring worth to his hall. Show me yours."

[[npc.talk]]
path = "light"
act = 2
text = "You stand with the free peoples. Then let us test that: face me in an honour duel, and nothing will be held against you."
buttons = [{ label = "Challenge the King", command = "ttl story fight gazel_dwargo" }]

[[npc.talk]]
path = "dark"
act = 2
text = "I know what road you walk. A king does not bow to it. If you want my seat, you will have to take it."
buttons = [{ label = "Take the throne", command = "ttl story fight gazel_dwargo" }]

[[npc]]
id = "outcast_contact"
name = "The Outcast"
color = "dark_gray"

[[npc.talk]]
path = "dark"
act = 2
text = "So you have chosen. Good. The Society does not forget those who walk with it, and the Horde has plans for a strong blade."

[[npc.talk]]
act = 1
text = "Nothing to say to someone who has not chosen yet. Come back when you have."

# ---------------------------------------------------------------------------------------------------------------------
# The rest of the cast (WP-S4; design/data/npcs.toml puts them in the world, this file owns the words). Same entry rules as
# above. Characters with a mod entity (Hinata, Luminous, Carrion, Folgen, Kyoya, Shogo, Kirara) are tame statues; the others
# are Easy NPCs. The lines are our own wording of the canon roles in design/architecture/story-characters.md §1.2; a quest
# chapter that needs a character to say more adds entries here (a later `act` wins).

[[npc]]
id = "souei"
name = "Souei"
color = "dark_aqua"

[[npc.talk]]
act = 1
text = "I saw you before you saw the village. The forest tells me who walks it. Stay on the paths and we will not have to talk again."

[[npc.talk]]
path = "light"
act = 2
text = "You swore for Tempest. Good. I have places that need eyes, and not everyone can be trusted to look quietly."

[[npc.talk]]
path = "dark"
act = 2
text = "The mark on you is known to me. I have not decided what it means. Until I do, I will be the shadow you do not see."

[[npc]]
id = "garm"
name = "Garm"
color = "gold"

[[npc.talk]]
act = 1
text = "Armour is a promise: it holds so you can come home. Bring me hides and metal, and I will keep that promise for you."

[[npc.talk]]
path = "dark"
act = 2
text = "Kaijin says to keep my mouth shut around people with your mark. I am only an armourer. I mend what is brought to me."

[[npc]]
id = "dold"
name = "Dold"
color = "yellow"

[[npc.talk]]
act = 1
text = "Rings, clasps, little things that make a hard life nicer. Do not tell my brothers I enjoy it more than the big forging."

[[npc.talk]]
path = "light"
act = 2
text = "A friend of Tempest? Then I will make you something worth wearing. Bring gold, and a reason."

[[npc]]
id = "mildo"
name = "Mildo"
color = "gray"

[[npc.talk]]
act = 1
text = "..."

[[npc.talk]]
act = 2
text = "Houses first. Then roads. Then walls. Do not walk through the frame, it is not finished."

[[npc]]
id = "kabal"
name = "Kabal"
color = "red"

[[npc.talk]]
act = 1
text = "Another new face in the guild hall. I am Kabal, rank B, and I have been doing this long enough to give advice for free: do not take the jobs that pay too well."

[[npc.talk]]
act = 5
text = "You want to hear about the masked woman? Sit down, then. Eren, Gido, help me remember it right."

[[npc]]
id = "elen"
name = "Eren"
color = "aqua"

[[npc.talk]]
act = 1
text = "Mana does not care how brave you are, only how careful. Keep that in mind and you will outlive most of this hall."

[[npc.talk]]
act = 5
text = "She did not look like a monster. That is what I remember. She looked tired, and very far from home."

[[npc]]
id = "gido"
name = "Gido"
color = "green"

[[npc.talk]]
act = 1
text = "Heh. Somebody has to stand in front. If you want the job, learn to take a hit before you learn to give one."

[[npc.talk]]
act = 5
text = "Kabal tells it better than I do, but I will say this much: I would not have raised a blade at her if I had known."

[[npc]]
id = "milim"
name = "Milim Nava"
color = "light_purple"

[[npc.talk]]
act = 1
text = "Hm? You are one of the small ones. Fine! I am Milim Nava, the strongest Demon Lord there is, and I am bored. Make it interesting, or do not waste my time!"

[[npc.talk]]
path = "light"
act = 2
text = "Rimuru's people, right? Rimuru is my best friend! Which makes you almost my friend. Keep it up and I might even remember your name."

[[npc.talk]]
path = "dark"
act = 2
text = "You smell of a different road. I do not care which side you are on, as long as it is fun. Do not make it boring."

[[npc.talk]]
path = "light"
act = 4
text = "Hey, Rimuru's friend! Something big is swimming in that lake and it is not Rimuru. Do you want me to hit it? I will, if you ask nicely. Bring honey."

[[npc.talk]]
path = "dark"
act = 4
text = "There is a lake monster and somebody has been poking it. I can smell who. Do not ask me to help; I like it when you stay interesting."

[[npc]]
id = "yuuki"
name = "Yuuki Kagurazaka"
color = "yellow"

[[npc.talk]]
act = 1
text = "Welcome to the Free Guild's headquarters. I am the Grandmaster. People take that more seriously than I do, which is useful."

[[npc.talk]]
path = "light"
act = 5
text = "Hinata hates being used as a favour, so I would not mention my name when you meet her. Pass her my regards anyway."

[[npc.talk]]
path = "dark"
act = 5
text = "A letter finds the right hands sometimes. I never wrote it, of course. But if I had, I would say: wake what sleeps, and see who flinches."

[[npc]]
id = "edmaris"
name = "King Edmaris"
color = "blue"

[[npc.talk]]
act = 1
text = "A commoner in my throne room. Speak quickly; Falmuth has richer guests waiting at the door."

[[npc.talk]]
path = "light"
act = 5
text = "You stand with the monsters of Tempest. I give you one chance to leave their side. You will not get a second."

[[npc.talk]]
path = "dark"
act = 5
text = "I hear you have no love for that slime. Then we are not enemies. Razen will tell you what Falmuth needs done."

[[npc]]
id = "razen"
name = "Razen"
color = "dark_blue"

[[npc.talk]]
act = 1
text = "The king has no time for you. I have even less. If you have something to say, say it to the guards."

[[npc.talk]]
path = "dark"
act = 5
text = "Falmuth rewards loyalty. March with us against Tempest and the king will remember your name, and so will I."

[[npc]]
id = "frey"
name = "Frey"
color = "aqua"

[[npc.talk]]
act = 1
text = "Hmph. A visitor. I rule the skies, and I am not in a mood for greetings. Say what you came to say, or go."

[[npc.talk]]
act = 6
text = "So the council meets and the lesser ones listen at the door. Remember it: this is a table where words can start wars."

[[npc]]
id = "guy"
name = "Guy Crimson"
color = "dark_red"

[[npc.talk]]
act = 1
text = "Hm. You have a little spark in you. Do not let it go out before I can see what it does."

[[npc.talk]]
act = 6
text = "Walpurgis is a pastime for those who have lived too long. Watch closely, small one. Someone at this table is about to overreach."

[[npc]]
id = "leon"
name = "Leon Cromwell"
color = "yellow"

[[npc.talk]]
act = 1
text = "You look lost. This hall is no place for the idle. State your business, or leave."

[[npc.talk]]
act = 6
text = "I have little patience for this council. But if you bring me a reason to stay, I might."

[[npc]]
id = "dagruel"
name = "Dagruel"
color = "dark_green"

[[npc.talk]]
act = 1
text = "Hm. You walk lightly, small one. The earth notices. So do I."

[[npc.talk]]
act = 6
text = "A council needs someone who listens. I have listened for a long time. Speak, and I will tell you if it is worth hearing."

[[npc]]
id = "ramiris"
name = "Ramiris"
color = "aqua"

[[npc.talk]]
act = 1
text = "Oh! A visitor in my glade. I am Ramiris, the smallest and cleverest Demon Lord. Do not tell anyone I said smallest."

[[npc.talk]]
path = "light"
act = 2
text = "The spirits like you. They are whispering. That is a good sign. Come back when you have more stories."

[[npc.talk]]
path = "dark"
act = 2
text = "The spirits are quiet around you. That is... interesting. I will not say more. But I will keep watching."

[[npc]]
id = "hinata"
name = "Hinata Sakaguchi"
color = "white"

[[npc.talk]]
act = 1
text = "A statue of the Holy Knight stands in her hall, and the knights say she watches whoever walks past. They polish it every morning."

[[npc.talk]]
path = "light"
act = 5
text = "The Knight remembers the ones who faced her blade without lying. Meet her on the road, and she will listen."

[[npc.talk]]
path = "dark"
act = 5
text = "The knights go quiet when they see your mark. The statue seems to look a little longer at you than at anyone else."

[[npc]]
id = "luminous"
name = "Luminous Valentine"
color = "dark_purple"

[[npc.talk]]
act = 1
text = "The Church's god stands above the altar, carved in white: Luminous, whom the faithful pray to and have never seen awake."

[[npc.talk]]
path = "light"
act = 6
text = "Those who were blessed by the Holy Knight are known here. The patron will receive them, when the time comes."

[[npc.talk]]
path = "dark"
act = 6
text = "The candles flicker when you stand close. Whatever sleeps in the crypt below knows you are here."

[[npc]]
id = "carrion"
name = "Carrion"
color = "gold"

[[npc.talk]]
act = 1
text = "The lion king sits his throne as if it were made for him. You have the feeling he is deciding whether you are prey."

[[npc.talk]]
path = "light"
act = 6
text = "A friend of Tempest, then. Laura was rebuilt with Tempest's help, and a lion does not forget a debt. We will spar, you and I."

[[npc.talk]]
path = "dark"
act = 6
text = "Clayman's reach is long, even here. I know who sent you. Prove you are more than a puppet, or leave."

[[npc]]
id = "folgen"
name = "Folgen"
color = "red"

[[npc.talk]]
act = 1
text = "A knight of Falmuth stands at the king's right hand, hand on his sword, watching the door."

[[npc.talk]]
act = 5
text = "Falmuth's field commander does not talk to the likes of you. His eyes say enough: when the horn sounds, he rides east."

[[npc]]
id = "kyoya"
name = "Kyoya Tachibana"
color = "dark_aqua"

[[npc.talk]]
act = 1
text = "One of the summoned ones, in Falmuth's service. He leans against a pillar as if the whole court bored him."

[[npc.talk]]
path = "light"
act = 5
text = "He watches you from under half-closed lids. If you have to cross blades with Falmuth's otherworlders, he will want to go first."

[[npc.talk]]
path = "dark"
act = 5
text = "He looks you over and grins. A blade on the same side as his, for now. Do not mistake that for friendship."

[[npc]]
id = "shogo"
name = "Shogo Taguchi"
color = "gray"

[[npc.talk]]
act = 1
text = "Another of the summoned. He studies you the way a duelist studies a floor before a fight."

[[npc.talk]]
act = 5
text = "Falmuth's otherworlders do not offer names to strangers. He lets his hand rest on his hilt instead."

[[npc]]
id = "kirara"
name = "Kirara Mizutani"
color = "blue"

[[npc.talk]]
act = 1
text = "A summoned girl in Falmuth's court, perfectly polite, perfectly watchful, her hand never far from her wand."

[[npc.talk]]
act = 5
text = "She curtsies, which does not mean she is on your side. Falmuth's otherworlders are loyal to the crown that feeds them."
