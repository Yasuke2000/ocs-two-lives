# Chapter 2 — Tempest Rises (Life 2: helping the young town grow). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md.
#
# Rewards stay modest (food, a little XP, bronze/silver coins, low potions) and NEVER grant skills, races or
# awakenings (design/manas-integration.md §5(d)). Tasks may use `ep` and `ability` (Life 2 only).
#
# Places inside Tempest are real positions from blueprints/tempest.py. The town is pasted so that blueprint
# (45, 57) is world (0, 0) (life/tempest.js: x = bx - 45, z = bz - 57), so:
#   village green (45, 50) -> (0, -7)         council longhouse x35-55 z33-42 -> centre (0, -20)
#   Kaijin's forge x13-25 z40-50 -> (-26, -12)  Shuna's weaving hut x63-72 z44-52 -> (22, -9)
#   raised food store x58-64 z31-36 -> (16, -24)  Rigurd's chief hut x63-71 z14-22 -> (22, -39)
#   goblins' campfire (67, 27) -> (22, -30)    building site (SW) x13-32 z57-65 -> (-22, 4)
#   palisade south gate (45, ~80) -> (0, 23)
# Rigurd and Gobta are summoned on the goblin pieces' own spawn points (life/tempest.js, residents()).
# Nothing here is detected by "talking to" an NPC; quests that meet a resident are location checks.
# Hand-ins (`consume = true`) are submitted in the quest screen and use the items up; everything else only
# checks the inventory. Every quest after the first stays hidden until its dependencies are done.

[chapter]
key = "tempest_rises"
title = "Tempest Rises"
subtitle = "A camp of goblins, a few dwarves and six new kijin. Help them build a town."
icon = "minecraft:campfire"
order = 2
life = 2
hide_until_deps_complete = true
text = """
It is the days just after the ogres were named. Tempest is still a building site: tents beside the first
timber houses, Kaijin's forge smoking on the west road, Shuna's looms in the east, a palisade begun only
on one side. Everything you carry in can become part of the town.
"""

# ---- The first day: the green, Rigurd and Gobta, the council, naming -----------------------------------

[[quests]]
key = "join_town"
title = "A Town on Open Ground"
subtitle = "The village green"
icon = "minecraft:campfire"
lane = 0
col = 0
shape = "gear"
size = 1.5
text = """
Rimuru moved the village to open ground with room to grow and water close by, and insisted on proper
houses and roads from the first day. Stand on the green by the cooking fire: every plan in Tempest starts here.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = [0, -7], radius = 10, title = "The village green" }]
rewards = [{ type = "item", item = "minecraft:bread", count = 4 }, { type = "item", item = "tensura:bronze_coin", count = 2 }]

[[quests]]
key = "meet_rigurd"
title = "Rigurd the Goblin Lord"
icon = "tensura:goblin_club"
deps = ["join_town"]
lane = 0
col = 1
text = """
Rigurd leads the goblins and still lives in the old chief's hut in the goblins' quarter, north-east of the green.
He served the tribe through the direwolf years and is the first to say what the town needs.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = [22, -39], radius = 12, title = "Rigurd's hut" }]
rewards = [{ type = "item", item = "minecraft:cooked_chicken", count = 6 }, { type = "xp", xp = 30 }]

[[quests]]
