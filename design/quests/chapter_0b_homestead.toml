# Chapter 0b — Hearth and Home (Life 1: building a homestead). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Same rules as chapter 0a: vanilla items, `lore` and an honest `karma` line.
#
# Item tasks are generic results (glass panes, barrels, stone walls), never a wood-specific block, because the large biomes of
# the Mortal Realm decide which trees you have. Two quests name Sophisticated Backpacks / Sophisticated Storage items (a pedlar's
# pack and a better chest): both mods are in the pack, enabled in config/sophisticatedcore-common.toml and not in mortal_banned.toml;
# the generator allows exactly those namespaces in Life 1 (LIFE1_NAMESPACES).
# Inspiration: Life in the Village 3's town-and-building focus and the RLCraft/Vault Hunters "light up, store, prepare" advice.
#
# Web: Ready for the Road (0a) -> this chapter; "A Well in the Yard" and "Lamplighter" wait for chapter 0's Iron Age (iron buckets and
# nuggets), "A Bed for Every Guest" for its "A Roof and a Bed". The milestone "Home Fires" is one of the capstones counted by
# "The Ledger" (chapter 0j).

