# Chapter 0f — Folk of the Realm (Life 1: villages, villagers and trade). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# Karma that really is scored: Order +1 per trade with a villager (log curve, so the first trades count most), Order +30 per raid won,
# animals bred, advancements (Faith +2). Killing a villager, an iron golem or a wandering trader is Chaos; nothing in this chapter
# asks for it. The village deeds of "a life that counts" (hand-ins, protecting people) are chapter 0j.
# Inspiration: Life in the Village 3 (town-and-trade vanilla+ pack, a calm opening quest tab), vanilla's adventure/trade chain.
#
# Web: People of the Realm (chapter 0, `village`) -> this chapter; "A Known Face" and "A Fair Deal" (chapter 0) feed the purse and
# master-trader quests. "Friend of the Hamlet" is a capstone counted by "The Ledger" (chapter 0j).

[chapter]
key = "folk"
title = "Folk of the Realm"
subtitle = "Bells, trades and the people who live on the road."
icon = "minecraft:bell"
order = -5
life = 1
text = """
A village is the nearest thing a mortal has to a country. Learn who lives in it, give its people work and trade with
them fairly, and you will find a door that opens when you knock and a roof when it rains.
"""

[[quests]]
key = "ring_bell"
title = "Ring the Bell"
icon = "minecraft:bell"
deps = ["mortal_life/village"]
lane = 0
text = "Find the village bell and ring it once. A bell calls the villagers to shelter: use it for a good reason only."
lore = "The bell is the one voice a whole village obeys at the same moment."
karma = "Not scored directly: ringing it for a raid is just a warning, and the raid, if you bring it, is a Chaos deed."
tasks = [{ type = "stat", stat = "minecraft:bell_ring", value = 1, title = "Ring a bell" }]
rewards = [{ type = "item", item = "minecraft:bread", count = 4 }]

[[quests]]
key = "talk_around"
title = "Good Morning"
icon = "minecraft:villager_spawn_egg"
deps = ["ring_bell"]
lane = 0
text = "Talk to ten villagers: right-click, listen to the grunt, and look at what they will sell. Every trade begins as a greeting."
lore = "A villager will not say a word you can understand, but the cartographer has a way of saying it with real feeling."
karma = "Not scored directly: trades are Order, and a greeting is the road to one."
tasks = [{ type = "stat", stat = "minecraft:talked_to_villager", value = 10, title = "Talk to 10 villagers" }]
rewards = [{ type = "item", item = "minecraft:emerald", count = 2 }, { type = "xp", xp = 20 }]

[[quests]]
key = "give_work"
title = "A Trade for Everyone"
icon = "minecraft:composter"
deps = ["ring_bell"]
lane = 1
text = "Craft a composter, a lectern, a loom and a grindstone. An unemployed villager picks a job when it finds the right block: a farmer, a librarian, a shepherd, a toolsmith."
lore = "A village's whole wealth is the number of its hands that have something to do."
karma = "Order: a villager given work is a village that can trade (each trade adds +1)."
tasks = [
  { type = "item", item = "minecraft:composter" },
  { type = "item", item = "minecraft:lectern" },
  { type = "item", item = "minecraft:loom" },
  { type = "item", item = "minecraft:grindstone" },
]
rewards = [{ type = "item", item = "minecraft:emerald", count = 4 }, { type = "xp", xp = 30 }]

[[quests]]
key = "emerald_purse"
title = "A Heavy Purse"
icon = "minecraft:emerald"
deps = ["talk_around", "mortal_life/first_trade"]
lane = 0
text = "Hold thirty-two emeralds from your trades. Sell what you grow, mine or cook, and never take more than a fair price."
lore = "In the Realm a purse never fills by itself. It is filled by people who were glad to see you."
karma = "Order: each trade is +1, and the first twenty-five trades count the most."
tasks = [{ type = "item", item = "minecraft:emerald", count = 32 }]
rewards = [{ type = "item", item = "minecraft:emerald", count = 6 }, { type = "xp", xp = 40 }]

[[quests]]
key = "master_trader"
title = "Master Trader"
icon = "minecraft:emerald_block"
deps = ["emerald_purse", "mortal_life/regular_customer"]
lane = 0
text = "Trade with villagers a hundred times. Level a villager to expert and you will see what they keep for the best customers."
lore = "A hundred trades and every librarian in the district knows how you take your tea."
karma = "Order: 1 per trade; the curve flattens, but a hundred trades is a name the Realm remembers."
tasks = [{ type = "stat", stat = "minecraft:traded_with_villager", value = 100, title = "100 trades" }]
rewards = [{ type = "item", item = "minecraft:emerald_block" }, { type = "xp", xp = 60 }]

[[quests]]
key = "many_villages"
title = "Four Kinds of Hearth"
icon = "minecraft:red_sandstone"
deps = ["talk_around"]
lane = -1
optional = true
text = "Visit a desert, a savanna, a snowy and a taiga village. Each builds in what its land gives: sandstone, acacia, snow, spruce."
lore = "You can tell where a stranger is from by how they build, and what they put over the door."
karma = "Valor for the ground covered; Order for each village you trade in."
tasks = [
  { type = "structure", structure = "minecraft:village_desert" },
  { type = "structure", structure = "minecraft:village_savanna" },
  { type = "structure", structure = "minecraft:village_snowy" },
  { type = "structure", structure = "minecraft:village_taiga" },
]
rewards = [{ type = "item", item = "minecraft:emerald", count = 8 }, { type = "xp", xp = 80 }]

[[quests]]
key = "lightning_safe"
title = "Surge Protector"
icon = "minecraft:lightning_rod"
deps = ["give_work"]
lane = 2
optional = true
text = "Put a lightning rod over a villager's house and let a thunderstorm come: a struck villager turns into a witch, but a rod catches the bolt first."
lore = "Nobody in the village can say who put the rod up. They only say the storm has not hurt them since."
karma = "Faith for the advancement (+2), and Order: a protected village is a better one."
tasks = [{ type = "advancement", advancement = "minecraft:adventure/lightning_rod_with_villager_no_fire", title = "Surge Protector" }]
rewards = [{ type = "item", item = "minecraft:copper_ingot", count = 6 }, { type = "xp", xp = 40 }]

[[quests]]
key = "friend_of_hamlet"
title = "Friend of the Hamlet"
subtitle = "The villages milestone"
icon = "minecraft:white_banner"
deps = ["talk_around", "give_work", "master_trader"]
lane = 0
shape = "gear"
size = 1.5
text = """
They know your face, your prices and which door you knock on. You gave a village's people work and a village's
traders fair custom. Tick it off when you would be missed; The Ledger (chapter 0j) counts it as a way of life.
"""
lore = "On market days they save you a stool. The stool is the highest honour the Realm has."
karma = "Order: this is what the trade count in your life record is made of."
tasks = [{ type = "checkmark", title = "The village knows me" }]
rewards = [{ type = "item", item = "minecraft:cake" }, { type = "item", item = "minecraft:experience_bottle", count = 6 }]
