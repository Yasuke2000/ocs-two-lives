# Chapter 20 — The Notice Board (Life 2 side quests of the Free Guild in Blumund and Englassia). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md ("Side quests" for this chapter and its three siblings).
#
# Side content, never story: nothing here gates an act, rewards stay modest (coins, food, potions, XP) and never a skill, race
# or unique. Mechanics live in pack/kubejs/server_scripts/ttl/sidequests/ (data: design/data/sidequests.toml):
#   - a "Job:" quest is a checkmark whose claim runs `ttl sidequest start {p} <id>` (the story pattern of chapter 8);
#   - the quest after it is a stage task on ttl.quest.side.<id>, which the mechanic sets on success (escort arrived, parcel
#     handed over, culls counted, items handed in);
#   - a repeatable one also REMOVES that stage in an invisible reward, so the next run starts clean; the cooldown equals the
#     quest's repeat_hours in sidequests.toml, and the job is taken again with `/ttl sidequest take <id>` at its giver (or the
#     "Heard of any work?" button of an adventurer there);
#   - travel quests read the discovery stages ttl.quest.side.seen.<place> (given on arrival, no start needed).
# A failed or abandoned job can always be taken again at its giver. Kill and hand-in chores use FTB's own tasks.

[chapter]
key = "side_guild"
title = "The Notice Board"
subtitle = "Rank F to rank C: odd jobs of the Free Guild."
icon = "minecraft:writable_book"
order = 20
life = 2
text = """
Every reborn soul ends up at a guild counter sooner or later. The Free Guild takes anyone, pays in coin and asks no questions
about where you came from: register, start at rank F with the herbs and the slimes, and work your way up the notice board.

Jobs marked "Job:" are accepted with the claim button; the quest after them completes when the work is done. Lost the thread?
/ttl sidequest shows what you carry, and /ttl sidequest take <job> at the giver starts a job again.
"""

