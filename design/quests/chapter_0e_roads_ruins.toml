# Chapter 0e — The Long Road (Life 1: exploration, biomes and structures). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# Karma that really is scored: Valor 1 per 100 blocks of NEW ground entered on foot (distinct 64-block squares, daily cap, no boats or
# mounts; design/data/karma.toml [explore]) and Faith +2 for each advancement. The Mortal Realm uses the large-biomes noise
# preset, so biomes are about four times as wide as usual: the biome quests are real journeys and most structure quests that need
# a far biome are optional. Structure ids were checked against the 1.21.1 data (worldgen/structure and its tags).
# Inspiration: Better Minecraft-style exploration-first packs (a short guide, then "go and look"), vanilla's adventure/ advancement tree.
#
# Web: The First Night (chapter 0) -> this chapter. "Cartographer's Pride" is a capstone counted by "The Ledger" (chapter 0j). The structure hunts
# complement chapter 0's `wide_world` (four far biomes) and `illagers` (the outposts that hold pillagers).

[chapter]
key = "roads_ruins"
title = "The Long Road"
subtitle = "Biomes, ruins and what the old maps left out."
icon = "minecraft:filled_map"
order = -6
life = 1
text = """
The Mortal Realm is a large world made small by habit. Walk it. There are temples in the sand, huts in the swamp,
ships in the sea and old trails under the grass, and each is a day's story told by someone who is not coming back.
"""

[[quests]]
key = "long_walker"
title = "A Long Walker"
icon = "minecraft:leather_boots"
deps = ["mortal_life/first_night"]
lane = 0
text = "Walk five kilometres on foot. Boats and horses do not count here: the Realm teaches itself through your soles."
lore = "The pedlars say a road you have walked is a road that will let you back."
karma = "Valor: new ground entered on foot counts (1 per 100 blocks, within a daily cap)."
tasks = [{ type = "stat", stat = "minecraft:walk_one_cm", value = 500000, title = "Walk 5 km" }]
rewards = [{ type = "item", item = "minecraft:cooked_beef", count = 6 }, { type = "xp", xp = 20 }]

[[quests]]
key = "green_lands"
title = "The Green Lands"
icon = "minecraft:oak_sapling"
deps = ["long_walker"]
lane = 0
text = "Stand in a forest, a taiga and a swamp. In the large biomes they are far apart: plan the journey, pack food and mark your route."
lore = "The three greens of the Realm have never agreed on what the weather ought to be."
karma = "Valor for the ground covered, Faith for any advancement on the way."
tasks = [
  { type = "biome", biome = "minecraft:forest" },
  { type = "biome", biome = "minecraft:taiga" },
  { type = "biome", biome = "minecraft:swamp" },
]
rewards = [{ type = "item", item = "minecraft:oak_sapling", count = 4 }, { type = "item", item = "minecraft:spruce_sapling", count = 4 }]

[[quests]]
key = "coast"
title = "Salt and Sand"
icon = "minecraft:sea_pickle"
deps = ["long_walker"]
lane = -1
text = "Stand on a beach and in the open ocean. Salt air, kelp and a very long way to anywhere else."
lore = "Fishers hold that the sea has a memory and a temper and that only one of the two can be bargained with."
karma = "Valor for the ground covered."
tasks = [
  { type = "biome", biome = "minecraft:beach" },
  { type = "biome", biome = "minecraft:ocean" },
]
rewards = [{ type = "item", item = "minecraft:cooked_cod", count = 6 }, { type = "item", item = "minecraft:kelp", count = 8 }]

[[quests]]
key = "ruined_portal"
title = "A Gate Nobody Lit"
icon = "minecraft:crying_obsidian"
deps = ["long_walker"]
lane = 1
text = "Find a ruined portal: a broken frame of obsidian with a chest nearby. Someone started a journey here and did not finish it."
lore = "The villagers do not go near them. They say a half-opened door lets in more than the draught."
karma = "Valor for the ground covered."
tasks = [{ type = "structure", structure = "#minecraft:ruined_portal" }]
rewards = [{ type = "item", item = "minecraft:flint_and_steel" }, { type = "item", item = "minecraft:gold_nugget", count = 12 }]

[[quests]]
key = "high_country"
title = "The High Country"
icon = "minecraft:snow_block"
deps = ["green_lands"]
lane = 0
text = "Stand in a meadow, on a windswept hill and on a snowy slope. Up here the wind carries the bells of faraway flocks."
lore = "Shepherds of the high country do not speak much. The wind does it for them."
karma = "Valor for the ground covered."
tasks = [
  { type = "biome", biome = "minecraft:meadow" },
  { type = "biome", biome = "minecraft:windswept_hills" },
  { type = "biome", biome = "minecraft:snowy_slopes" },
]
rewards = [{ type = "item", item = "minecraft:leather_boots" }, { type = "item", item = "minecraft:cooked_mutton", count = 6 }]

[[quests]]
key = "ancient_temples"
title = "Temples in the Sand"
icon = "minecraft:sandstone"
deps = ["green_lands"]
lane = 1
optional = true
text = "Find a desert pyramid and a jungle temple. Tread carefully: both hold treasure and both hold a trap for those who forget to look down."
lore = "Neither was built for pilgrims. Both were built so that someone, once, would not have to be found."
karma = "Valor for the ground covered; Faith for any advancement."
tasks = [
  { type = "structure", structure = "minecraft:desert_pyramid" },
  { type = "structure", structure = "minecraft:jungle_pyramid" },
]
rewards = [{ type = "item", item = "minecraft:emerald", count = 4 }, { type = "xp", xp = 60 }]

[[quests]]
key = "witch_and_ice"
title = "Witches and Igloos"
icon = "minecraft:snow_block"
deps = ["green_lands"]
lane = 2
optional = true
text = "Find a swamp hut and an igloo. One belongs to a witch, one to nobody. The igloo's cellar has a stair behind the bed."
lore = "A swamp witch only asks that you wipe your boots. It is the people who do not who find out why."
karma = "Valor for the ground covered; kills of a witch count as a new kind of foe (+4 Valor)."
tasks = [
  { type = "structure", structure = "minecraft:swamp_hut" },
  { type = "structure", structure = "minecraft:igloo" },
]
rewards = [{ type = "item", item = "minecraft:golden_apple" }, { type = "xp", xp = 50 }]

[[quests]]
key = "old_trails"
title = "Trails Under the Grass"
icon = "minecraft:brush"
deps = ["green_lands"]
lane = 3
text = "Find a trail ruin: broken walls half-buried in the earth, with cracked clay and mud bricks. Dig carefully and bring a brush."
lore = "Whoever walked these trails left their pottery behind. Fifty generations on, someone is still sweeping it."
karma = "Valor for the ground covered."
tasks = [{ type = "structure", structure = "minecraft:trail_ruins" }]
rewards = [{ type = "item", item = "minecraft:brush" }, { type = "item", item = "minecraft:clay_ball", count = 8 }]

[[quests]]
key = "wrecks_and_ruins"
title = "Wrecks and Ruins"
icon = "minecraft:prismarine_bricks"
deps = ["coast"]
lane = -1
text = "Find a shipwreck and an underwater ruin. Bring a boat, water breathing if you can, and a bucket to clear the sand."
lore = "Some wrecks are older than any harbour. The sea rarely gives a reason, only a chest."
karma = "Valor for the ground covered, Faith for any advancement."
tasks = [
  { type = "structure", structure = "#minecraft:shipwreck" },
  { type = "structure", structure = "#minecraft:ocean_ruin" },
]
rewards = [{ type = "item", item = "minecraft:iron_ingot", count = 6 }, { type = "xp", xp = 50 }]

[[quests]]
key = "buried_treasure"
title = "X Marks the Sand"
icon = "minecraft:heart_of_the_sea"
deps = ["wrecks_and_ruins"]
lane = -1
optional = true
text = "Dig up buried treasure. A map from a shipwreck or ruin shows the spot; the chest holds a Heart of the Sea."
lore = "They always bury it above the tide line. They always forget the tide moves."
karma = "Valor and a little Faith: it is a journey and a find."
tasks = [
  { type = "structure", structure = "minecraft:buried_treasure" },
  { type = "item", item = "minecraft:heart_of_the_sea" },
]
rewards = [{ type = "item", item = "minecraft:diamond" }, { type = "item", item = "minecraft:emerald", count = 6 }]

[[quests]]
key = "outpost"
title = "A Tower in the Wilds"
icon = "minecraft:crossbow"
deps = ["high_country"]
lane = 0
text = "Find a pillager outpost. Scout it from a distance, clear it from the dark and take what the chest in the top holds."
lore = "No village sends envoys to an outpost. The envoys have simply stopped coming back."
karma = "Valor: pillagers are a new kind of foe (+4). Do not carry Bad Omen to a village: the raid that follows counts as a dark deed."
tasks = [{ type = "structure", structure = "minecraft:pillager_outpost" }]
rewards = [{ type = "item", item = "minecraft:crossbow" }, { type = "item", item = "minecraft:arrow", count = 16 }]

[[quests]]
key = "mansion"
title = "The Woodland Mansion"
icon = "minecraft:totem_of_undying"
deps = ["outpost"]
lane = 1
optional = true
text = "Find a woodland mansion deep in a dark forest. It is the deadliest building in the Realm and holds a Totem of Undying for those who return."
lore = "Nobody remembers who lived there. The ones who have gone in say the rooms are still being kept tidy."
karma = "Valor for the distance, and minor bosses: evokers and vindicators are foes (+4 / +10)."
tasks = [{ type = "structure", structure = "minecraft:mansion" }]
rewards = [{ type = "item", item = "minecraft:experience_bottle", count = 8 }, { type = "xp", xp = 100 }]

[[quests]]
key = "cartographers_pride"
title = "Cartographer's Pride"
subtitle = "The exploration milestone"
icon = "minecraft:map"
deps = ["high_country", "wrecks_and_ruins", "outpost", "old_trails", "ruined_portal", "mortal_life/wide_world"]
min_deps = 5
lane = 0
shape = "gear"
size = 1.5
text = """
Hills, coast, wreck, trail, tower and a broken gate. You have walked a good part of the Realm. Tick it off when you can name
every place you have been; The Ledger (chapter 0j) counts it as a way of life.
"""
lore = "The map-seller at the crossroads says the best map is the one you could draw from memory with your eyes shut."
karma = "Valor: ground explored is scored by the squares you entered, not by this milestone."
tasks = [{ type = "checkmark", title = "I have walked the Realm" }]
rewards = [{ type = "item", item = "minecraft:compass" }, { type = "item", item = "minecraft:cooked_salmon", count = 8 }, { type = "xp", xp = 80 }]
