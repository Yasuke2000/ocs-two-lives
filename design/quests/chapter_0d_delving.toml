# Chapter 0d — Down the Shaft (Life 1: mining and the depths). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# Depth cannot be read by the book (no Y-level task), so the quests ask for what only the depths give: copper, gold, red dust,
# deepslate, an amethyst geode, a lava bucket. Karma that really is scored: Craft for diamond ores (2) and ancient debris (5)
# (chapter 0), advancements (Faith, +2); the rest keeps you alive.
# Inspiration: Vault Hunters' preparation checklists (gear, water bucket, torches before you go down), vanilla's own advancement tree
# (adventure/ and story/ for the lava bucket and obsidian), RLCraft's "clear the cave before you light it" caution.
#
# Web: Wood and Stone (chapter 0, stone_age) -> this chapter; the middle of it waits for Iron Age. The milestone "Deep Delver" is a capstone
# counted by "The Ledger" (chapter 0j). Obsidian here is what chapter 0's Mortal Nether (the portal) needs.

[chapter]
key = "delving"
title = "Down the Shaft"
subtitle = "Coal, copper, gold and the dark under the dark."
icon = "minecraft:iron_pickaxe"
order = -7
life = 1
text = """
What the surface will not give you, the ground will. Go down in steps, light every turn, listen for water and for
the click of a skeleton's bow, and never dig straight down. The dark is patient; you do not have to be.
"""

[[quests]]
key = "coal_seam"
title = "Black Gold"
icon = "minecraft:coal"
deps = ["mortal_life/stone_age"]
lane = 0
text = "Mine twenty-four coal. It burns hotter than wood and lights a longer road than charcoal."
lore = "The old miners called the first seam a promise, and the second one a bill."
karma = "Not scored directly."
tasks = [{ type = "item", item = "minecraft:coal", count = 24 }]
rewards = [{ type = "item", item = "minecraft:torch", count = 16 }]

[[quests]]
key = "copper_find"
title = "Green Metal"
icon = "minecraft:copper_ingot"
deps = ["coal_seam"]
lane = 0
text = "Smelt eight copper ingots. It is soft and bright and turns green, but it makes spyglasses, lightning rods and good roofs."
lore = "The coppersmiths of the Realm say the metal remembers every rain that ever fell on it."
karma = "Not scored directly."
tasks = [{ type = "item", item = "minecraft:copper_ingot", count = 8 }]
rewards = [{ type = "item", item = "minecraft:lightning_rod" }, { type = "xp", xp = 20 }]

[[quests]]
key = "old_shafts"
title = "Old Shafts"
icon = "minecraft:rail"
deps = ["coal_seam"]
lane = -1
text = "Find an abandoned mineshaft: rotten timbers, cobwebs and chests nobody came back for. Carry torches and do not mind the spiders."
lore = "Nobody remembers who dug the old shafts. The oldest miner in Wayfarer's Rest says they were there when the Realm was made, and so was he."
karma = "Valor for the distance travelled to find one."
tasks = [{ type = "structure", structure = "#minecraft:mineshaft" }]
rewards = [{ type = "item", item = "minecraft:rail", count = 16 }]

[[quests]]
key = "iron_hoard"
title = "An Iron Hoard"
icon = "minecraft:iron_ingot"
deps = ["copper_find", "mortal_life/iron_age"]
lane = 0
text = "Smelt thirty-two iron ingots. Buckets, rails, shields, armour and anvils all take their share."
lore = "A smith never counts his iron; he counts what is missing."
karma = "Craft grows with the work behind it, not the ingots themselves."
tasks = [{ type = "item", item = "minecraft:iron_ingot", count = 32 }]
rewards = [{ type = "item", item = "minecraft:coal", count = 8 }, { type = "xp", xp = 30 }]

[[quests]]
key = "rail_line"
title = "Pit Ponies"
icon = "minecraft:minecart"
deps = ["old_shafts", "iron_hoard"]
lane = -1
text = "Craft a minecart and lay thirty-two rails. A cart on a line carries ten times what a back can, down a shaft and up again."
lore = "They used ponies once. The ponies preferred the sun, and so did everyone else."
karma = "Not scored directly."
tasks = [
  { type = "item", item = "minecraft:minecart" },
  { type = "item", item = "minecraft:rail", count = 32 },
]
rewards = [{ type = "item", item = "minecraft:powered_rail", count = 4 }, { type = "item", item = "minecraft:redstone", count = 8 }]

[[quests]]
key = "gold_streak"
title = "A Glint of Gold"
icon = "minecraft:gold_ingot"
deps = ["iron_hoard"]
lane = 0
text = "Smelt six gold ingots. Gold is soft and useless in a tool, but the Nether and its piglins will want it."
lore = "Gold is the only metal the Realm values more for being useless."
karma = "Not scored directly."
tasks = [{ type = "item", item = "minecraft:gold_ingot", count = 6 }]
rewards = [{ type = "item", item = "minecraft:golden_carrot", count = 4 }]

[[quests]]
