karma = "Faith for the advancement (+2)."
tasks = [{ type = "advancement", advancement = "minecraft:story/lava_bucket", title = "Hot Stuff" }]
rewards = [{ type = "item", item = "minecraft:water_bucket" }, { type = "xp", xp = 30 }]

[[quests]]
