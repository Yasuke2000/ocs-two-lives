title = "Red and Blue"
icon = "minecraft:redstone"
deps = ["gold_streak"]
lane = 0
text = "Gather thirty-two redstone dust and sixteen lapis lazuli from the deep. One drives clocks and doors, the other feeds enchanting tables."
lore = "A miner who comes back with red under his nails has been somewhere the sun does not shine."
karma = "Faith: lapis feeds every enchantment, and each one adds Faith."
tasks = [
  { type = "item", item = "minecraft:redstone", count = 32 },
  { type = "item", item = "minecraft:lapis_lazuli", count = 16 },
]
rewards = [{ type = "item", item = "minecraft:experience_bottle", count = 4 }]

[[quests]]
key = "deepslate_depths"
title = "Where the Stone Goes Dark"
icon = "minecraft:cobbled_deepslate"
deps = ["redstone_dust"]
lane = 0
text = "Mine thirty-two cobbled deepslate. Below this line the stone turns grey and hard, and the diamonds start to show."
lore = "The deepslate has no name in the oldest songs. It is what the Realm is made of when it is not trying to be pretty."
karma = "Craft: diamonds mined down here count as much as shallow ones (2 each)."
tasks = [{ type = "item", item = "minecraft:cobbled_deepslate", count = 32 }]
rewards = [{ type = "item", item = "minecraft:cooked_beef", count = 6 }, { type = "xp", xp = 40 }]

[[quests]]
key = "geode"
title = "A Crystal Cave"
icon = "minecraft:amethyst_shard"
deps = ["deepslate_depths"]
lane = 1
text = "Crack open an amethyst geode and take eight shards. Do not let it ring: the crystals chime when anyone steps near."
lore = "Amethyst does not shine so much as hum, in a pitch only a trained miner can hear."
karma = "Not scored directly."
tasks = [{ type = "item", item = "minecraft:amethyst_shard", count = 8 }]
rewards = [{ type = "item", item = "minecraft:amethyst_block", count = 4 }]

[[quests]]
