title = "The Far-Seer"
icon = "minecraft:spyglass"
deps = ["geode", "copper_find"]
lane = 1
text = "Craft a spyglass from two copper ingots and an amethyst shard. Use it to read distant villages, ships and ruins before you walk into them."
lore = "A scout's first lesson: if you can see them with the glass, they cannot yet see you."
karma = "Not scored directly: but a map of what lies ahead means a longer life."
tasks = [{ type = "item", item = "minecraft:spyglass" }]
rewards = [{ type = "item", item = "minecraft:cooked_cod", count = 6 }, { type = "xp", xp = 30 }]

[[quests]]
