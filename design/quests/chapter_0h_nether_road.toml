  { type = "item", item = "minecraft:golden_helmet" },
  { type = "advancement", advancement = "minecraft:nether/distract_piglin", title = "Oh Shiny" },
]
rewards = [{ type = "item", item = "minecraft:ender_pearl", count = 2 }, { type = "xp", xp = 40 }]

