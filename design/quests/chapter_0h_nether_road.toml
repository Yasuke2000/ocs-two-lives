lore = "The deltas are the one place in the Nether where the scenery looks as if it was designed to kill you."
karma = "Valor for the walking."
tasks = [
  { type = "biome", biome = "minecraft:basalt_deltas" },
  { type = "item", item = "minecraft:basalt", count = 16 },
]
