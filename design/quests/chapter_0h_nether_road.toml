# Chapter 0h — Beneath the Burning Sky (Life 1: the Mortal Nether). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# The Mortal Nether (`ttl:mortal_nether`) uses the vanilla `minecraft:nether` noise settings with the vanilla Nether multi-noise biome
# preset (pack/kubejs/data/ttl/dimension/mortal_nether.json), so every vanilla Nether structure and biome generates in it. The vanilla
# advancements that test a dimension (story/enter_the_nether) never fire there; this chapter only uses biome, structure, item, kill and
# advancements that fire anywhere (nether/distract_piglin and nether/ride_strider, which test an item and a mount). There is no respawn
# in the Mortal Realm, so no respawn-anchor or bed quests.
# Karma that is really scored: Valor +20 once for walking the Mortal Nether, +4 per new kind of foe slain (hoglin, piglin, zombified
# piglin are new kinds), +5 Craft per ancient debris, Faith +2 per advancement.
# Inspiration: Vault Hunters' preparation checklists (a calm "what to carry" before the hard place), vanilla's nether/ advancement tree.
#
# Web: chapter 0's `mortal_nether` (the portal) -> this chapter, hidden until then. "Hellwalker" is a capstone counted by "The Ledger" (0j)
# and the road on to "The Dragon's Eve" (0i).

[chapter]
key = "nether_road"
title = "Beneath the Burning Sky"
subtitle = "The Mortal Nether: forests of fungus, bastions and everything that wants your gold."
icon = "minecraft:crimson_nylium"
order = -3
life = 1
hide_until_deps_complete = true
text = """
The Mortal Nether is a place for this life only, and it does not mind that. Bridge every gap, keep a stack of
cobblestone, never mine the block you are standing on, and carry something fireproof. The Realm below the Realm is
not an enemy; it is only indifferent, and that is worse.
"""

[[quests]]
key = "first_footing"
title = "The Netherrack Road"
icon = "minecraft:netherrack"
deps = ["mortal_life/mortal_nether"]
lane = 0
text = "Mine thirty-two netherrack and lay a short road away from your portal. Never walk blind: the floor here ends in lava as often as in rock."
lore = "The first road in the Nether was laid by someone who did not come back. The second by someone who followed their footprints."
karma = "Valor: the Mortal Nether adds +20 once for walking in it."
tasks = [{ type = "item", item = "minecraft:netherrack", count = 32 }]
rewards = [{ type = "item", item = "minecraft:cooked_porkchop", count = 6 }, { type = "xp", xp = 25 }]

[[quests]]
key = "fungal_forests"
title = "Forests of Fungus"
icon = "minecraft:warped_fungus"
deps = ["first_footing"]
lane = -1
text = "Stand in a crimson forest and a warped forest. Huge fungus for trees, red or blue; one is full of hoglins, the other of endermen."
lore = "The Nether's forests grow from fire and shadow and still manage to look gentle in the dark."
karma = "Valor for the walking; Faith for any advancement on the way."
tasks = [
  { type = "biome", biome = "minecraft:crimson_forest" },
  { type = "biome", biome = "minecraft:warped_forest" },
]
rewards = [{ type = "item", item = "minecraft:warped_fungus", count = 2 }, { type = "item", item = "minecraft:crimson_fungus", count = 2 }]

[[quests]]
key = "soul_valley"
title = "The Valley of Souls"
icon = "minecraft:soul_sand"
deps = ["first_footing"]
lane = 0
text = "Cross a soul sand valley and bring back sixteen blocks of soul sand. It slows your feet and whispers; the skeletons here are the worst."
lore = "The valley's sand is said to hold the last breath of everyone who ever lost a fight here. It does not bother to say which fight."
karma = "Valor for the walking."
tasks = [
  { type = "biome", biome = "minecraft:soul_sand_valley" },
  { type = "item", item = "minecraft:soul_sand", count = 16 },
]
rewards = [{ type = "item", item = "minecraft:bone", count = 8 }, { type = "xp", xp = 30 }]

