You wake at Wayfarer's Rest, a human like any other. There is no respawn in this realm:
the first death ends this life, and your soul moves on to the Spirit Corridor.
Nothing you carry survives that crossing. What survives is what you did.
"""
karma = "Every deed in this book feeds one of six karma axes: Valor, Order, Craft, Faith, Longevity, and the dark one, Chaos. Ask the Voice with /ttl guide."
tasks = [{ type = "stage", stage = "ttl.life1" }]
rewards = [{ type = "item", item = "minecraft:bread", count = 4 }]

