# Chapter 0 — A Mortal Life (Life 1, the Mortal Realm). Generated into FTB Quests by tools/gen_quests.py.
# Format and rules: design/quests.md. Edit, then `python tools/gen_quests.py` and commit the generated files.
#
# Life 1 has NO Tensura content: only minecraft: items in tasks and rewards (the generator refuses others),
# rewards stay modest (food, torches, a few useful items, XP). Every quest says in `karma` how the deed
# counts for the next life (design/data/karma.toml is the source of truth; keep these lines in step with it).
# Vanilla advancements that test a dimension (enter_the_nether, enter_the_end) never fire in ttl:mortal_*;
# use `dimension` tasks for those. Structure, kill, item, stat and most advancements work everywhere.
#
# The Life 1 web (design/quests.md "The web"): this chapter is the spine. Ten chapters hang off it (first_days, homestead, fields,
# delving, roads_ruins, folk, arts, nether_road, end_road, a_life_that_counts: files chapter_0a ... chapter_0j). They sit at orders
# -10..-1 and this chapter at -11, so the whole of Life 1 comes before the Life 2 chapters without renumbering them.
#
# Layout: generated (tools/quest_layout.py, design/quests.md "Layout"); the `lane`/`col` lines below are the old hand layout
# and are ignored. `pin = [x, y]` fixes one quest's spot.

[chapter]
key = "mortal_life"
title = "A Mortal Life"
subtitle = "You only live once here. What you do decides who you become."
icon = "minecraft:clock"
order = -11
life = 1
text = """
Every player lives twice. This is the first life: a plain human in the Mortal Realm.
When you die, the Voice of the World judges what you did. Your karma decides which races
and skills are offered to your soul in the Tensura world.
"""

# ---- Main line: from the first night to the Mortal End --------------------------------------------------

[[quests]]
key = "only_once"
