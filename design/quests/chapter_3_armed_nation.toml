# Chapter 3 — The Armed Nation (Life 2: the road to Dwargon and the dwarf kingdom). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md.
#
# Rewards stay modest and NEVER grant skills, races or awakenings (design/manas-integration.md §5(d)).
# Places inside the city are real positions from blueprints/dwargon.py. life/dwargon.js pastes the build so the
# arrival point in front of the gate, blueprint (74, 120), is the `dwargon` anchor of design/data/anchors.toml (the gate:
# x = dwargon.x + bx - 74, z = dwargon.z + bz - 120). Every location task of this chapter is `at = { anchor = "dwargon", dx, dz }`
# with the offsets below (the city lies at negative dz: north, up the slope into the Canaat):
#   checkpoint arch z160 -> dz +40        queue lanes and guard booths z114-125 -> dz -6..+5
#   gate wall front z107 -> dz -13        tunnel z94-106 -> dz -26..-14
#   south street z68-94 -> dz -52..-26    plaza centre (74, 54) r17 -> (0, -66)
#   forge hall (52, 54) -> (-22, -66)     engineers' workshop (96, 54) -> (+22, -66)
#   forge street z34-43 -> dz -86..-77    Kaijin's smithy x58-66 z34-38 -> (-12, -84), anvil (-10, -85)
#   royal terrace front z29 -> dz -91     throne room x49-99 z0-26 -> dx -25..+25, dz -120..-94; throne seat (0, -109)
# The dwarf village on the road (landmarks.toml `dwarf_village`, reach 116) is placed on the flattest of ~16 nearby
# spots (up to 64 blocks away), so its location task uses a big radius (150): the real centre is not known in advance.
# King Gazel in the throne room is a seated NoAI, invulnerable NPC (life/dwargon.js): the audience is a location
# task, not a fight. The book cannot detect talking to anyone, so every "meet" is a location or advancement check.
# Skill checks use abilities the dwarf traders actually sell: Tensura's tags
# `manascore_skill/skills/low_manual_dwarf_trade` (aura_sword, instant_move, violent_break) and
# `low_basic_tome_dwarf_trade` (wind_gust, wind_cutter, earth_wall, ...).

[chapter]
key = "armed_nation"
title = "The Armed Nation"
subtitle = "Dwargon: a kingdom of smiths behind a white gate."
icon = "minecraft:iron_pickaxe"
order = 4
life = 2
hide_until_deps_complete = true
text = """
About ${dist:tempest>dwargon} blocks ${dir:tempest>dwargon} of Tempest, cut into the southern face of the Great Canaat Mountains, lies the dwarf kingdom of Dwargon:
a neutral trade hub inside a cavern, ruled for three hundred years by the Hero King Gazel Dwargo. It is where
Kaijin was judged, and where every smith in the world wants to work.
"""

