A besieged people eat first and fight second. The lizardmen have fish but little else; Rimuru sent supplies.
Hand in 24 cooked cod and 16 bread to their storehouse.
"""
tasks = [
  { type = "item", item = "minecraft:cooked_cod", count = 24, consume = true },
  { type = "item", item = "minecraft:bread", count = 16, consume = true },
]
rewards = [{ type = "item", item = "tensura:silver_coin", count = 1 }, { type = "xp", xp = 50 }]

