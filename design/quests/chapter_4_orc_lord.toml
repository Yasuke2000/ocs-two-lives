# Chapter 4 — The Orc Lord (Life 2: Lake Siss, the lizardmen and the orc war). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md.
#
# Rewards stay modest and NEVER grant skills, races or awakenings (design/manas-integration.md §5(d)).
# Places are the landmarks placed by life/landmarks.js (design/data/landmarks.toml, 14,000-block world):
#   Lake Siss (888, 202)                      canon_regions.json landmark (world = (ref - origin) * 14000 / 2570)
#   lizardmen's stilt village (700, 344)      reach 48, "water" surface   -> radius 110
#   lizardmen's caverns (926, 398)            reach 56                    -> radius 120
#   orc camp / Orc War battlefield (1106, 539) reach 40                   -> radius 100 (camp), 134 (battlefield, as chapter 1)
#   burned Kijin village ruin (1460, -959)    reach 24, canon position unverified -> radius 90
# `/place structure` puts each landmark on the flattest of ~16 nearby spots (up to 64 blocks from the nominal
# position), so every radius adds that slack to the structure's reach.
# Detectable tasks only: entity kills with ids from the Tensura jar (`tensura:orc`, `tensura:orc_lord`) and the
# Tensura advancement `tensura:eat_or_be_eaten` ("Defeat an Orc Disaster"). The orc camp structure has an orc lord
# spawn piece (landmarks.toml), but whether one is alive when a player arrives depends on world state: the finale
# quest says so. No tame/ally/"alliance" state exists to read, so the alliance quest is a checkmark with honest text.
# Hand-ins (`consume = true`) are submitted in the quest screen and use the items up.

[chapter]
key = "orc_lord"
title = "The Orc Lord"
subtitle = "Two hundred thousand orcs are marching on the lake."
icon = "minecraft:iron_axe"
order = 4
life = 2
hide_until_deps_complete = true
text = """
In the story the Orc Lord Geld, driven by hunger, led a horde out of the south towards the Great Jura Forest. The
lizardmen of Lake Siss met it first and asked the new monster town for help. This is the chapter where Tempest
stops being a camp and becomes a power.
"""

[[quests]]
key = "envoy"
title = "The Stilt Village"
subtitle = "Gabiru's envoy"
icon = "minecraft:mangrove_roots"
lane = 0
col = 0
shape = "gear"
size = 1.5
text = """
The lizardmen live on the shores of Lake Siss in a village on stilts, and fish the lake. Their chief's son Gabiru came to
Tempest with an envoy: the orc horde is coming and the marsh cannot hold. Travel east to the stilt village.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = [700, 344], radius = 110, title = "The lizardmen's stilt village" }]
rewards = [{ type = "item", item = "minecraft:cooked_cod", count = 8 }, { type = "xp", xp = 50 }]

[[quests]]
