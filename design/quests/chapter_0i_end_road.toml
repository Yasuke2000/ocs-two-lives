# Chapter 0i — The Dragon's Eve (Life 1: preparing for the Mortal Dragon, and what lies beyond it). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# The preparation quests ask for the things a Mortal End fight really needs (golden apples, a water bucket and a carved pumpkin against
# endermen, arrows, blocks to pillar with, a full set of diamond armour). They are NOT dependencies of chapter 0's `mortal_end` or `dragon`:
# FTB Quests only advances a task while its quest's dependencies are done, so a quest the dragon kill hangs behind would stop the kill from
# counting. The chapter is a checklist the player may follow; the capstone "The Dragon's Eve" is a milestone that leads on to the rest.
# The vanilla advancements that test a dimension (story/enter_the_end, end/root) never fire in `ttl:mortal_end`; this chapter uses
# item, structure and advancements that fire anywhere (end/enter_end_gateway, end/dragon_breath). The post-dragon quests assume the
# Mortal End has the vanilla outer islands and gateways (ttl-portals only replaces the fight's save, not the terrain): verify in game.
# Karma that is really scored: Valor +120 and a great foe for the dragon, +30 once for reaching the Mortal End, Faith +2 per advancement.
# Inspiration: Vault Hunters' "your first vault" checklist (water bucket, iron gear before diamond, a shulker for the loot).
#
# Web: Eyes of Ender (chapter 0) -> this chapter, hidden until then; after "The Dragon's Eve" and the Mortal Dragon the road goes on through
# the End's gateways. "The Dragon's Eve" is a capstone counted by "The Ledger" (chapter 0j).

[chapter]
key = "end_road"
title = "The Dragon's Eve"
subtitle = "Preparing for the Mortal Dragon, and for what is left after it."
icon = "minecraft:end_crystal"
order = -2
life = 1
hide_until_deps_complete = true
text = """
Nobody comes back from the Mortal End by being brave alone. Come with gold apples, a water bucket for the endermen, a stack of
blocks to build with and armour you trust. Then go in, and leave your doubts at the portal. After it, the island still has
secrets for those who survive.
"""

[[quests]]
key = "apples_of_gold"
title = "Apples of Gold"
icon = "minecraft:golden_apple"
deps = ["mortal_life/eyes_of_ender"]
lane = 0
text = "Carry three golden apples: eight gold ingots each, and a wound that would have ended you becomes a long afternoon."
lore = "The old rule of the Realm: bring more food than you plan to eat, and more courage than you plan to need."
karma = "Not scored directly."
tasks = [{ type = "item", item = "minecraft:golden_apple", count = 3 }]
rewards = [{ type = "item", item = "minecraft:cooked_beef", count = 8 }, { type = "xp", xp = 30 }]

