title = "The Pumpkin and the Pail"
icon = "minecraft:carved_pumpkin"
deps = ["apples_of_gold"]
lane = -1
text = "Craft a carved pumpkin and fill a water bucket. Wear the pumpkin and endermen will ignore your face; stand in the water and they cannot reach you."
lore = "The hunters' oldest trick is also the silliest-looking, and it has kept more of them alive than any sword."
karma = "Not scored directly."
tasks = [
  { type = "item", item = "minecraft:carved_pumpkin" },
  { type = "item", item = "minecraft:water_bucket" },
]
rewards = [{ type = "item", item = "minecraft:pumpkin_pie", count = 4 }]

