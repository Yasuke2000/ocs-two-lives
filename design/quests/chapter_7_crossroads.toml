# Chapter 7 — Crossroads (Life 2, Act I of the story: the Oath). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (Story extensions: `path`, `stage`/`command` rewards, cross-chapter `deps`, `min_deps`).
# Design: design/architecture/story-characters.md §2 (Act I), §3.1 (the Oath), §7 (WP-S6).
#
# Shape: one shared spine quest ("Crossroads") whose reward opens the Oath menu (`ttl story oath`), then a LIGHT lane
# ("Rigurd's Trust", `path = "light"`, above) and a DARK lane ("The Outcast's Mark", `path = "dark"`, below) of the same
# size (4 quests each, rewards of the same weight), joined by "The Forest Awakens" (`min_deps = 1`: one lane is enough).
# A lane quest stays invisible until the path stage is held (generator: `path`), so a dark soul never sees the light lane.
# The Oath itself (path stage, rep deltas, Act I) is done by `ttl story oath` (story/story.js); this file never sets a path.
# An optional side pair at the Sealed Cave starts the Supermassive Slime fight; fights are path-free (owner request).
#
# Rewards stay modest (food, a little XP, bronze/silver coins) and NEVER grant skills, races, evolutions or uniques
# (design/manas-integration.md §5(d)). Reputation comes only from the Oath (design/data/story.toml [oath.*]) and the act deltas.
#
# Places (Tempest: blueprint (45, 57) = the `tempest` anchor, blueprints/tempest.py, see chapter 2; offsets are dx, dz from it):
#   south gate (palisade) (0, 23)          Rigurd's chief hut (22, -39)       goblins' campfire (22, -30)
#   Old goblin village landmark `goblin_village` radius 64 (as chapter 1)      Sealed Cave build `sealed_cave` radius 150 (as chapter 1)
#   Outcast contact: the road fork 30 blocks south of the gate, (0, 52). OUR CHOICE (the architecture doc names the contact
#   but no spot): WP-S4 should stand the `outcast_contact` NPC there, and the radius (14) tolerates a few blocks of drift.
# Our interpretation (not canon): the Outcast Society (an original faction of rejected reincarnators, master plan D7), the
# Orc Horde's envoy before the Orc War, the Supermassive Slime as Veldora's leftover magicule beast.

[chapter]
key = "crossroads"
title = "Crossroads"
subtitle = "Tempest stands. Now say where you stand."
icon = "minecraft:lantern"
order = 3
life = 2
hide_until_deps_complete = true
text = """
The town has walls on one side, a forge, a council and a name that is starting to travel. Everything that grows in
the forest has to decide whom it welcomes and what it owes. The goblins call the answer an Oath. The road south of the
gate splits in two, one lamp-lit towards Tempest's friends, one dark towards the people nobody else will take in.
"""

# ---- The Oath (shared spine) ----------------------------------------------------------------------------

[[quests]]
key = "crossroads"
title = "Crossroads"
subtitle = "Swear the Oath"
icon = "minecraft:lantern"
deps = ["tempest_rises/tempest_stands"]
lane = 0
col = 0
shape = "gear"
size = 1.5
text = """
In the story it began with a name: Rimuru named the goblins and the direwolves, and the naming bound giver and
given alike (anime season 1, episodes 2-3). Tempest keeps that idea. Words said at the south gate stay said.

Stand at the fork south of the gate, then claim the reward: it opens the Oath menu (the same menu opens if you talk to
Rigurd, or type /ttl story oath). Two roads: the light one, with Rigurd's folk, or the dark one, with the Outcasts and
the Orc Horde. In a party the leader swears and the whole party is bound with them. The choice is not undone by wishing:
only a later Atonement or Corruption can turn you, once.

&6Why it matters:&r the light Oath gives Tempest +20; the dark Oath gives Outcast Society +20 and Orc Horde +15 and costs
Tempest 20. Both lanes below are full quest lines of the same size.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = { anchor = "tempest", dx = 0, dz = 23 }, radius = 12, title = "The crossroads at the south gate" }]
rewards = [
  { type = "command", command = "ttl story oath", feedback = "The crossroads waits. Choose your Oath." },
  { type = "item", item = "tensura:bronze_coin", count = 2 },
  { type = "xp", xp = 40 },
]

# ---- Light lane: Rigurd's Trust ------------------------------------------------------------------------

[[quests]]
key = "rigurd_trust"
title = "Rigurd's Trust"
subtitle = "The light road"
icon = "tensura:goblin_club"
deps = ["crossroads"]
path = "light"
lane = -1
col = 1
text = """
Rigurd led the goblins through the direwolf years and still lives in the old chief's hut, north-east of the green. In the
story he is the one who says what Tempest needs and keeps his word to the end. A goblin's trust is a seat at his fire.

Stand at his door: the Oath is only words until someone sees you keep it.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = { anchor = "tempest", dx = 22, dz = -39 }, radius = 8, title = "Rigurd's chief hut" }]
rewards = [{ type = "item", item = "minecraft:bread", count = 6 }, { type = "item", item = "tensura:bronze_coin", count = 3 }, { type = "xp", xp = 50 }]

[[quests]]
key = "gobta_boast"
title = "Gobta's Great Boast"
subtitle = "Strongest goblin in the forest"
icon = "tensura:horned_rabbit_spawn_egg"
deps = ["rigurd_trust"]
path = "light"
lane = -1
col = 2
text = """
Gobta has told everyone he is the strongest goblin in the forest. He is also the one who, later on, beats the
lizardman Gabiru in a duel (anime season 1, episode 11), so nobody laughs too hard. Today the boast is a horned
rabbit, and he wants a witness.

Kill five horned rabbits where he can hear about it.
"""
tasks = [{ type = "kill", entity = "tensura:horned_rabbit", count = 5 }]
rewards = [{ type = "item", item = "minecraft:cooked_chicken", count = 6 }, { type = "xp", xp = 50 }]

[[quests]]
key = "wolf_friend"
title = "Hear Me, Direwolves"
subtitle = "The riders of Tempest"
icon = "minecraft:bone"
deps = ["gobta_boast"]
path = "light"
lane = -1
col = 3
text = """
The goblins who fought the direwolves now ride them: after the naming the pack became the Tempest Wolves and the
goblins became their riders (anime season 1, episode 3). A town that holds the forest needs someone who can talk to the
wolves.

Win a direwolf over (tame one) and show Tempest the road is not only a fight.
"""
tasks = [{ type = "advancement", advancement = "tensura:hear_me_direwolves", title = "Tame a direwolf" }]
rewards = [{ type = "item", item = "minecraft:bone", count = 8 }, { type = "item", item = "tensura:bronze_coin", count = 3 }, { type = "xp", xp = 60 }]

[[quests]]
key = "fire_seat"
title = "A Seat at the Fire"
subtitle = "Rigurd's table"
icon = "minecraft:campfire"
deps = ["wolf_friend"]
path = "light"
lane = -1
col = 4
text = """
The goblins' campfire is where the old quarter eats and decides things. To sit there you bring something for the
pot; nobody asks what you have done, only whether you came with hands full.

Stand at the campfire and hand in eight cooked beef.
"""
tasks = [
  { type = "location", dimension = "minecraft:overworld", at = { anchor = "tempest", dx = 22, dz = -30 }, radius = 6, title = "The goblins' campfire" },
  { type = "item", item = "minecraft:cooked_beef", count = 8, consume = true },
]
rewards = [{ type = "item", item = "tensura:silver_coin", count = 1 }, { type = "item", item = "minecraft:golden_carrot", count = 4 }, { type = "xp", xp = 80 }]

# ---- Dark lane: The Outcast's Mark ----------------------------------------------------------------------

[[quests]]
key = "outcast_mark"
title = "The Outcast's Mark"
subtitle = "The dark road"
icon = "minecraft:soul_lantern"
deps = ["crossroads"]
path = "dark"
lane = 1
col = 1
text = """
Rigurd will not turn you out of Tempest, but he will not help you either: he points down the road. The Outcast Society
is the pack's own faction (our interpretation), reincarnators and monsters that every nation rejected. Its contact waits
where the road forks, out of the town's lamplight, and never gives a name.

Go to the fork south of the gate and be seen to come alone.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = { anchor = "tempest", dx = 0, dz = 52 }, radius = 14, title = "The Outcast contact on the south road" }]
rewards = [{ type = "item", item = "minecraft:bread", count = 6 }, { type = "item", item = "tensura:bronze_coin", count = 3 }, { type = "xp", xp = 50 }]

[[quests]]
key = "cull_wolves"
title = "The Cull"
subtitle = "Pelts for the Horde"
icon = "minecraft:leather"
deps = ["outcast_mark"]
path = "dark"
lane = 1
col = 2
text = """
Before the ogres and before the Orc Lord, the Orc Horde was only rumour on the wind. Its buyers pay for strength they
can use: direwolf pelts and proof that you do not flinch (our interpretation, foreshadowing the Orc War, anime season 1,
episode 10).

Kill eight direwolves. Where the light road tames the pack, the dark road thins it.
"""
tasks = [{ type = "kill", entity = "tensura:direwolf", count = 8 }]
rewards = [{ type = "item", item = "minecraft:cooked_porkchop", count = 6 }, { type = "xp", xp = 50 }]

[[quests]]
key = "outcast_toll"
title = "The Society's Toll"
subtitle = "Silence is paid for"
icon = "tensura:bronze_coin"
deps = ["cull_wolves"]
path = "dark"
lane = 1
col = 3
text = """
The Society takes in anyone and asks one thing in return: that it stays hidden. A toll keeps the hidden road open and
the watchers elsewhere. Pay it in bronze, the one coin every nation accepts without asking where it came from.

Hand in six bronze coins at the fork.
"""
tasks = [{ type = "item", item = "tensura:bronze_coin", count = 6, consume = true }]
rewards = [{ type = "item", item = "minecraft:bone", count = 8 }, { type = "item", item = "tensura:bronze_coin", count = 3 }, { type = "xp", xp = 60 }]

[[quests]]
key = "horde_envoy"
title = "The Horde's Envoy"
subtitle = "Empty huts, a waiting stranger"
icon = "minecraft:skeleton_skull"
deps = ["outcast_toll"]
path = "dark"
lane = 1
col = 4
text = """
Rigurd's tribe left its old village for Tempest, and the huts in the north-west stand empty. That makes them a fine
place to meet someone who should not be seen at a goblin fire: the Horde's envoy (our interpretation). He wants a strong
blade, and he already knows yours.

Walk the abandoned goblin village and wait for him.
"""
tasks = [{ type = "location", dimension = "minecraft:overworld", at = { landmark = "goblin_village" }, radius = 64, title = "The old goblin village" }]
rewards = [{ type = "item", item = "tensura:silver_coin", count = 1 }, { type = "item", item = "minecraft:cooked_beef", count = 4 }, { type = "xp", xp = 80 }]

