# Chapter 8 — The King's Test (Life 2, Act II of the story: Dwargon and Gazel Dwargo). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (Story extensions). Design: design/architecture/story-characters.md §1.1 (Gazel row), §2
# (Act II), §7 (WP-S6). Boss: design/data/bosses.toml `gazel_dwargo` (spawn kind "statue" at the throne, kill_rep
# `{ dwargon = -60, flag = "regicide", unless_flag = "honour_duel" }`); acts: design/data/story.toml [[act]] id = 2.
#
# Shape: three shared spine quests after the audience of chapter 3 (and Act I of chapter 7), then
#   LIGHT lane (path = "light", above, 5 quests): the honour duel. "Terms of Honour" sets the flag `honour_duel` (auto-claimed, so
#     it is never skipped), "Challenge the King" starts the fight, "The Honour Duel" waits for the kill. The flag makes the kill cost
#     nothing (bosses.toml `unless_flag`) and is spent by it. Then a smiths' pact for Kaijin and the word carried to Tempest.
#   DARK lane (path = "dark", below, 5 quests): two ways, one join (`min_deps = 1`). "Steal the schematics" (copy the plans of the forge
#     hall and the engineers' workshop) or "Regicide" (Take the Throne starts the fight, "Regicide" waits for the kill: Dwargon -60,
#     flag `regicide`). Both end at the Outcast contact. No honour flag is set, so the regicide costs what the doc says it costs.
#   Finale "The Armed Nation" (`min_deps = 1`): reward `ttl story act {p} 2` (Act II: light Dwargon +15; dark Dwargon -20, Outcast +10).
# Fights are path-free: a light soul may still regicide, a dark soul may still ask for the duel through Gazel's dialog; the quests
# only say which fight is "the" lane quest. A dark soul never holds `honour_duel` (only the light lane sets it).
#
# Rewards stay modest (food, a little XP, coins) and NEVER grant skills, races, evolutions or uniques (design/manas-integration.md §5(d));
# the boss's own coins and Skill Core come from bosses.toml, not from here.
#
# Places (blueprints/dwargon.py, world = the `dwargon` anchor + (bx - 74, bz - 120), see chapter 3; offsets are dx, dz from it):
#   royal terrace front (0, -91)   throne room (0, -106) radius 12   Kaijin's smithy (-12, -84)
#   forge hall (-22, -66)          engineers' workshop (22, -66)     market plaza (0, -66)
#   Tempest green: `tempest` + (0, -7)   Outcast contact on Tempest's south road: `tempest` + (0, 52), same spot as chapter 7 (OUR CHOICE)
# Our interpretation (not canon): the honour duel and the pact between the smiths; the Outcast Society's interest in Dwargon's forge plans.
# Canon anchor: Gazel exiles Kaijin and his men after the sham trial (anime season 1, episode 5), Tensura's own throne room greets a hero
# with "Oh? You want to have a training fight?" (lang `tensura.message.dwarf.king.greet.positive_start`).
# `/ttl story fight gazel_dwargo` needs the soul within 96 blocks of the throne (story.toml [rules] fight_near). A claimed "start the
# fight" reward cannot be claimed twice: if the call fails (cooldown 72 h, the King is already out), the same command can be typed or
# started from Gazel's "Talk" dialog (story.toml [[npc]] gazel).

[chapter]
key = "kings_test"
title = "The King's Test"
subtitle = "Gazel Dwargo weighs everyone who stands before his throne."
icon = "minecraft:golden_helmet"
order = 8
life = 2
hide_until_deps_complete = true
text = """
You have knelt before the King. Now he wants to know what kind of strength it was. The Hero King has ruled the Armed
Nation for three hundred years and has judged every petitioner himself, a sham trial against a smith included.
Whatever road you walk, the throne room is where it is measured.
"""

