[[quests]]
key = "good_name"
title = "A Good Name"
subtitle = "The deeds milestone"
icon = "minecraft:villager_spawn_egg"
deps = ["light_for_watch", "arrows_for_guard", "wool_for_cold", "keep_the_peace", "keeper_of_herds", "mortal_life/hired_help", "mortal_life/hero_of_the_village"]
min_deps = 3
lane = 0
shape = "gear"
size = 1.5
text = """
Any three of the deeds are enough. Feed, light, arm, warm, defend, keep a herd, raise an iron guardian or save a village: a village needs all of these and rarely
gets even one. Tick it off when you would not mind them telling the story.
"""
lore = "A name in the Realm is not what you are called. It is what people say when you leave the room."
karma = "Order and Valor are scored by what the world records; this milestone only says you did the rest."
tasks = [{ type = "checkmark", title = "I helped" }]
rewards = [{ type = "item", item = "minecraft:emerald", count = 6 }, { type = "item", item = "minecraft:experience_bottle", count = 6 }]

[[quests]]
key = "come_home"
title = "Come Home"
icon = "minecraft:bell"
deps = ["good_name"]
lane = 0
text = "Walk back to Wayfarer's Rest and stand at the bell where you began. See who is still there, and who has come in since."
lore = "The innkeeper does not say welcome back. She sets a place at the table, which is the same thing and keeps better."
karma = "Longevity: you stayed alive to come back."
tasks = [{ type = "location", dimension = "ttl:mortal_realm", at = [0, 0], radius = 24, title = "The bell at Wayfarer's Rest" }]
rewards = [{ type = "item", item = "minecraft:cake" }, { type = "xp", xp = 60 }]

# ---- The finale: every road in the book ends here ---------------------------------------------------------

[[quests]]
key = "ledger"
title = "The Ledger"
subtitle = "Five ways of life"
icon = "minecraft:writable_book"
deps = [
  "first_days/ready_for_road", "homestead/home_fires", "fields/harvest_home", "delving/deep_delver",
  "roads_ruins/cartographers_pride", "folk/friend_of_hamlet", "arts/master_hands", "nether_road/hellwalker", "end_road/dragons_eve",
]
min_deps = 5
lane = 1
col = 4
shape = "gear"
size = 1.5
text = """
Nine ways of life are open to a mortal here: the traveller, the householder, the farmer, the miner, the explorer, the villager,
the craftsman, the Nether-walker and the one who stood before the End. The Voice has written down every one you finished.
Five is enough: nobody does it all, and nobody is asked to.
"""
lore = "In a ledger, the zero entries are the ones that tell you most about a person."
karma = "Nothing is scored here: this only counts the milestones above."
tasks = [{ type = "checkmark", title = "I have lived" }]
rewards = [{ type = "item", item = "minecraft:experience_bottle", count = 10 }, { type = "item", item = "minecraft:golden_apple", count = 2 }]

[[quests]]
key = "legend"
title = "A Life That Counted"
subtitle = "The finale of the first life"
icon = "minecraft:nether_star"
deps = ["mortal_life/dragon", "mortal_life/days_30", "ledger", "come_home"]
lane = 0
