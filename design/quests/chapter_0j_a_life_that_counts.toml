# Chapter 0j — A Life That Counts (Life 1: good deeds, and the finale of the whole first life). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# Two halves. (1) Good deeds for other people: hand-ins (`consume = true`, submitted in the quest screen) of bread, torches, arrows and
# wool for a village's hungry, watchmen and cold, and statistics that really are scored (animals bred, raids won, trades). The honest
# karma line on the hand-ins says the book cannot see a gift: the Voice scores only what the world records (design/data/karma.toml),
# so a hand-in is not Order karma. It is a good deed for its own sake, and the small emerald or xp reward is not the reason. (2) The finale:
# "The Ledger" counts the capstones of the other chapters (min_deps = 5 of 9: any five ways of life), then "A Life That Counted" needs the
# Mortal Dragon (chapter 0), 30 days survived (chapter 0, A Full Life) and The Ledger, and mirrors the Legend tier (karma.toml: a great foe,
# 30 days, enough karma). The finale is a checkmark; the tier itself is scored by the karma engine at death, not by this book.
# Inspiration: Life in the Village 3 (a calm, descriptive village-helping quest tab), Prominence II's story-style closing chapter.
#
# Web: People of the Realm (chapter 0, `village`) starts the deed lane; chapter 0's `illagers`, `shepherd`, `hero_of_the_village` feed the three
# deed quests that follow them. All nine capstones feed The Ledger; the Ledger, the Mortal Dragon and a Full Life feed the finale.

[chapter]
key = "a_life_that_counts"
title = "A Life That Counts"
subtitle = "What you did for other people, and what it all adds up to."
icon = "minecraft:totem_of_undying"
order = -1
life = 1
text = """
A first life is short. The Voice of the World will weigh the dragons you killed, the ground you walked and the things you made,
and it will weigh something else too: who was warmer for having met you. This chapter does not ask for any of it. It only
leaves a door open.
"""

# ---- Deeds for other people ------------------------------------------------------------------------------

[[quests]]
key = "bread_for_hungry"
title = "Bread for the Hungry"
icon = "minecraft:bread"
deps = ["mortal_life/village"]
lane = 0
text = "Hand in sixteen loaves of bread, to be shared with the village's hungry. Nobody will check who the loaves go to; you will know."
lore = "A village that has had a bad winter does not say so. It only goes quiet near the bakery."
karma = "Not scored: the book cannot see a gift, and the Voice scores only what the world records. Do it anyway."
tasks = [{ type = "item", item = "minecraft:bread", count = 16, consume = true, title = "Hand in 16 bread" }]
rewards = [{ type = "item", item = "minecraft:apple", count = 4 }, { type = "xp", xp = 40 }]

