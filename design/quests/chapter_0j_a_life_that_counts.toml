karma = "Not scored."
tasks = [{ type = "item", item = "minecraft:arrow", count = 32, consume = true, title = "Hand in 32 arrows" }]
rewards = [{ type = "item", item = "minecraft:iron_nugget", count = 8 }, { type = "xp", xp = 40 }]

[[quests]]
