title = "Shield of the Village"
icon = "minecraft:white_banner"
deps = ["mortal_life/hero_of_the_village"]
lane = 3
col = 1
optional = true
text = "Win three raids that you did not bring: stand on the village's side when the horn sounds and be the last one standing."
