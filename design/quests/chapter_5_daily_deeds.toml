# Chapter 5 — Daily Deeds (repeatable chores for BOTH lives). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md.
#
# `life = "both"`: the chapter is shared by Life 1 and Life 2, so it follows the Life 1 rules (minecraft: items and
# entities only, no Tensura tasks; the generator enforces it) and gives only small vanilla rewards. The Life 2
# version with Tensura monsters and coins is chapter 6.
#
# Every quest is `repeatable` with a 24 h cooldown (FTB Quests `can_repeat` + `repeat_cooldown`, in seconds): claim all
# rewards, wait, and the tasks reset. Item tasks are hand-ins (`consume = true`, submitted in the quest screen) so they
# do not complete again at once. Kill tasks count fresh kills after each reset. The "wander" tasks are biome checks:
# stand in the biome to complete them. They are cheap by design; the cooldown is what makes them a daily reason to leave
# the house. No quest here is a deed of karma: Life 1 karma only counts what happens in the world.

[chapter]
key = "daily_deeds"
title = "Daily Deeds"
subtitle = "Small jobs that come back every day."
icon = "minecraft:clock"
order = 5
life = "both"
text = """
Every day there is wood to cut, mobs to clear and ground to cover. These quests reset a day after you claim them,
for as long as you live, in either life. The rewards are small: food, a few torches and some experience.
"""

