karma = "Faith: books feed enchanting, and every enchantment is +2."
tasks = [
  { type = "item", item = "minecraft:paper", count = 12 },
  { type = "item", item = "minecraft:writable_book" },
]
rewards = [{ type = "item", item = "minecraft:ink_sac", count = 4 }, { type = "xp", xp = 20 }]

[[quests]]
