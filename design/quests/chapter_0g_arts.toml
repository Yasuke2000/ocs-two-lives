# Chapter 0g — Hand and Cauldron (Life 1: the quiet crafts, books, maps, banners, stone and brewing). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (the Life 1 web). Vanilla only; every quest has `lore` and an honest `karma` line.
#
# Karma that really is scored (design/data/karma.toml): Faith for every enchantment (2), every brewing-stand use (0.5) and every
# advancement (2); Craft for anvil work (1) and smithing-table work (2). The workbench crafts here (loom, stonecutter, cartography)
# are not scored on their own. Potions are NOT asked for by type: an item task cannot tell a Healing potion from a Water Bottle, so
# the brewing quests ask for ingredients, bottles and uses of the stand (a custom statistic).
# Inspiration: Dawncraft-style "learn the crafts before the wilderness learns you" chapters, Prominence II's starter-crafts chapters.
#
# Web: Words of Power (chapter 0, `enchanting`) -> this chapter; the brewing lane starts at chapter 0's Local Brewery (`brewing`), the armour
# trims at The Smith's Art (`smithing`). "Master of Hand and Cauldron" is a capstone counted by "The Ledger" (chapter 0j).

[chapter]
key = "arts"
title = "Hand and Cauldron"
subtitle = "Ink, thread, stone and the slow science of potions."
icon = "minecraft:brewing_stand"
order = -4
life = 1
text = """
The Realm remembers its makers: the scribe, the weaver, the mason, the alchemist. None of them kill anything with their
art, and all of them outlive the people who do. Learn a craft and it will be useful in two lives.
"""

[[quests]]
key = "scribe"
title = "The Scribe's Table"
icon = "minecraft:writable_book"
deps = ["mortal_life/enchanting"]
lane = 0
text = "Craft twelve sheets of paper and a Book and Quill. Write something down: your route, a date, or the name of someone who helped you."
