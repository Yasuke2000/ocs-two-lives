# Chapter 9 — Two Hundred Thousand (Life 2, Act III of the story: the Orc War). Generated by tools/gen_quests.py.
# Format and rules: design/quests.md (Story extensions). Design: design/architecture/story-characters.md §1.1 (Orc Lord and Orc
# Disaster rows), §1.2 (Gabiru, Benimaru), §2 (Act III), §7 (WP-S7). Bosses: design/data/bosses.toml `orc_lord` (altar at the
# orc camp landmark) and `orc_disaster` (quest spawn at the battlefield, `requires = ["orc_lord"]`); act: design/data/story.toml
# [[act]] id = 3; flags `orcs_joined` (light) and `horde_leader` (dark).
#
# Shape: one shared spine quest after Act II (chapter 8's finale) and the war of chapter 4 (the marsh held, EP 10,000), then
#   LIGHT lane (path = "light", above, 7 quests): defend the alliance and spare the orcs. Gabiru's Pride (lizardmen's caverns) ->
#     The Great Clash (kill orcs on the battlefield) -> Face the Orc Lord (claim = `ttl story fight orc_lord`) -> Geld Falls (stage
#     `ttl.defeated.orc_lord`) -> The One Who Devours All (claim = `ttl story fight orc_disaster`) -> The Disaster Falls (stage
#     `ttl.defeated.orc_disaster`) -> Spare the Orcs (hand in food; the claim sets the flag `orcs_joined`: the orcs join Tempest).
#   DARK lane (path = "dark", below, 7 quests, same weight): side with the Horde and its hunger, betray the lizardmen. The Horde's
#     Welcome (orc camp) -> Raid the Caverns (kill lizardmen at their caverns) -> Take the Horde (claim = the Orc Lord fight) ->
#     Devour the King (the kill; the claim sets the flag `horde_leader`) -> The Champion Turns (claim = the Orc Disaster fight)
#     -> The Champion Falls -> The Horde Kneels (hand in rotten flesh).
#   Finale "The Orc War" (`min_deps = 1`): reward `ttl story act {p} 3` (Act III: light lizardmen +20, Tempest +10; dark Orc Horde
#     +40, lizardmen -20).
# Fights are path-free (owner request): a light soul may still lead the Horde, a dark soul may still spare the orcs by killing the
# Orc Lord for Tempest; the quests only say which fight is "the" lane quest. The flags are path-bound (story.toml): a soul only
# earns the flag of its own lane.
#
# Rewards stay modest (food, a little XP, bronze/silver coins) and NEVER grant skills, races, evolutions or uniques
# (design/manas-integration.md §5(d)); the bosses' own coins and rep come from bosses.toml, not from here.
#
# Places (all from chapter 4 / design/data/landmarks.toml; positions come from design/data/anchors.toml):
#   Tempest council longhouse (tempest + (0, -20)) radius 12 (chapter 2)   lizardmen_caverns radius 120 (chapter 4)
#   orc_camp / battlefield: radius 134 for "the marsh" (chapter 4); radius 40 where a claim starts a fight
#   `/place structure` puts the camp on the flattest of ~16 spots up to 64 blocks from the nominal point, and `ttl story fight` needs the
#   soul within 96 blocks of the boss arena's centre (story.toml [rules] fight_near), so the fight-start quests use the small radius 40
#   and say where the camp really is (`/ttl landmark where orc_camp`). The Orc Disaster arena is the nominal orc_camp point, radius 64.
# Our interpretation (not canon): the Outcast Society's and the Horde's agents on the dark road, the raid on the caverns (in the anime
# the lizardmen are the Orc Lord's first victims, and Gabiru seizes his father's seat on his own), and the spared orcs joining
# Tempest as a quest outcome (in the anime the orcs join the Jura alliance after Geld's death, episode 15).
# Canon anchors (anime season 1, English Wikipedia episode list, checked 18/11/2026): ep. 10 "The Orc Lord" (the ogres become
# kijin; Gelmud is behind the horde), ep. 11 "Gabiru Is Here!" (Gobta beats Gabiru; Treyni asks Rimuru to defeat the Orc Lord),
# ep. 12 "The Gears Spin Out of Control" (the Starved skill; Gabiru takes the chieftain's seat), ep. 13 "The Great Clash" (Rimuru's
# side rescues Gabiru's troops and the chieftain and breaks the army), ep. 14 "The One Who Devours All" (Geld devours Gelmud and
# becomes the Orc Disaster; the orcs are freed from Starved), ep. 15 "The Jura Forest Alliance" (lizardmen, goblins and orcs join,
# Gabiru is exiled). Light novel volume numbers were not verified for this arc.

[chapter]
key = "two_hundred_thousand"
title = "Two Hundred Thousand"
subtitle = "The Orc War is decided in the marsh."
icon = "minecraft:netherite_axe"
order = 9
life = 2
hide_until_deps_complete = true
text = """
The Orc Lord's army is two hundred thousand mouths and one hunger. Chapter 4 held the marsh; this chapter ends the war.
Geld is a king who ate his own, and the forest has two answers for him: stand beside the lizardmen and break him, or
kneel to the hunger and take his crown. Whatever road you walk, one of you ends the war and the other ends the Horde.
"""

