# Example canon build: every field of design/builds/<name>.toml. Files whose name starts with an underscore are
# ignored by tools/gen_data.py. A real build is one file per structure: blueprints/<name>.py ->
# `python tools/build_structures.py <name>` -> design/builds/<name>.toml -> `python tools/gen_data.py` (reads the
# structure files, converts the landmark to world x/z, checks everything, writes TtlData.builds and the ground
# footprints in generated/builds.js). life/builds.js places the build in the game; see docs/server.md "Canon builds".
#
# gen_data fails on: an unknown field, a landmark name that is not in pack/config/ttl/canon_regions.json
# (matched exactly), no structure file (<name>.nbt or <name>_0.nbt ...), an anchor outside the structure.
# It only warns when the spot is sea (or a river) in canon_map.txt, or two builds are < 40 blocks apart.

# Required. Equals the file name and the blueprint / structure name (a-z 0-9 _). Structure ids are
# ttl:<name>, or ttl:<name>_0, _1, ... for PARTS builds (slabs placed one by one, stacked along z).
name = "example_town"

# Required. Shown to a player who walks into the build for the first time (a title on screen).
title = "Example Town — the mayor's square"

# Where: the exact `name` of a landmark in canon_regions.json "landmarks" (reference-map pixels; the world spot is
# (ref - origin) x width / 2570, the same conversion tools/gen_data.py uses for design/data/landmarks.toml) ...
landmark = "Blumund capital (Londo)"
# ... or explicit world x/z. When both are given x/z win (use it to move the build off the exact pixel, e.g. onto
# land). Give both or neither; one of the two ways is required.
# x = 3103
# z = -52

# Required. Blueprint coordinates [x, y, z] of the point that lands on the spot: the walking level, so the block
# at y - 1 is the ground layer (y must be 1 or more). The placer puts this point on x, z and the surveyed or fixed y.
anchor = [45, 5, 57]

# "survey" (default): the flattest dry land (little water, see max_wet; no lava) within `search` blocks of x/z, terrain-fitted.
# "fixed": exactly x/z at the world y below (flat dimensions, tests); needs y.
ground = "survey"
# y = 64

# Survey radius in blocks, 0..192 (default 48). The area worked on is box + margin + search all round, up to
# 1000 blocks wide. Big builds find a flat spot more easily with a larger radius, but then drift off the canon point.
search = 48

# Default 0.1, 0..0.5: the share of the build's columns that may stand over water or ice (a stream, a pond). A big
# box nearly always crosses some water; the survey scores it (10 % water costs as much as 32 blocks of distance) and
# the terrain fit fills those columns from the bed up. More than this share rules a spot out; lava always does.
max_wet = 0.1

# Dimension id (default "minecraft:overworld": the Tensura world). A world reset of that dimension places the
# build again (survey again, on the new terrain).
dimension = "minecraft:overworld"

# Default 1. Bump it to place the build again on the next start: the new version goes over the old one at the same
# corner (blocks of the old version the new one does not overwrite stay). Changing x/z/ground/y/anchor surveys
# a new spot instead and leaves the old copy where it was.
version = 1

# Default true: above the highest block of every column of the box (and the cut round it) trees and hills go, up to
# the sky. false leaves the terrain above the build alone (a cave mouth, a build meant to sit in a hill).
# Under the build the placer always fills the gap down to the terrain, so nothing floats: put explicit air into
# the blueprint wherever the inside must stay open.
clear_above = true

# Default false: drain the water out of the box before placing (a build cut deep below the water table). `place template`
# keeps the old terrain's water, so stairs, slabs and walls on a flooded cell come out waterlogged and feed a puddle for
# good. Leave it false for builds that stand in or beside water (harbours, pools): their own water blocks are placed after
# the drain anyway, but undefined cells of a lake in the box would be drained too. A re-placement over an old copy cannot
# repair waterlogged blocks of version N-1 (they keep their water): fix those by hand.
dry = false

# Default 8, 0..16: columns round the box that get a 1:1 earth skirt below the ground layer and a 1:1 cut above it.
margin = 8

# Optional: a landmark of design/data/landmarks.toml the build belongs next to (Treyni's shrine: "treyni_grove"). The
# survey keeps every other placed thing 24 blocks (plus margin) away; for this landmark only the margin stays off the
# box the landmark's structure recorded, so the build can stand right beside it. Setting or changing it surveys anew.
# beside = "treyni_grove"

# Terrain repair (life/repair.js; docs/server.md "Terrain repair"), after the terrain fit and before the second slab
# pass, on the real blocks: under every box column the build defines, air, water, lava and plants in the
# `repair_depth` blocks below its lowest block become ground (caves, sinkholes, a ravine running under the edge; never
# inside the build, nothing over the void); box columns the blueprint leaves undefined get the ground layer at the
# ground height (no ditches); in a ring of `repair_margin` columns round the box, pits, crevices, slits and ravine
# edges are filled to their rim (never above the ground layer, never below the 1:1 skirt), cave mouths just under the
# surface are closed, water touching the box is banked up, lava is filled or cleared and fire put out. Logs
# `[ttl] build <name>: repaired N foundation, M skirt, K lava`. Default true; false leaves the terrain as the fit made it.
repair = true
# Default 48, 1..96: how deep under the build gaps are filled.
repair_depth = 48
# Default 8, 0..16: the ring round the box (the forceloaded area grows to max(margin, repair_margin) + 2).
repair_margin = 8
# Default false: true keeps every water block (a build that sits on a lake or a river: Raja); air, lava and fire are
# still repaired.
repair_keep_water = false

# Optional free text; not used by the game.
notes = "What the build is and which canon sources it follows (design/lore/<name>.md)."
