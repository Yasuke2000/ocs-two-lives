# Dryad altar beside Treyni's ancient tree (blueprints/treyni_shrine.py, design/lore/treyni_shrine.md). The tree itself is
# the landmark treyni_grove (design/data/landmarks.toml, tensura:ancient_forest/tree, about 38 x 41 blocks, surveyed up to
# 64 blocks from its nominal spot). Its nominal spot is design/data/anchors.toml treyni_shrine: the grove's anchor
# (1920, 1540, Lerfing's map) plus 38 east, as on the old continent. `beside` lets the shrine stand
# next to the tree: the placer keeps only its terrain margin off the tree's recorded bounding box (instead of the 24-block
# keepout every other placed thing gets), so it lands just east of the crown and inside the site, not 61 blocks east in
# Jura's ancient forest as version 3 did (19/11/2026).
name = "treyni_shrine"
title = "Treyni's shrine"
landmark = "Treyni's grove (Dryad sanctuary)"
anchor = [16, 5, 16]
ground = "survey"
search = 48
dimension = "minecraft:overworld"
version = 4
beside = "treyni_grove"
clear_above = true
margin = 8
notes = "Small mossy dais with a young azalea tree and three seats for the dryad sisters; our interpretation (design/lore/treyni_shrine.md)."
