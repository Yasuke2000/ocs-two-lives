# Canon relations of the new Tensura world map (checked by tools/world/map_check.py against the sites of world/map.svg).
# Design: design/architecture/own-world.md section 2.4 (canon geography) and 6.1 rule 6.
#
# [[relation]]: "a is <dir> of b, min..max blocks apart" (centre of the site to centre of the site).
#   a, b     anchor ids of design/data/anchors.toml
#   dir      N NNE NE ENE E ESE SE SSE S SSW SW WSW W WNW NW NNW: the compass bearing from b to a (north is up, smaller y).
#            near / any: only the distance is checked
#   tol      allowed deviation of the bearing in degrees; default 45 for N/E/S/W, 35 for NE/SE/SW/NW, 25 for the 16-wind names
#   bearing  [lo, hi] compass degrees instead of dir + tol (wraps through 0, so [330, 30] is north)
#   min,max  block distance range (min defaults to 0, max to no limit)
#   source   the lore file under design/lore/ that supports the relation (tests/test_map_check.py checks it exists)
#   note     what the lore says, in a line
# [[site_rule]]: id + source, and any of x_min x_max y_min y_max (centre), inside = "mountains" | "mountains_or_hills" |
#   "forests" (+ forest_types = [...]), near_road = <blocks> (+ road_kind = "main"), lake_width_min = <blocks>.
# [[gap]]: the sea between the landmasses of sites a and b is min..max blocks wide (landmass = coast polygon).
#
# Only relations the lore supports are listed: directions and neighbours come from design/lore/*.md (mostly world.md) and
# its pack copy docs/chatgpt/world.md. Pack inventions (the wayfarers' camp, the Outcast, the rookie camp, the old well, the
# road camps, Hinata's ambush spot, the pins Filtwood/Ghastone/Rostia/Sainte Malukshure, Yggdonia) have no relation: the map
# is free to put them anywhere in their region.
#
# Distances follow the new scale (design/architecture/own-world.md 2.3: Tempest->Dwargon about 1,400, Blumund 1,900, Lake
# Siss 1,100, Laura 2,200, Nasca 3,300, Heaven Tower 4,200; mainland about 9,500 x 7,000). The six ranges the design fixes
# are used as given; every other range runs from about 0.65 to 1.4 times the reference distance of the starter template
# (the old Lerfing map times about 0.75, lore: design/lore/world.md "Distances from the Tempest arrival point").

