# BlueMap core settings for the Two Lives server (homelab node3, 2 CPU guaranteed, game heap 7 GB in a 10-12 GiB pod).
# The renderer shares the game's JVM and CPU: keep it to one low-priority thread.

# OWNER DECISION, left false on purpose: BlueMap downloads the Minecraft client jar (Mojang EULA, ~25 MB) to read
# vanilla textures/models. Set true only after the owner has read https://aka.ms/MinecraftEULA and agrees.
# Until then BlueMap logs a notice and renders nothing; the server itself runs normally.
accept-download: false

# Render state, web files and tiles. Relative to the server folder, so it lives on the world volume (/data/bluemap).
data: "bluemap"

# One render thread; ties up one of the 2 guaranteed CPUs. Raise only while nobody plays (e.g. 2 for the first render).
render-thread-count: 1
render-thread-priority: 2

# Re-render a changed region at most once a minute; BlueMap's full re-check every 24 h and region scan every 5 min.
update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5

# Reads textures/models of the installed mods (Tensura, Create, ...) so their blocks are not purple.
scan-for-mod-resources: true

# No anonymous usage statistics to the BlueMap developer.
metrics: false
