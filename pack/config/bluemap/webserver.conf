# BlueMap's built-in web server. The pack only opens it; exposing it (Service, tunnel) is in the Homelab repo
# (see docs/server.md "Web map (BlueMap)"). It serves a read-only map with no login; plugin.conf keeps live
# player positions off, so whoever has the link sees terrain, builds and our markers only.

enabled: true
webroot: "bluemap/web"

# Default 8100. The Kubernetes Service and tunnel route must point at this port.
port: 8100

# Live marker/tile pushes to open browsers.
sse-enabled: true
