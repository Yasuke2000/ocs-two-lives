# LuckPerms for OCS Tensura: Two Lives. Only the keys the pack sets; every other key keeps LuckPerms' default.
# Groups and their permissions are NOT in this file: they live in the LuckPerms database. The pack keeps them as
# commands in ttl-groups.txt (apply with the loop in docs/server.md "Permissions (LuckPerms)").

# Context name of this server. Nothing sets per-server permissions, so everything stays "global".
server = "global"

# The H2 file database sits next to this file (luckperms-h2-v2.mv.db) on the world volume and is never shipped
# in the pack. Do not switch to a yaml/json store: the pack rewrites this folder from git at each start.
storage-method = "h2"

# Ops can use /lp even before any group exists (bootstrap); everyone else needs `luckperms.*` nodes.
commands-allow-op = true

# Staff see permission changes in game and in the console.
log-notify = true

# Remote changes (another node, a file edit) are not used: single server.
sync-minutes = -1
watch-files = false

# A player's group name is stable (default < linked < modder < staff, ordered by group weight).
primary-group-calculation = "parents-by-weight"
