# INACTIVE REVIEW COPY. Only Sainte region H -> O differs from canonical anchors.
# Every canon place of the Tensura world (Life 2 overworld) in Lerfing's coordinates: the one table the other data
# translates from (design/architecture/lerfing-import.md §3.2-3.5). World 0, 0 is Lerfing's 0, 0 (his spawn chest is at
# -453, 73, 979); nothing in his map is shifted. `python tools/gen_data.py` checks this file (ids, regions, links to
# canon_regions.json landmarks, builds and landmarks.toml, dx/dz offsets, Lerfing's keepouts) and
# tests/test_lerfing_anchors.py checks it against canon_map.txt (land, water, region letter).
#
# Format: one [<id>] table per anchor, `key = value` lines of integers, booleans or "strings" (the ttl-portals
# CanonGrid self-check reads x/z of every [table] with a tiny parser and checks each lies on the continent):
#   <id>     the table name, unique [a-z0-9_]; the name scripts, quests and tests use (`${anchor:<id>}`)
#   name     what it is
#   title    optional short name for /locate place and /ttl where (default: name up to the first " (" or ":")
#   x, z     world block position (the survey/placement centre for builds and landmarks)
#   region   the canon_map.txt letter it must stand in; for water anchors, the nation that owns the water (any of
#            several letters may be given, "MB" = M or B)
#   kind     settlement (Tempest, Dwargon: own scripts), arrival (Life 2 world spawn), build (design/builds), landmark
#            (design/data/landmarks.toml, a Tensura structure), pin (a map label only), spot (an NPC, boss, quest
#            or camp point)
#   surface  land (dry ground in the land mask), water (a lake, river or sea), shore (either), any
#   canon    the pack/config/ttl/canon_regions.json landmark it positions (its `at` must equal x, z)
#   build    the design/builds/<name>.toml it positions (gen_data takes the build's x/z from here; the build file has none)
#   landmark the design/data/landmarks.toml name it positions (likewise)
#   of, dx, dz  relative anchors: x = <of>.x + dx, z = <of>.z + dz (the scripts keep the offsets, the table the result)
#   old_x, old_z  the position on the old generated continent (for the translation; nothing reads it at runtime)
#   map      false = no BlueMap marker (internal spots)
#   notes    why here (the probe numbers are from Lerfing's analysis rasters: ground y p10/p50/p90 over 96 x 96)
#
# [keepout.<id>] (x0, z0, x1, z1; no x/z, so the self-check skips them): Lerfing's and Paulzero's own builds, kept 1:1
# (owner, 19/11/2026). No build, landmark or settlement anchor may stand inside one, no build's box + margin + search may
# reach one and no landmark's reach + 64 (gen_data); pins and water spots may (Lake Siss is the lake village's lake).
#
# Other data names an anchor instead of repeating its numbers (tools/anchor_refs.py): builds and landmarks through the
# `build`/`landmark` fields here, arrival.toml / npcs.toml / sidequests.toml with at = "<id>", bosses.toml arenas and
# artifice.toml's smithy with { anchor = "<id>", dx, dz }. gen_data writes the resolved x/z into generated/data.js and
# this table into generated/anchors.js (TtlAnchors; life/tempest.js reads Tempest's position from it).

