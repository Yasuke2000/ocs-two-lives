, z-1503..-1495, are exactly146 in the designed surface.</text><text x="65" y="698" font-family="Arial" font-size="17" fill="#203b3d">The upper surface over the gate is roof rock; the placed blueprint supplies the lower entrance and tunnel.</text><text x="65" y="734" font-family="Arial" font-size="17" fill="#203b3d">All3,179 roof columns keep at least six blocks of cover; all58 exported site records and anchor tuples stay fixed.</text><text x="65" y="770" font-family="Arial" font-size="17" fill="#203b3d">Only height raster changes:9,893 cells. Water, biome, road/site/exclusion masks and ruggedness stay identical.</text><text x="65" y="806" font-family="Arial" font-size="17" fill="#203b3d">Two road height profiles change; nineteen are retained. Maximum exported grade remains0.5 within float epsilon.</text><text x="65" y="842" font-family="Arial" font-size="17" fill="#203b3d">Rounded foothill and forecourt dimensions are our interpretation; sources establish the foothill/cavern context.</text><text x="65" y="878" font-family="Arial" font-size="17" fill="#203b3d">This resolves the measured offline join. Actual placement, repairs, era gating and walkability still need Minecraft.</text></svg>