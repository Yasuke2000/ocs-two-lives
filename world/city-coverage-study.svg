<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150"><rect width="1800" height="1150" fill="#eee8db"/><text x="65" y="62" font-family="Arial,sans-serif" font-size="36" fill="#263f3c">CITY COVERAGE — DWARGON + ENGLASSIA</text><text x="65" y="105" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Non-geographical schematic: no scale, floor plan, compass bearing or new world coordinates.</text><rect x="65" y="155" width="800" height="875" rx="18" fill="#f8f4e9"/><rect x="935" y="155" width="800" height="875" rx="18" fill="#f8f4e9"/><text x="95" y="208" font-family="Arial,sans-serif" font-size="28" fill="#263f3c">DWARGON / existing country context</text><rect x="95" y="240" width="740" height="140" rx="12" fill="#d8e4dd" stroke="#b9b6a3"/><text x="115" y="275" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Existing reservations: gate + inner Central</text><text x="115" y="310" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Registered dwargon/dwargo anchors establish server terrain capacity</text><text x="115" y="339" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">only. They are not the full three-city country.</text><rect x="95" y="420" width="225" height="180" rx="12" fill="#e5e5d6" stroke="#b9b6a3"/><text x="115" y="455" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Central</text><text x="115" y="490" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Capital. Exact</text><text x="115" y="519" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">interior plan</text><text x="115" y="548" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">remains</text><text x="115" y="577" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">unverified.</text><rect x="350" y="420" width="225" height="180" rx="12" fill="#efddbc" stroke="#b9b6a3"/><text x="370" y="455" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">East city</text><text x="370" y="490" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Distinct city. No</text><text x="370" y="519" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">reliable site</text><text x="370" y="548" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">coordinate</text><text x="370" y="577" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">established.</text><rect x="605" y="420" width="230" height="180" rx="12" fill="#efddbc" stroke="#b9b6a3"/><text x="625" y="455" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">West city</text><text x="625" y="490" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Distinct city.</text><text x="625" y="519" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Names are not a</text><text x="625" y="548" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">surveyed compass</text><text x="625" y="577" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">layout.</text><rect x="95" y="635" width="740" height="120" rx="12" fill="#dbe5ee" stroke="#b9b6a3"/><text x="115" y="670" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Butterflies of the Night</text><text x="115" y="705" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Existing blueprint names this venue; source fidelity, new-terrain</text><text x="115" y="734" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">fit and runtime placement remain unchecked.</text><text x="95" y="810" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">WIK-DWG-002/003: indexed Dwargon article. Three-city identity</text><text x="95" y="840" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">and venue membership are secondary evidence; no underground</text><text x="95" y="870" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">tunnels or new entrances are inferred.</text><text x="95" y="950" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">Blue:3 existing authored designs located. Amber:4 records still</text><text x="95" y="980" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">lack distinct mapped representation.</text><text x="965" y="208" font-family="Arial,sans-serif" font-size="28" fill="#263f3c">ENGLASSIA / country + capital context</text><rect x="965" y="240" width="740" height="140" rx="12" fill="#d8e4dd" stroke="#b9b6a3"/><text x="985" y="275" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Existing reservation: englassia / Lura</text><text x="985" y="310" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">One capital terrain reservation does not certify completed</text><text x="985" y="339" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">institutions, districts or a full walled city.</text><rect x="965" y="420" width="355" height="160" rx="12" fill="#dbe5ee" stroke="#b9b6a3"/><text x="985" y="455" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Free Guild headquarters</text><text x="985" y="490" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Existing guild() blueprint.</text><text x="985" y="519" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Source places HQ in Lura; exact</text><text x="985" y="548" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">canon layout and new-world fit</text><text x="985" y="577" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">unverified.</text><rect x="1350" y="420" width="355" height="160" rx="12" fill="#efddbc" stroke="#b9b6a3"/><text x="1370" y="455" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Council premises</text><text x="1370" y="490" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Englassia headquarters context;</text><text x="1370" y="519" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">exact parcel and assembly plan</text><text x="1370" y="548" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">unresolved.</text><rect x="965" y="610" width="355" height="160" rx="12" fill="#dbe5ee" stroke="#b9b6a3"/><text x="985" y="645" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Freedom Academy</text><text x="985" y="680" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Existing academy() blueprint.</text><text x="985" y="709" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Canon plan, initial-era detail</text><text x="985" y="738" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">and current-map fit still need</text><text x="985" y="767" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">review.</text><rect x="1350" y="610" width="355" height="160" rx="12" fill="#efddbc" stroke="#b9b6a3"/><text x="1370" y="645" font-family="Arial,sans-serif" font-size="23" fill="#263f3c">Royal castle</text><text x="1370" y="680" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">Existing WN lake/castle</text><text x="1370" y="709" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">reference is separate</text><text x="1370" y="738" font-family="Arial,sans-serif" font-size="19" fill="#263f3c">continuity evidence (C17).</text><text x="965" y="820" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">OFF-EDU-001 supports Shizu teaching children in Englassia.</text><text x="965" y="850" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">Wiki premises claims remain separate from the official</text><text x="965" y="880" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">synopsis and from current server geometry.</text><text x="965" y="950" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">S1E10 snapshot: old places and later visits are distinct;</text><text x="965" y="980" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">residents and building condition need their own checks.</text><text x="65" y="1090" font-family="Arial,sans-serif" font-size="20" fill="#263f3c">Green: terrain reservation. Blue: authored design exists, unverified in new world. Amber: missing representation. Boxes are not geography.</text></svg>